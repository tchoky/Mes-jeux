<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteurs Production</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --info-bg: #eff6ff;
      --info-border: #bfdbfe;
      --line-accent: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      max-width: 960px;
      margin: 0 auto;
    }

    button,
    .step-btn,
    .mini-step-btn,
    .cons-step-btn,
    .abc-btn,
    .clock-btn,
    .cons-row,
    .eye-btn,
    .page-tab-btn {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    /* Bandeau tout en haut : Horloge + Cadence juste à droite de l'heure */
    .cadence-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .clock-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 9px;
      border: 1px solid #94a3b8;
      background: #f8fafc;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }

    .clock-btn:hover {
      background: #e2e8f0;
    }

    .cadence-badge {
      color: var(--primary);
      font-size: 1rem;
      font-weight: 900;
    }

    /* En-tête Total PF : App + Grand chiffre principal coloré selon la page */
    .top-card {
      background: var(--card);
      border: 2px solid var(--line-accent);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }

    .top-app-only {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--text);
    }

    .top-value {
      font-size: 1.9rem;
      font-weight: 900;
      color: var(--line-accent);
    }

    /* Deuxième bloc : Verre + 5 boutons L1..LP dans l'espace inférieur droit */
    .glass-fixed-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .glass-line-1 {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 10px;
    }

    .glass-bottom-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .page-tabs-box {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .page-tab-btn {
      padding: 7px 11px;
      border-radius: 9px;
      border: 2px solid transparent;
      font-size: 0.85rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.12s ease;
    }

    .page-tab-btn:active {
      transform: scale(0.96);
    }

    .page-tab-btn.active {
      box-shadow: 0 0 0 2px #0f172a;
      transform: translateY(-1px);
    }

    .tab-l1 {
      background: #dbeafe;
      color: #1d4ed8;
      border-color: #2563eb;
    }
    .tab-l1.active {
      background: #2563eb;
      color: #ffffff;
    }

    .tab-l2 {
      background: #fef9c3;
      color: #854d0e;
      border-color: #eab308;
    }
    .tab-l2.active {
      background: #eab308;
      color: #0f172a;
    }

    .tab-l3 {
      background: #dcfce7;
      color: #15803d;
      border-color: #16a34a;
    }
    .tab-l3.active {
      background: #16a34a;
      color: #ffffff;
    }

    .tab-l4 {
      background: #fef9c3;
      color: #854d0e;
      border-color: #eab308;
    }
    .tab-l4.active {
      background: #eab308;
      color: #0f172a;
    }

    .tab-lp {
      background: #ffedd5;
      color: #c2410c;
      border-color: #f97316;
    }
    .tab-lp.active {
      background: #f97316;
      color: #ffffff;
    }

    .glass-line-2 {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      margin-top: 8px;
    }

    .glass-line-2.err {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .glass-line-2.ok {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    .field {
      display: flex;
      flex-direction: column;
      min-width: 105px;
    }

    .field label {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .field input[type="number"],
    .field input[type="text"],
    .field input[type="time"] {
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.98rem;
      width: 100%;
      background: #fff;
    }

    .field input.pref-input {
      background: #e2e8f0;
      color: #64748b;
      font-weight: 800;
    }

    .field input.pref-input.edited {
      background: #ffffff;
      color: var(--text);
    }

    .ref-row {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .ref-prefix {
      padding: 8px 9px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #f1f5f9;
      color: #475569;
      font-size: 0.86rem;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .abc-btn {
      padding: 8px 7px;
      border-radius: 8px;
      border: 1px solid #94a3b8;
      background: #e2e8f0;
      color: var(--text);
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .abc-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .step-btn {
      width: 32px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid #94a3b8;
      background: #e2e8f0;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-btn:active {
      transform: scale(0.96);
      background: #cbd5e1;
    }

    .step-num-inp {
      width: 64px !important;
      text-align: center;
      padding: 7px 6px !important;
    }

    .step-num-wide {
      width: 78px !important;
      text-align: center;
      padding: 7px 6px !important;
    }

    .empty-box {
      background: var(--card);
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 14px;
    }

    .line-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .line-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .line-header.has-details {
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
    }

    .line-identity {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill-fruit {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      font-size: 0.96rem;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 7px;
    }

    .eye-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .eye-btn:active {
      background: #e2e8f0;
    }

    .line-tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mini-stepper {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 3px 6px;
      font-size: 0.84rem;
      font-weight: 800;
    }

    .mini-step-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid #94a3b8;
      background: #e2e8f0;
      color: var(--text);
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .mini-step-btn:active {
      background: #cbd5e1;
    }

    .line-meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .consumables-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cons-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      cursor: pointer;
      transition: transform 0.08s ease;
    }

    .cons-row:active {
      transform: scale(0.99);
    }

    .cons-row.err {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .cons-row.ok {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    .cons-text {
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.3;
      flex: 1;
    }

    .cons-right-controls {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .cons-step-btn {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      border: 1px solid #94a3b8;
      background: #ffffff;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .cons-step-btn:active {
      background: #e2e8f0;
    }

    .line-end-time {
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      font-size: 0.9rem;
      font-weight: 900;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .bottom-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 18px 0 12px;
    }

    button.btn {
      padding: 11px 18px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-add { background: var(--success); color: #fff; }
    .btn-add:hover { background: #15803d; }
    .btn-reset { background: var(--danger); color: #fff; }
    .btn-reset:hover { background: #b91c1c; }
    .btn-pdf   { background: var(--primary); color: #fff; }
    .btn-pdf:hover { background: var(--primary-hover); }
    .btn-sec   { background: #e2e8f0; color: var(--text); }
    .btn-mini  { padding: 7px 11px; font-size: 0.84rem; border-radius: 8px; }
    .btn-del   { background: #fee2e2; color: var(--danger); }

    /* Modales */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-bg.open {
      display: flex;
    }

    .modal-panel {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 1.05rem;
      font-weight: 900;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .fmt-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .fmt-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 7px 6px;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      background: #f8fafc;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }

    #print-area { display: none; }

    @media print {
      body { background: #fff; padding: 0; }
      .cadence-bar, .top-card, .glass-fixed-card, #lines-list, .bottom-bar, .modal-bg { display: none !important; }
      #print-area { display: block !important; }
      .p-card { border: 1px solid #bbb; border-radius: 8px; padding: 10px; margin-bottom: 12px; page-break-inside: avoid; }
    }
  </style>
</head>
<body>

  <!-- TOUT EN HAUT : HORLOGE + CADENCE JUSTE À DROITE DE L'HEURE -->
  <div class="cadence-bar">
    <button type="button" class="clock-btn" onclick="openClockModal()">
      <span>🕒</span>
      <span id="live-clock-text">--:--</span>
    </button>
    <div class="cadence-badge" id="cadence-val">0 app/h</div>
  </div>

  <!-- PREMIÈRE PAGE : APP + GRAND CHIFFRE PRINCIPAL COLORÉ -->
  <div class="top-card" id="main-top-card">
    <div class="top-app-only">App : <span id="top-app-val">0</span></div>
    <div class="top-value" id="top-total">0</div>
  </div>

  <!-- DEUXIÈME BLOC : VERRE + 5 BOUTONS L1..LP -->
  <div class="glass-fixed-card">
    <div class="glass-line-1">
      <div class="field" style="flex:0 0 auto;">
        <label>Nb verre / app</label>
        <div class="stepper">
          <button type="button" class="step-btn" data-repeat-fn="stepVerPerApp" data-repeat-delta="-50">-</button>
          <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-num-wide" id="g-ver-app" value="3500">
          <button type="button" class="step-btn" data-repeat-fn="stepVerPerApp" data-repeat-delta="50">+</button>
        </div>
      </div>
      <div class="field" style="flex:0 0 auto;">
        <label>Nb / palette</label>
        <div class="stepper">
          <button type="button" class="step-btn" data-repeat-fn="stepGlassPerPal" data-repeat-delta="-100">-</button>
          <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-num-wide" id="g-ver-pal" value="4000">
          <button type="button" class="step-btn" data-repeat-fn="stepGlassPerPal" data-repeat-delta="100">+</button>
        </div>
      </div>
    </div>

    <div class="glass-bottom-row">
      <div class="field" style="flex:0 0 auto;">
        <label>Nb palettes</label>
        <div class="stepper">
          <button type="button" class="step-btn" data-repeat-fn="stepGlassPallets" data-repeat-delta="-1">-</button>
          <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-num-inp" id="g-ver-stk" placeholder="0">
          <button type="button" class="step-btn" data-repeat-fn="stepGlassPallets" data-repeat-delta="1">+</button>
        </div>
      </div>

      <div class="page-tabs-box" id="page-tabs-box">
        <button type="button" class="page-tab-btn tab-l1 active" data-page="L1" onclick="switchPage('L1')">L1</button>
        <button type="button" class="page-tab-btn tab-l2" data-page="L2" onclick="switchPage('L2')">L2</button>
        <button type="button" class="page-tab-btn tab-l3" data-page="L3" onclick="switchPage('L3')">L3</button>
        <button type="button" class="page-tab-btn tab-l4" data-page="L4" onclick="switchPage('L4')">L4</button>
        <button type="button" class="page-tab-btn tab-lp" data-page="LP" onclick="switchPage('LP')">LP</button>
      </div>
    </div>

    <div class="glass-line-2" id="g-ver-status">
      <span>Stock : 0 📜</span>
      <span>PF : 0</span>
    </div>
  </div>

  <div id="lines-list"></div>

  <!-- BOUTON AJOUT -->
  <div class="bottom-bar">
    <button type="button" class="btn btn-add" onclick="openAddAppModal()">➕ Ajout</button>
    <button type="button" class="btn btn-reset" onclick="resetAll()">🔄 Reset</button>
    <button type="button" class="btn btn-pdf" onclick="printReport()">🖨️ PDF</button>
  </div>

  <!-- MODALE AJOUT : FRUIT + NB APP -->
  <div class="modal-bg" id="add-modal">
    <div class="modal-panel">
      <div class="modal-head">
        <span>➕ Ajout</span>
        <button type="button" class="btn btn-sec btn-mini" onclick="closeAddModal()">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <div class="field">
          <label>Fruit</label>
          <input type="text" inputmode="text" id="add-fruit" placeholder="Fruit 1">
        </div>
        <div class="field">
          <label>Combien d'app ?</label>
          <div class="stepper">
            <button type="button" class="step-btn" data-repeat-fn="stepAddApps" data-repeat-delta="-1">-</button>
            <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-num-inp" id="add-nb-app" value="1">
            <button type="button" class="step-btn" data-repeat-fn="stepAddApps" data-repeat-delta="1">+</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sec" onclick="closeAddModal()">Annuler</button>
        <button type="button" class="btn btn-add" onclick="confirmAddLine()">Valider ✓</button>
      </div>
    </div>
  </div>

  <!-- MODALE HORLOGE -->
  <div class="modal-bg" id="clock-modal">
    <div class="modal-panel">
      <div class="modal-head">
        <span>🕒 Prod & Cadence</span>
        <button type="button" class="btn btn-sec btn-mini" onclick="closeClockModal()">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div class="field">
          <label>Heure début prod</label>
          <input type="time" id="clk-start">
        </div>
        <div class="field">
          <label>Heure fin de prod</label>
          <input type="time" id="clk-end">
        </div>
        <div class="field">
          <label>Nb app rempli</label>
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="clk-done-app" placeholder="0">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sec" onclick="closeClockModal()">Annuler</button>
        <button type="button" class="btn btn-add" onclick="saveClockModal()">Valider ✓</button>
      </div>
    </div>
  </div>

  <!-- MODALE CLIC SUR LIGNE CONSOMMABLE : ETI / CRC / CCT -->
  <div class="modal-bg" id="cons-modal">
    <div class="modal-panel">
      <div class="modal-head">
        <span id="cons-title">Détail</span>
        <button type="button" class="btn btn-sec btn-mini" onclick="closeConsModal()">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div class="field" id="cons-ref-wrap" style="display:none;">
          <label id="cons-ref-label">Emplacement : ETI</label>
          <div class="ref-row">
            <span class="ref-prefix" id="cons-ref-prefix">ETI</span>
            <input type="text" inputmode="numeric" id="cons-ref-val" placeholder="">
            <button type="button" class="abc-btn" id="cons-ref-abc" onclick="toggleAbc('cons-ref-val', this)">ABC</button>
          </div>
        </div>
        <div class="field">
          <label id="cons-per-box-label">Nombre par paquet</label>
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="cons-per-box" placeholder="0">
        </div>
        <div class="field">
          <label id="cons-nb-box-label">Nombre de paquets</label>
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="cons-nb-box" placeholder="0">
        </div>
        <div class="field" id="cons-fmt-wrap" style="display:none;">
          <label>Format</label>
          <div class="fmt-group">
            <label class="fmt-btn"><input type="radio" name="cons_fmt" value="6"><span>6</span></label>
            <label class="fmt-btn"><input type="radio" name="cons_fmt" value="8"><span>8</span></label>
            <label class="fmt-btn"><input type="radio" name="cons_fmt" value="12" checked><span>12</span></label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sec" onclick="closeConsModal()">Annuler</button>
        <button type="button" class="btn btn-add" onclick="saveConsModal()">Valider ✓</button>
      </div>
    </div>
  </div>

  <div id="print-area"></div>

  <script>
    const STORAGE_KEY = 'compteurs_multi_pages_v1';
    const PAGE_IDS = ['L1', 'L2', 'L3', 'L4', 'LP'];

    const PAGE_COLORS = {
      L1: '#2563eb', // bleu
      L2: '#ca8a04', // jaune soutenu lisible sur fond blanc
      L3: '#16a34a', // vert
      L4: '#ca8a04', // jaune soutenu lisible sur fond blanc
      LP: '#ea580c'  // orange
    };

    const ICON_PACK = '🎟️';
    const ICON_BOX  = '📦';
    const ICON_PAL  = '📜';
    const ICON_WARN = '⚠️';

    function createEmptyPageData() {
      return {
        prod: { startTime: '', endTime: '', doneApps: '' },
        verre: { verPerApp: 3500, perPal: 4000, stkPal: '' },
        lines: []
      };
    }

    let appStore = {
      activePage: 'L1',
      pages: {
        L1: createEmptyPageData(),
        L2: createEmptyPageData(),
        L3: createEmptyPageData(),
        L4: createEmptyPageData(),
        LP: createEmptyPageData()
      }
    };

    function getCurrentPage() {
      if (!PAGE_IDS.includes(appStore.activePage)) {
        appStore.activePage = 'L1';
      }
      if (!appStore.pages[appStore.activePage]) {
        appStore.pages[appStore.activePage] = createEmptyPageData();
      }
      return appStore.pages[appStore.activePage];
    }

    let activeConsTarget = null;
    let defaultFruitClearedOnFocus = false;

    let holdStartTimer = null;
    let holdRepeatTimer = null;

    function runStepAction(btn) {
      const fnName = btn.getAttribute('data-repeat-fn');
      const delta = Number(btn.getAttribute('data-repeat-delta')) || 0;
      if (!fnName || !delta) return;

      if (fnName === 'stepVerPerApp') stepVerPerApp(delta);
      else if (fnName === 'stepGlassPerPal') stepGlassPerPal(delta);
      else if (fnName === 'stepGlassPallets') stepGlassPallets(delta);
      else if (fnName === 'stepAddApps') stepAddApps(delta);
      else if (fnName === 'stepLineApps') {
        const idx = Number(btn.getAttribute('data-line-idx'));
        stepLineApps(idx, delta);
      } else if (fnName === 'stepConsumable') {
        const idx = Number(btn.getAttribute('data-line-idx'));
        const type = btn.getAttribute('data-cons-type');
        stepConsumable(idx, type, delta, null);
      }
    }

    function clearHoldTimers() {
      if (holdStartTimer) {
        clearTimeout(holdStartTimer);
        holdStartTimer = null;
      }
      if (holdRepeatTimer) {
        clearInterval(holdRepeatTimer);
        holdRepeatTimer = null;
      }
    }

    function bindHoldButtons() {
      document.addEventListener('pointerdown', (e) => {
        const btn = e.target.closest('[data-repeat-fn]');
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        clearHoldTimers();

        runStepAction(btn);

        holdStartTimer = setTimeout(() => {
          holdRepeatTimer = setInterval(() => {
            runStepAction(btn);
          }, 110);
        }, 350);
      });

      document.addEventListener('pointerup', clearHoldTimers);
      document.addEventListener('pointercancel', clearHoldTimers);
      document.addEventListener('pointerleave', clearHoldTimers);
      document.addEventListener('contextmenu', (e) => {
        if (e.target.closest('[data-repeat-fn]')) {
          e.preventDefault();
        }
      });
    }

    function getDefaultFruit(index) {
      return `Fruit ${index + 1}`;
    }

    function getVerPerApp() {
      const p = getCurrentPage();
      const v = Number(p.verre.verPerApp);
      return Number.isFinite(v) && v >= 0 ? v : 3500;
    }

    function getVerPerPal() {
      const p = getCurrentPage();
      const v = Number(p.verre.perPal);
      return Number.isFinite(v) && v >= 0 ? v : 4000;
    }

    // Par défaut le singe (collapsed: true) masque les infos quand on ajoute
    function createLine(fruit = 'Fruit 1', nbApp = 1) {
      return {
        fruit: fruit,
        nbApp: nbApp,
        collapsed: true,
        etRef: '',
        etPerPack: 5000,
        etStkPack: 0,
        capRef: 'CRC',
        capPerBox: 400,
        capNbBox: 0,
        trRef: 'CCT',
        trPerPal: 3000,
        trNbPal: 0,
        trFmt: 12
      };
    }

    function sanitizePageData(rawPage) {
      const base = createEmptyPageData();
      if (!rawPage) return base;
      base.prod = Object.assign({ startTime: '', endTime: '', doneApps: '' }, rawPage.prod || {});
      base.verre = Object.assign({ verPerApp: 3500, perPal: 4000, stkPal: '' }, rawPage.verre || {});
      if (base.verre.perPal === '' || base.verre.perPal === undefined || base.verre.perPal === null) {
        base.verre.perPal = 4000;
      }
      base.lines = Array.isArray(rawPage.lines) ? rawPage.lines : [];
      return base;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          appStore.activePage = PAGE_IDS.includes(parsed.activePage) ? parsed.activePage : 'L1';
          PAGE_IDS.forEach((pid) => {
            appStore.pages[pid] = sanitizePageData(parsed.pages ? parsed.pages[pid] : null);
          });
          return;
        }
      } catch (e) {}
      appStore = {
        activePage: 'L1',
        pages: {
          L1: createEmptyPageData(),
          L2: createEmptyPageData(),
          L3: createEmptyPageData(),
          L4: createEmptyPageData(),
          LP: createEmptyPageData()
        }
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appStore));
    }

    function switchPage(pageId) {
      if (!PAGE_IDS.includes(pageId)) return;
      appStore.activePage = pageId;
      saveState();
      applyPageTheme();
      bindFixedGlassInputs();
      renderLines();
    }

    function applyPageTheme() {
      const color = PAGE_COLORS[appStore.activePage] || '#2563eb';
      document.documentElement.style.setProperty('--line-accent', color);

      document.querySelectorAll('.page-tab-btn').forEach((btn) => {
        const pid = btn.getAttribute('data-page');
        btn.classList.toggle('active', pid === appStore.activePage);
      });
    }

    function fmt(n) {
      return Math.ceil(Number(n) || 0).toLocaleString('fr-FR');
    }

    function parseTimeToMinutes(hhmm) {
      if (!hhmm || !hhmm.includes(':')) return null;
      const [h, m] = hhmm.split(':').map(Number);
      if (!Number.isFinite(h) || !Number.isFinite(m)) return null;
      return h * 60 + m;
    }

    function getNowMinutes() {
      const now = new Date();
      return now.getHours() * 60 + now.getMinutes();
    }

    function formatMinutesToTime(totalMin) {
      const mod = ((Math.round(totalMin) % 1440) + 1440) % 1440;
      const h = String(Math.floor(mod / 60)).padStart(2, '0');
      const m = String(mod % 60).padStart(2, '0');
      return `${h}:${m}`;
    }

    function updateLiveClockDisplay() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('live-clock-text').textContent = `${h}:${m}`;
    }

    function computeCadencePerHour() {
      const p = getCurrentPage();
      const doneApps = Number(p.prod.doneApps) || 0;
      if (doneApps <= 0) return 0;

      const startMin = parseTimeToMinutes(p.prod.startTime);
      const endMin = parseTimeToMinutes(p.prod.endTime);
      const nowMin = getNowMinutes();

      let durationMin = 0;
      if (startMin !== null && endMin !== null) {
        durationMin = endMin >= startMin ? (endMin - startMin) : (1440 - startMin + endMin);
      } else if (startMin !== null) {
        durationMin = nowMin >= startMin ? (nowMin - startMin) : (1440 - startMin + nowMin);
      }

      if (durationMin <= 0) return 0;
      return doneApps / (durationMin / 60);
    }

    function formatCadenceLabel(cadence) {
      if (!cadence || cadence <= 0) return '0 app/h';
      const rounded = Math.round(cadence * 10) / 10;
      return `${String(rounded).replace('.', ',')} app/h`;
    }

    function lineTotal(l) {
      return getVerPerApp() * (Number(l.nbApp) || 0);
    }

    function grandTotal() {
      const p = getCurrentPage();
      return p.lines.reduce((s, l) => s + lineTotal(l), 0);
    }

    function totalAppsCount() {
      const p = getCurrentPage();
      return p.lines.reduce((s, l) => s + (Number(l.nbApp) || 0), 0);
    }

    function fruitDisplay(l, idx) {
      const f = (l.fruit || '').trim();
      return f ? f : getDefaultFruit(idx);
    }

    function toggleAbc(id, btn) {
      const inp = document.getElementById(id);
      if (!inp) return;
      const isText = btn.classList.toggle('active');
      inp.inputMode = isText ? 'text' : 'numeric';
      inp.focus();
    }

    function toggleLineEye(idx) {
      const p = getCurrentPage();
      if (!p.lines[idx]) return;
      p.lines[idx].collapsed = !p.lines[idx].collapsed;
      saveState();
      renderLines();
    }

    function bindFixedGlassInputs() {
      const p = getCurrentPage();
      const appInp = document.getElementById('g-ver-app');
      const palInp = document.getElementById('g-ver-pal');
      const stkInp = document.getElementById('g-ver-stk');

      appInp.value = p.verre.verPerApp !== '' && p.verre.verPerApp !== undefined ? p.verre.verPerApp : 3500;
      palInp.value = p.verre.perPal !== '' && p.verre.perPal !== undefined ? p.verre.perPal : 4000;
      stkInp.value = p.verre.stkPal || '';

      appInp.oninput = (e) => {
        getCurrentPage().verre.verPerApp = e.target.value;
        saveState();
        renderLines();
      };
      palInp.oninput = (e) => {
        getCurrentPage().verre.perPal = e.target.value;
        saveState();
        refreshGlassStatus();
      };
      stkInp.oninput = (e) => {
        getCurrentPage().verre.stkPal = e.target.value;
        saveState();
        refreshGlassStatus();
      };
    }

    function bindFruitAutoClear() {
      const fruitInp = document.getElementById('add-fruit');
      fruitInp.addEventListener('focus', () => {
        if (!defaultFruitClearedOnFocus && /^Fruit\s+\d+$/i.test(fruitInp.value.trim())) {
          fruitInp.value = '';
          defaultFruitClearedOnFocus = true;
        }
      });
    }

    function bindPrefRefInput() {
      const refInp = document.getElementById('cons-ref-val');
      refInp.addEventListener('input', () => {
        refInp.classList.add('edited');
      });
    }

    function stepVerPerApp(delta) {
      const p = getCurrentPage();
      const current = Number(p.verre.verPerApp);
      const base = Number.isFinite(current) ? current : 3500;
      const next = Math.max(0, base + delta);
      p.verre.verPerApp = next;
      document.getElementById('g-ver-app').value = next;
      saveState();
      renderLines();
    }

    function stepGlassPerPal(delta) {
      const p = getCurrentPage();
      const current = Number(p.verre.perPal);
      const base = Number.isFinite(current) ? current : 4000;
      const next = Math.max(0, base + delta);
      p.verre.perPal = next;
      document.getElementById('g-ver-pal').value = next;
      saveState();
      refreshGlassStatus();
    }

    function stepGlassPallets(delta) {
      const p = getCurrentPage();
      const current = Number(p.verre.stkPal) || 0;
      const next = Math.max(0, current + delta);
      p.verre.stkPal = next;
      document.getElementById('g-ver-stk').value = next;
      saveState();
      refreshGlassStatus();
    }

    function stepLineApps(idx, delta) {
      const p = getCurrentPage();
      if (!p.lines[idx]) return;
      const current = Number(p.lines[idx].nbApp) || 0;
      p.lines[idx].nbApp = Math.max(0, current + delta);
      saveState();
      renderLines();
    }

    function stepConsumable(idx, type, delta, event) {
      if (event) event.stopPropagation();
      const p = getCurrentPage();
      const l = p.lines[idx];
      if (!l) return;

      if (type === 'et') {
        l.etStkPack = Math.max(0, (Number(l.etStkPack) || 0) + delta);
      } else if (type === 'cap') {
        l.capNbBox = Math.max(0, (Number(l.capNbBox) || 0) + delta);
      } else if (type === 'tr') {
        l.trNbPal = Math.max(0, (Number(l.trNbPal) || 0) + delta);
      }
      saveState();
      renderLines();
    }

    function refreshGlassStatus() {
      const p = getCurrentPage();
      const pf = grandTotal();
      const vPerPal = getVerPerPal();
      const vStkPal = Number(p.verre.stkPal) || 0;
      const vStockUnits = vPerPal * vStkPal;
      const vNeedPal = vPerPal > 0 ? Math.ceil(pf / vPerPal) : 0;

      const bar = document.getElementById('g-ver-status');
      bar.className = 'glass-line-2';

      const needPart = `PF : <strong>${fmt(pf)}</strong>`;

      if (pf > 0 && vPerPal > 0) {
        const diffPal = vStkPal - vNeedPal;
        if (diffPal < 0) {
          const m = Math.abs(diffPal);
          bar.classList.add('err');
          bar.innerHTML = `<span>${vStkPal} ${ICON_PAL}</span><span>${needPart} (${vNeedPal} ${ICON_PAL}) • ${ICON_WARN} -${m} ${ICON_PAL}</span>`;
        } else if (diffPal > 0) {
          bar.classList.add('ok');
          bar.innerHTML = `<span>${vStkPal} ${ICON_PAL}</span><span>${needPart} (${vNeedPal} ${ICON_PAL}) • +${diffPal} ${ICON_PAL}</span>`;
        } else {
          bar.classList.add('ok');
          bar.innerHTML = `<span>${vStkPal} ${ICON_PAL}</span><span>${needPart} (${vNeedPal} ${ICON_PAL}) • ✓</span>`;
        }
      } else if (pf > 0 && vStockUnits < pf) {
        bar.classList.add('err');
        bar.innerHTML = `<span>${vStkPal} ${ICON_PAL}</span><span>${needPart} • ${ICON_WARN} -${fmt(pf - vStockUnits)}</span>`;
      } else {
        bar.innerHTML = `<span>${vStkPal} ${ICON_PAL}</span><span>${needPart}</span>`;
      }
    }

    function renderLines() {
      const p = getCurrentPage();
      const container = document.getElementById('lines-list');
      const pfTotal = grandTotal();
      const verPerApp = getVerPerApp();
      const cadence = computeCadencePerHour();
      const nowMin = getNowMinutes();
      const washMin = 15;

      document.getElementById('cadence-val').textContent = formatCadenceLabel(cadence);
      document.getElementById('top-total').textContent = fmt(pfTotal);
      document.getElementById('top-app-val').textContent = totalAppsCount();

      refreshGlassStatus();

      if (p.lines.length === 0) {
        container.innerHTML = `<div class="empty-box">Aucune ligne sur <strong>${appStore.activePage}</strong>.<br>Appuyez sur <strong>➕ Ajout</strong> pour commencer.</div>`;
        return;
      }

      container.innerHTML = '';

      let cumulAppsToDo = 0;

      p.lines.forEach((l, idx) => {
        const pf = lineTotal(l);
        const fruitName = fruitDisplay(l, idx);
        const lineApps = Math.max(0, Number(l.nbApp) || 0);
        const isCollapsed = l.collapsed === undefined ? true : !!l.collapsed;
        cumulAppsToDo += lineApps;

        const etPack = Number(l.etPerPack) || 5000;
        const etStk = Number(l.etStkPack) || 0;
        const etNeed = pf > 0 && etPack > 0 ? Math.ceil(pf / etPack) : 0;
        let etCls = 'cons-row';
        let etMsg = `<strong>${fmt(etNeed)}</strong> ${ICON_PACK} × ${fmt(etPack)}`;
        if (etNeed > 0) {
          const diffEt = etStk - etNeed;
          if (diffEt < 0) {
            const m = Math.abs(diffEt);
            etCls = 'cons-row err';
            etMsg += ` • ${ICON_WARN} -${m} ${ICON_PACK}`;
          } else if (diffEt > 0) {
            etCls = 'cons-row ok';
            etMsg += ` • +${diffEt} ${ICON_PACK}`;
          } else {
            etCls = 'cons-row ok';
            etMsg += ` • ✓ (${etStk} ${ICON_PACK})`;
          }
        }

        const cBox = Number(l.capPerBox) || 400;
        const cNbBox = Number(l.capNbBox) || 0;
        const cNeed = pf > 0 && cBox > 0 ? Math.ceil(pf / cBox) : 0;
        const cRefTxt = (l.capRef || '').trim();
        const cRefBadge = cRefTxt && cRefTxt.toUpperCase() !== 'CRC' ? `[${cRefTxt}] ` : '';
        let cCls = 'cons-row';
        let cMsg = `${cRefBadge}<strong>${fmt(cNeed)}</strong> ${ICON_BOX} × ${fmt(cBox)}`;
        if (cNeed > 0) {
          const diffC = cNbBox - cNeed;
          if (diffC < 0) {
            const m = Math.abs(diffC);
            cCls = 'cons-row err';
            cMsg += ` • ${ICON_WARN} -${m} ${ICON_BOX}`;
          } else if (diffC > 0) {
            cCls = 'cons-row ok';
            cMsg += ` • +${diffC} ${ICON_BOX}`;
          } else {
            cCls = 'cons-row ok';
            cMsg += ` • ✓ (${cNbBox} ${ICON_BOX})`;
          }
        }

        const trFmt = Number(l.trFmt) || 12;
        const trPal = Number(l.trPerPal) || 3000;
        const trNbPal = Number(l.trNbPal) || 0;
        const trUnits = pf > 0 ? Math.ceil(pf / trFmt) : 0;
        const trNeed = trUnits > 0 && trPal > 0 ? Math.ceil(trUnits / trPal) : 0;
        const trRefTxt = (l.trRef || '').trim();
        const trRefBadge = trRefTxt && trRefTxt.toUpperCase() !== 'CCT' ? `[${trRefTxt}] ` : '';
        let trCls = 'cons-row';
        let trMsg = `${trRefBadge}<strong>${fmt(trNeed)}</strong> ${ICON_PAL} × ${fmt(trPal)} (x${trFmt})`;
        if (trNeed > 0) {
          const diffTr = trNbPal - trNeed;
          if (diffTr < 0) {
            const m = Math.abs(diffTr);
            trCls = 'cons-row err';
            trMsg += ` • ${ICON_WARN} -${m} ${ICON_PAL}`;
          } else if (diffTr > 0) {
            trCls = 'cons-row ok';
            trMsg += ` • +${diffTr} ${ICON_PAL}`;
          } else {
            trCls = 'cons-row ok';
            trMsg += ` • ✓ (${trNbPal} ${ICON_PAL})`;
          }
        }

        let endTimeLabel = '--:--';
        if (cadence > 0 && cumulAppsToDo > 0) {
          const prodMinutes = (cumulAppsToDo / cadence) * 60;
          endTimeLabel = formatMinutesToTime(nowMin + prodMinutes + washMin);
        }

        const eyeIcon = isCollapsed ? '🙈' : '👁️';
        const eyeTitle = isCollapsed ? 'Afficher les infos du fruit' : 'Masquer les infos du fruit';

        const detailsHtml = isCollapsed ? '' : `
          <div class="line-meta">
            ${verPerApp} × ${lineApps} app = <strong>${fmt(pf)}</strong>
          </div>
          <div class="consumables-stack">
            <div class="${etCls}" onclick="openConsModal(${idx}, 'et')">
              <div class="cons-text">${etMsg}</div>
              <div class="cons-right-controls">
                <button type="button" class="cons-step-btn" data-repeat-fn="stepConsumable" data-repeat-delta="-1" data-line-idx="${idx}" data-cons-type="et">-</button>
                <button type="button" class="cons-step-btn" data-repeat-fn="stepConsumable" data-repeat-delta="1" data-line-idx="${idx}" data-cons-type="et">+</button>
              </div>
            </div>

            <div class="${cCls}" onclick="openConsModal(${idx}, 'cap')">
              <div class="cons-text">${cMsg}</div>
              <div class="cons-right-controls">
                <button type="button" class="cons-step-btn" data-repeat-fn="stepConsumable" data-repeat-delta="-1" data-line-idx="${idx}" data-cons-type="cap">-</button>
                <button type="button" class="cons-step-btn" data-repeat-fn="stepConsumable" data-repeat-delta="1" data-line-idx="${idx}" data-cons-type="cap">+</button>
              </div>
            </div>

            <div class="${trCls}" onclick="openConsModal(${idx}, 'tr')">
              <div class="cons-text">${trMsg}</div>
              <div class="cons-right-controls">
                <button type="button" class="cons-step-btn" data-repeat-fn="stepConsumable" data-repeat-delta="-1" data-line-idx="${idx}" data-cons-type="tr">-</button>
                <button type="button" class="cons-step-btn" data-repeat-fn="stepConsumable" data-repeat-delta="1" data-line-idx="${idx}" data-cons-type="tr">+</button>
              </div>
            </div>
          </div>
        `;

        const card = document.createElement('div');
        card.className = 'line-card';
        card.innerHTML = `
          <div class="line-header ${isCollapsed ? '' : 'has-details'}">
            <div class="line-identity">
              <span class="pill-fruit">🍓 ${fruitName}</span>
              <button type="button" class="eye-btn" title="${eyeTitle}" onclick="toggleLineEye(${idx})">${eyeIcon}</button>
            </div>
            <div class="line-tools">
              <div class="mini-stepper">
                <span>App:</span>
                <button type="button" class="mini-step-btn" data-repeat-fn="stepLineApps" data-repeat-delta="-1" data-line-idx="${idx}">-</button>
                <span>${lineApps}</span>
                <button type="button" class="mini-step-btn" data-repeat-fn="stepLineApps" data-repeat-delta="1" data-line-idx="${idx}">+</button>
              </div>
              <button type="button" class="btn btn-del btn-mini" onclick="deleteLine(${idx})">🗑️</button>
            </div>
          </div>
          ${detailsHtml}
          <div class="line-end-time">🏁 ${endTimeLabel}</div>
        `;
        container.appendChild(card);
      });
    }

    function openAddAppModal() {
      const p = getCurrentPage();
      const defFruit = getDefaultFruit(p.lines.length);
      const fruitInp = document.getElementById('add-fruit');
      fruitInp.value = defFruit;
      fruitInp.placeholder = defFruit;
      defaultFruitClearedOnFocus = false;
      document.getElementById('add-nb-app').value = 1;
      document.getElementById('add-modal').classList.add('open');
      setTimeout(() => fruitInp.focus(), 50);
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.remove('open');
    }

    function stepAddApps(delta) {
      const inp = document.getElementById('add-nb-app');
      inp.value = Math.max(0, (Number(inp.value) || 0) + delta);
    }

    function confirmAddLine() {
      const p = getCurrentPage();
      const defFruit = getDefaultFruit(p.lines.length);
      const typedFruit = document.getElementById('add-fruit').value.trim();
      const fruit = typedFruit || defFruit;
      const nbApp = Math.max(0, Number(document.getElementById('add-nb-app').value) || 0);
      p.lines.push(createLine(fruit, nbApp));
      saveState();
      closeAddModal();
      renderLines();
    }

    function openClockModal() {
      const p = getCurrentPage();
      document.getElementById('clk-start').value = p.prod.startTime || '';
      document.getElementById('clk-end').value = p.prod.endTime || '';
      document.getElementById('clk-done-app').value = p.prod.doneApps !== '' ? p.prod.doneApps : '';
      document.getElementById('clock-modal').classList.add('open');
    }

    function closeClockModal() {
      document.getElementById('clock-modal').classList.remove('open');
    }

    function saveClockModal() {
      const p = getCurrentPage();
      p.prod = {
        startTime: document.getElementById('clk-start').value,
        endTime: document.getElementById('clk-end').value,
        doneApps: document.getElementById('clk-done-app').value
      };
      saveState();
      closeClockModal();
      renderLines();
    }

    function openConsModal(lineIdx, type) {
      const p = getCurrentPage();
      const l = p.lines[lineIdx];
      if (!l) return;
      activeConsTarget = { lineIdx, type };

      const refWrap = document.getElementById('cons-ref-wrap');
      const refLabel = document.getElementById('cons-ref-label');
      const refPrefix = document.getElementById('cons-ref-prefix');
      const refInp = document.getElementById('cons-ref-val');
      const refAbc = document.getElementById('cons-ref-abc');
      const fmtWrap = document.getElementById('cons-fmt-wrap');

      refWrap.style.display = 'none';
      fmtWrap.style.display = 'none';
      refInp.className = '';
      refInp.inputMode = 'numeric';
      refAbc.classList.remove('active');

      if (type === 'et') {
        document.getElementById('cons-title').textContent = `${ICON_PACK} Paquets`;
        refWrap.style.display = 'flex';
        refLabel.textContent = 'Emplacement : ETI';
        refPrefix.textContent = 'ETI';
        refInp.value = (l.etRef || '').trim();
        refInp.placeholder = 'Chiffres...';
        document.getElementById('cons-per-box-label').textContent = 'Nombre par paquet';
        document.getElementById('cons-nb-box-label').textContent = 'Nombre de paquets';
        document.getElementById('cons-per-box').value = l.etPerPack || 5000;
        document.getElementById('cons-nb-box').value = l.etStkPack || 0;
      } else if (type === 'cap') {
        document.getElementById('cons-title').textContent = `${ICON_BOX} Boîtes capsules`;
        refWrap.style.display = 'flex';
        refLabel.textContent = 'CRC';
        refPrefix.textContent = 'CRC';
        refInp.className = 'pref-input';
        const curCapRef = (l.capRef || 'CRC').trim();
        refInp.value = curCapRef;
        refInp.placeholder = 'CRC';
        if (curCapRef.toUpperCase() !== 'CRC' && curCapRef !== '') {
          refInp.classList.add('edited');
        }
        document.getElementById('cons-per-box-label').textContent = 'Nombre par boîte';
        document.getElementById('cons-nb-box-label').textContent = 'Nombre de boîtes';
        document.getElementById('cons-per-box').value = l.capPerBox || 400;
        document.getElementById('cons-nb-box').value = l.capNbBox || 0;
      } else if (type === 'tr') {
        document.getElementById('cons-title').textContent = `${ICON_PAL} Palettes`;
        refWrap.style.display = 'flex';
        refLabel.textContent = 'CCT';
        refPrefix.textContent = 'CCT';
        refInp.className = 'pref-input';
        const curTrRef = (l.trRef || 'CCT').trim();
        refInp.value = curTrRef;
        refInp.placeholder = 'CCT';
        if (curTrRef.toUpperCase() !== 'CCT' && curTrRef !== '') {
          refInp.classList.add('edited');
        }
        document.getElementById('cons-per-box-label').textContent = 'Nombre par palette';
        document.getElementById('cons-nb-box-label').textContent = 'Nombre de palettes';
        document.getElementById('cons-per-box').value = l.trPerPal || 3000;
        document.getElementById('cons-nb-box').value = l.trNbPal || 0;
        fmtWrap.style.display = 'block';
        const targetFmt = Number(l.trFmt) || 12;
        document.querySelectorAll('input[name="cons_fmt"]').forEach(r => {
          r.checked = Number(r.value) === targetFmt;
        });
      }

      document.getElementById('cons-modal').classList.add('open');
    }

    function closeConsModal() {
      document.getElementById('cons-modal').classList.remove('open');
      activeConsTarget = null;
    }

    function saveConsModal() {
      if (!activeConsTarget) return;
      const p = getCurrentPage();
      const { lineIdx, type } = activeConsTarget;
      const l = p.lines[lineIdx];
      if (!l) return;

      const perBoxVal = Math.max(0, Number(document.getElementById('cons-per-box').value) || 0);
      const nbBoxVal = Math.max(0, Number(document.getElementById('cons-nb-box').value) || 0);
      const refVal = document.getElementById('cons-ref-val').value.trim();

      if (type === 'et') {
        l.etRef = refVal;
        l.etPerPack = perBoxVal;
        l.etStkPack = nbBoxVal;
      } else if (type === 'cap') {
        l.capRef = refVal || 'CRC';
        l.capPerBox = perBoxVal;
        l.capNbBox = nbBoxVal;
      } else if (type === 'tr') {
        l.trRef = refVal || 'CCT';
        l.trPerPal = perBoxVal;
        l.trNbPal = nbBoxVal;
        const ch = document.querySelector('input[name="cons_fmt"]:checked');
        l.trFmt = ch ? Number(ch.value) : 12;
      }

      saveState();
      closeConsModal();
      renderLines();
    }

    function deleteLine(idx) {
      const p = getCurrentPage();
      p.lines.splice(idx, 1);
      saveState();
      renderLines();
    }

    function resetAll() {
      const pid = appStore.activePage;
      if (confirm(`Voulez-vous remettre à zéro la page ${pid} et effacer ses lignes ?`)) {
        const current = getCurrentPage();
        const currentApp = current.verre && current.verre.verPerApp !== '' ? current.verre.verPerApp : 3500;
        const currentPerPal = current.verre && current.verre.perPal !== '' ? current.verre.perPal : 4000;
        appStore.pages[pid] = {
          prod: { startTime: '', endTime: '', doneApps: '' },
          verre: { verPerApp: currentApp, perPal: currentPerPal, stkPal: '' },
          lines: []
        };
        saveState();
        bindFixedGlassInputs();
        renderLines();
      }
    }

    function printReport() {
      const p = getCurrentPage();
      const area = document.getElementById('print-area');
      const now = new Date().toLocaleString('fr-FR');
      const vInfo = document.getElementById('g-ver-status').textContent;
      const cadTxt = document.getElementById('cadence-val').textContent;
      let cardsHtml = '';

      p.lines.forEach((l, i) => {
        const pf = lineTotal(l);
        cardsHtml += `
          <div class="p-card">
            <strong>${fruitDisplay(l, i)}</strong> (${getVerPerApp()} × ${l.nbApp || 0} app = ${fmt(pf)})<br>
            ${fmt(l.etPerPack || 5000)} ${ICON_PACK} (stk ${l.etStkPack || 0}) •
            [${l.capRef || 'CRC'}] ${fmt(l.capPerBox || 400)} ${ICON_BOX} (stk ${l.capNbBox || 0}) •
            [${l.trRef || 'CCT'}] ${fmt(l.trPerPal || 3000)} ${ICON_PAL} x${l.trFmt || 12} (stk ${l.trNbPal || 0})
          </div>
        `;
      });

      area.innerHTML = `
        <div style="display:flex; justify-content:space-between; border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:10px;">
          <div><strong>${appStore.activePage} — Total PF : ${fmt(grandTotal())}</strong> • ${cadTxt}</div>
          <div>${now}</div>
        </div>
        <div class="p-card"><strong>Verre :</strong> ${vInfo}</div>
        ${cardsHtml || '<p>Aucune ligne.</p>'}
      `;
      window.print();
    }

    loadState();
    applyPageTheme();
    bindFixedGlassInputs();
    bindFruitAutoClear();
    bindPrefRefInput();
    bindHoldButtons();
    updateLiveClockDisplay();
    setInterval(() => {
      updateLiveClockDisplay();
      renderLines();
    }, 30000);
    renderLines();
  </script>
</body>
</html>
