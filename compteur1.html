<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteurs Production</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-border: #fca5a5;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --info-bg: #eff6ff;
      --info-border: #bfdbfe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      max-width: 960px;
      margin: 0 auto;
    }

    /* En-tête Total PF */
    .top-card {
      background: var(--card);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.08);
    }

    .top-label {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
    }

    .top-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .top-value {
      font-size: 1.9rem;
      font-weight: 900;
      color: var(--primary);
    }

    /* Bloc Verre fixe sur 2 lignes juste sous Produit fini */
    .glass-fixed-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .glass-line-1 {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 8px;
    }

    .glass-line-2 {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--info-bg);
      border: 1px solid var(--info-border);
    }

    .glass-line-2.err {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .glass-line-2.ok {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .step-btn {
      width: 32px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid #94a3b8;
      background: #e2e8f0;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .step-btn:active {
      transform: scale(0.96);
    }

    .step-num-inp {
      width: 66px !important;
      text-align: center;
      padding: 7px 6px !important;
    }

    /* État vide */
    .empty-box {
      background: var(--card);
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 14px;
    }

    /* Cartes de lignes */
    .line-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .line-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
    }

    .line-identity {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill-fruit {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      font-size: 0.92rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .pill-total {
      background: var(--info-bg);
      color: #1e40af;
      border: 1px solid var(--info-border);
      font-size: 0.95rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .line-tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mini-stepper {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 3px 6px;
      font-size: 0.84rem;
      font-weight: 800;
    }

    .mini-step-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid #94a3b8;
      background: #e2e8f0;
      color: var(--text);
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .line-meta {
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    /* Grille champs */
    .fields-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      min-width: 110px;
    }

    .field label {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .field input[type="number"],
    .field input[type="text"] {
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.98rem;
      width: 100%;
      background: #fff;
    }

    .ref-row {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .abc-btn {
      padding: 8px 7px;
      border-radius: 8px;
      border: 1px solid #94a3b8;
      background: #e2e8f0;
      color: var(--text);
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .abc-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .fmt-group {
      display: flex;
      gap: 6px;
    }

    .fmt-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 7px 6px;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      background: #f8fafc;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }

    .fmt-btn input:checked + span {
      color: var(--primary);
    }

    /* Besoins & alertes */
    .needs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 8px;
    }

    .need-card {
      padding: 9px 11px;
      border-radius: 8px;
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .need-card.err {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .need-card.ok {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    /* Barre d'actions */
    .bottom-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 18px 0 12px;
    }

    button.btn {
      padding: 11px 18px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-start { background: var(--success); color: #fff; }
    .btn-start:hover { background: #15803d; }
    .btn-reset { background: var(--danger); color: #fff; }
    .btn-reset:hover { background: #b91c1c; }
    .btn-pdf   { background: var(--primary); color: #fff; }
    .btn-pdf:hover { background: var(--primary-hover); }
    .btn-sec   { background: #e2e8f0; color: var(--text); }
    .btn-mini  { padding: 7px 11px; font-size: 0.84rem; border-radius: 8px; }
    .btn-del   { background: #fee2e2; color: var(--danger); }

    /* Modale formulaire Start */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-y: auto;
    }

    .modal-bg.open {
      display: flex;
    }

    .modal-panel {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 1.05rem;
      font-weight: 900;
    }

    .modal-section {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 11px;
      margin-bottom: 12px;
    }

    .modal-sec-title {
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    #print-area { display: none; }

    @media print {
      body { background: #fff; padding: 0; }
      .top-card, .glass-fixed-card, #lines-list, .bottom-bar, .modal-bg { display: none !important; }
      #print-area { display: block !important; }
      .p-card { border: 1px solid #bbb; border-radius: 8px; padding: 10px; margin-bottom: 12px; page-break-inside: avoid; }
    }
  </style>
</head>
<body>

  <div class="top-card">
    <div>
      <div class="top-label">Total Produit Fini</div>
      <div class="top-sub" id="top-count">Aucune ligne</div>
    </div>
    <div class="top-value" id="top-total">0</div>
  </div>

  <!-- VERRE FIXE SUR 2 LIGNES JUSTE SOUS PRODUIT FINI -->
  <div class="glass-fixed-card">
    <div class="glass-line-1">
      <div class="field" style="flex:1 1 130px;">
        <label>🫙 Nom du verre (Réf V)</label>
        <div class="ref-row">
          <input type="text" inputmode="numeric" id="g-ver-ref" placeholder="Nom / V">
          <button type="button" class="abc-btn" onclick="toggleAbc('g-ver-ref', this)">ABC</button>
        </div>
      </div>
      <div class="field" style="flex:1 1 115px;">
        <label>Nb / palette</label>
        <input type="number" inputmode="numeric" pattern="[0-9]*" id="g-ver-pal" placeholder="0">
      </div>
      <div class="field" style="flex:0 0 auto;">
        <label>Nb palettes (0 si rien)</label>
        <div class="stepper">
          <button type="button" class="step-btn" onclick="stepGlassPallets(-1)">-</button>
          <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-num-inp" id="g-ver-stk" placeholder="0">
          <button type="button" class="step-btn" onclick="stepGlassPallets(1)">+</button>
        </div>
      </div>
    </div>
    <div class="glass-line-2" id="g-ver-status">
      <span>Stock verre : 0</span>
      <span>Besoin PF : 0</span>
    </div>
  </div>

  <div id="lines-list"></div>

  <div class="bottom-bar">
    <button type="button" class="btn btn-start" onclick="openFormModal(null)">▶️ Start</button>
    <button type="button" class="btn btn-reset" onclick="resetAll()">🔄 Reset</button>
    <button type="button" class="btn btn-pdf" onclick="printReport()">🖨️ PDF</button>
  </div>

  <!-- FORMULAIRE START -->
  <div class="modal-bg" id="form-modal">
    <div class="modal-panel">
      <div class="modal-head">
        <span id="m-title">▶️ Nouvelle ligne</span>
        <button type="button" class="btn btn-sec btn-mini" onclick="closeFormModal()">✕</button>
      </div>

      <div class="modal-section">
        <div class="modal-sec-title">🍓 Fruit & Production</div>
        <div class="fields-grid">
          <div class="field">
            <label>Fruit</label>
            <input type="text" inputmode="text" id="m-fruit" placeholder="Ex : Annas">
          </div>
          <div class="field">
            <label>Verre / app</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-ver-app" value="3500" oninput="updateLivePreview()">
          </div>
          <div class="field">
            <label>Nb app</label>
            <div class="stepper">
              <button type="button" class="step-btn" onclick="stepModalApps(-1)">-</button>
              <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-num-inp" id="m-nb-app" value="1" oninput="updateLivePreview()">
              <button type="button" class="step-btn" onclick="stepModalApps(1)">+</button>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-sec-title">🏷️ Étiquette (0 paquet si rien)</div>
        <div class="fields-grid">
          <div class="field">
            <label>Réf eti</label>
            <div class="ref-row">
              <input type="text" inputmode="numeric" id="m-et-ref" placeholder="eti">
              <button type="button" class="abc-btn" onclick="toggleAbc('m-et-ref', this)">ABC</button>
            </div>
          </div>
          <div class="field">
            <label>Ét / paquet</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-et-pack" value="5000" oninput="updateLivePreview()">
          </div>
          <div class="field">
            <label>Nb paquets (0 si rien)</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-et-stk" placeholder="0" oninput="updateLivePreview()">
          </div>
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-sec-title">🔘 Capsule (0 boîte si rien)</div>
        <div class="fields-grid">
          <div class="field">
            <label>Réf CRC</label>
            <div class="ref-row">
              <input type="text" inputmode="numeric" id="m-cap-ref" placeholder="CRC">
              <button type="button" class="abc-btn" onclick="toggleAbc('m-cap-ref', this)">ABC</button>
            </div>
          </div>
          <div class="field">
            <label>Cap / boîte</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-cap-box" value="400" oninput="updateLivePreview()">
          </div>
          <div class="field">
            <label>Nb boîtes (0 si rien)</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-cap-nb-box" value="1" oninput="updateLivePreview()">
          </div>
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-sec-title">📦 Tray (0 palette si rien)</div>
        <div class="fields-grid">
          <div class="field">
            <label>Réf cct</label>
            <div class="ref-row">
              <input type="text" inputmode="numeric" id="m-tr-ref" placeholder="cct">
              <button type="button" class="abc-btn" onclick="toggleAbc('m-tr-ref', this)">ABC</button>
            </div>
          </div>
          <div class="field">
            <label>Tray / palette</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-tr-pal" value="3000" oninput="updateLivePreview()">
          </div>
          <div class="field">
            <label>Nb palettes (0 si rien)</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-tr-nb-pal" value="1" oninput="updateLivePreview()">
          </div>
          <div class="field">
            <label>Format</label>
            <div class="fmt-group">
              <label class="fmt-btn"><input type="radio" name="m_fmt" value="6" onchange="updateLivePreview()"><span>6</span></label>
              <label class="fmt-btn"><input type="radio" name="m_fmt" value="8" onchange="updateLivePreview()"><span>8</span></label>
              <label class="fmt-btn"><input type="radio" name="m_fmt" value="12" checked onchange="updateLivePreview()"><span>12</span></label>
            </div>
          </div>
        </div>
      </div>

      <!-- CALCUL AUTOMATIQUE EN DIRECT DANS START -->
      <div class="modal-section">
        <div class="modal-sec-title" id="m-pf-preview">Calcul auto : 0 PF</div>
        <div class="needs-grid" id="m-needs-preview"></div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-sec" onclick="closeFormModal()">Annuler</button>
        <button type="button" class="btn btn-start" onclick="saveFormModal()">Valider ✓</button>
      </div>
    </div>
  </div>

  <div id="print-area"></div>

  <script>
    const STORAGE_KEY = 'compteurs_zero_defaut_v1';

    let state = {
      verre: { ref: '', perPal: '', stkPal: '' },
      lines: []
    };

    let editingIndex = null;

    function createEmptyLine() {
      return {
        fruit: '',
        verPerApp: 3500,
        nbApp: 1,
        etRef: '',
        etPerPack: 5000,
        etStkPack: '',
        capRef: '',
        capPerBox: 400,
        capNbBox: 1,
        trRef: '',
        trPerPal: 3000,
        trNbPal: 1,
        trFmt: 12
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.verre = Object.assign({ ref: '', perPal: '', stkPal: '' }, parsed.verre || {});
          state.lines = Array.isArray(parsed.lines) ? parsed.lines : [];
          return;
        }
      } catch (e) {}
      state = { verre: { ref: '', perPal: '', stkPal: '' }, lines: [] };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function fmt(n) {
      return Math.ceil(Number(n) || 0).toLocaleString('fr-FR');
    }

    function lineTotal(l) {
      return (Number(l.verPerApp) || 0) * (Number(l.nbApp) || 0);
    }

    function grandTotal() {
      return state.lines.reduce((s, l) => s + lineTotal(l), 0);
    }

    function toggleAbc(id, btn) {
      const inp = document.getElementById(id);
      if (!inp) return;
      const isText = btn.classList.toggle('active');
      inp.inputMode = isText ? 'text' : 'numeric';
      inp.focus();
    }

    function computeLineNeedsHtml(data) {
      const pf = (Number(data.verPerApp) || 0) * (Number(data.nbApp) || 0);

      // 1. Étiquettes : 0 paquet si rien
      const etPack = Number(data.etPerPack) || 0;
      const etStkPack = Number(data.etStkPack) || 0; // 0 si vide
      const etNeedPack = etPack > 0 ? Math.ceil(pf / etPack) : 0;
      const etDispo = etPack * etStkPack;
      const etTag = (data.etRef || '').trim() ? ` [${data.etRef.trim()}]` : '';
      let etCls = 'need-card';
      let etMsg = `🏷️ <strong>Étiquettes${etTag}</strong> : besoin ${fmt(pf)}` + (etPack > 0 ? ` (${fmt(etNeedPack)} pqt)` : '');
      if (pf > 0 && etDispo < pf) {
        etCls = 'need-card err';
        etMsg += `<br>⚠️ Manque ${fmt(pf - etDispo)} ét. (stock : ${etStkPack} pqt)`;
      } else if (pf > 0 && etDispo >= pf) {
        etCls = 'need-card ok';
        etMsg += `<br>✔️ OK (+${fmt(etDispo - pf)})`;
      }

      // 2. Capsules : 0 boîte si rien
      const cBox = Number(data.capPerBox) || 0;
      const cNbBox = Number(data.capNbBox) || 0; // 0 si vide
      const cNeedBox = cBox > 0 ? Math.ceil(pf / cBox) : 0;
      const cDispo = cBox * cNbBox;
      const cTag = (data.capRef || '').trim() ? ` [${data.capRef.trim()}]` : '';
      let cCls = 'need-card';
      let cMsg = `🔘 <strong>Capsules${cTag}</strong> : besoin ${fmt(pf)}` + (cBox > 0 ? ` (${fmt(cNeedBox)} bte)` : '');
      if (pf > 0 && cDispo < pf) {
        cCls = 'need-card err';
        cMsg += `<br>⚠️ Manque ${fmt(pf - cDispo)} cap. (stock : ${cNbBox} bte)`;
      } else if (pf > 0 && cDispo >= pf) {
        cCls = 'need-card ok';
        cMsg += `<br>✔️ OK (+${fmt(cDispo - pf)})`;
      }

      // 3. Trays : 0 palette si rien
      const trFmt = Number(data.trFmt) || 12;
      const trPal = Number(data.trPerPal) || 0;
      const trNbPal = Number(data.trNbPal) || 0; // 0 si vide
      const trNeed = pf > 0 ? Math.ceil(pf / trFmt) : 0;
      const trDispo = trPal * trNbPal;
      const trTag = (data.trRef || '').trim() ? ` [${data.trRef.trim()}]` : '';
      let trCls = 'need-card';
      let trMsg = `📦 <strong>Trays${trTag} (x${trFmt})</strong> : besoin ${fmt(trNeed)} trays`;
      if (trNeed > 0 && trDispo < trNeed) {
        trCls = 'need-card err';
        trMsg += `<br>⚠️ Manque ${fmt(trNeed - trDispo)} tr. (stock : ${trNbPal} pal)`;
      } else if (trNeed > 0 && trDispo >= trNeed) {
        trCls = 'need-card ok';
        trMsg += `<br>✔️ OK (+${fmt(trDispo - trNeed)})`;
      }

      return {
        pf,
        html: `
          <div class="${etCls}">${etMsg}</div>
          <div class="${cCls}">${cMsg}</div>
          <div class="${trCls}">${trMsg}</div>
        `
      };
    }

    function bindFixedGlassInputs() {
      const refInp = document.getElementById('g-ver-ref');
      const palInp = document.getElementById('g-ver-pal');
      const stkInp = document.getElementById('g-ver-stk');

      refInp.value = state.verre.ref || '';
      palInp.value = state.verre.perPal || '';
      stkInp.value = state.verre.stkPal || '';

      refInp.oninput = (e) => { state.verre.ref = e.target.value; saveState(); refreshGlassStatus(); };
      palInp.oninput = (e) => { state.verre.perPal = e.target.value; saveState(); refreshGlassStatus(); };
      stkInp.oninput = (e) => { state.verre.stkPal = e.target.value; saveState(); refreshGlassStatus(); };
    }

    function stepGlassPallets(delta) {
      const current = Number(state.verre.stkPal) || 0;
      const next = Math.max(0, current + delta);
      state.verre.stkPal = next;
      document.getElementById('g-ver-stk').value = next;
      saveState();
      refreshGlassStatus();
    }

    function stepLineApps(idx, delta) {
      if (!state.lines[idx]) return;
      const current = Number(state.lines[idx].nbApp) || 0;
      const next = Math.max(0, current + delta);
      state.lines[idx].nbApp = next;
      saveState();
      renderLines();
    }

    function refreshGlassStatus() {
      const pf = grandTotal();
      const vRef = (state.verre.ref || '').trim();
      const vPerPal = Number(state.verre.perPal) || 0;
      const vStkPal = Number(state.verre.stkPal) || 0; // 0 si rien
      const vStockUnits = vPerPal * vStkPal;
      const vNeedPal = vPerPal > 0 ? Math.ceil(pf / vPerPal) : 0;

      const bar = document.getElementById('g-ver-status');
      bar.className = 'glass-line-2';

      const namePart = vRef ? `<strong>${vRef}</strong> • ` : '';
      const needPart = `Besoin PF : <strong>${fmt(pf)}</strong>` + (vPerPal > 0 ? ` (${fmt(vNeedPal)} pal)` : '');

      if (pf > 0 && vStockUnits < pf) {
        bar.classList.add('err');
        bar.innerHTML = `<span>${namePart}Stock : <strong>${fmt(vStockUnits)}</strong> (${vStkPal} pal)</span><span>${needPart} • ⚠️ Manque <strong>${fmt(pf - vStockUnits)}</strong></span>`;
      } else if (pf > 0 && vStockUnits >= pf) {
        bar.classList.add('ok');
        bar.innerHTML = `<span>${namePart}Stock : <strong>${fmt(vStockUnits)}</strong> (${vStkPal} pal)</span><span>${needPart} • ✔️ Reste <strong>${fmt(vStockUnits - pf)}</strong></span>`;
      } else {
        bar.innerHTML = `<span>${namePart}Stock : <strong>${fmt(vStockUnits)}</strong> (${vStkPal} pal)</span><span>${needPart}</span>`;
      }
    }

    function renderLines() {
      const container = document.getElementById('lines-list');
      const pfTotal = grandTotal();
      document.getElementById('top-total').textContent = fmt(pfTotal);
      document.getElementById('top-count').textContent =
        state.lines.length === 0 ? 'Aucune ligne' : `${state.lines.length} ligne${state.lines.length > 1 ? 's' : ''}`;

      refreshGlassStatus();

      if (state.lines.length === 0) {
        container.innerHTML = `<div class="empty-box">Aucune ligne pour l'instant.<br>Appuyez sur <strong>▶️ Start</strong> pour commencer.</div>`;
        return;
      }

      container.innerHTML = '';

      state.lines.forEach((l, idx) => {
        const calc = computeLineNeedsHtml(l);
        const fruitText = (l.fruit || '').trim();
        const fruitBadge = fruitText ? `<span class="pill-fruit">🍓 ${fruitText}</span>` : '';

        const card = document.createElement('div');
        card.className = 'line-card';
        card.innerHTML = `
          <div class="line-header">
            <div class="line-identity">
              ${fruitBadge}
              <span class="pill-total">${fmt(calc.pf)} PF</span>
            </div>
            <div class="line-tools">
              <button type="button" class="btn btn-sec btn-mini" onclick="openFormModal(${idx})">✏️ Modifier</button>
              <div class="mini-stepper">
                <span>App:</span>
                <button type="button" class="mini-step-btn" onclick="stepLineApps(${idx}, -1)">-</button>
                <span>${Number(l.nbApp) || 0}</span>
                <button type="button" class="mini-step-btn" onclick="stepLineApps(${idx}, 1)">+</button>
              </div>
              <button type="button" class="btn btn-del btn-mini" onclick="deleteLine(${idx})">🗑️</button>
              <div class="mini-stepper">
                <button type="button" class="mini-step-btn" onclick="stepLineApps(${idx}, -1)">-</button>
                <button type="button" class="mini-step-btn" onclick="stepLineApps(${idx}, 1)">+</button>
              </div>
            </div>
          </div>
          <div class="line-meta">
            <span>Verre/app : <strong>${l.verPerApp || 0}</strong> × App : <strong>${l.nbApp || 0}</strong></span>
          </div>
          <div class="needs-grid">${calc.html}</div>
        `;
        container.appendChild(card);
      });
    }

    function readModalFormData() {
      const checkedFmt = document.querySelector('input[name="m_fmt"]:checked');
      return {
        fruit: document.getElementById('m-fruit').value.trim(),
        verPerApp: document.getElementById('m-ver-app').value,
        nbApp: document.getElementById('m-nb-app').value,
        etRef: document.getElementById('m-et-ref').value,
        etPerPack: document.getElementById('m-et-pack').value,
        etStkPack: document.getElementById('m-et-stk').value,
        capRef: document.getElementById('m-cap-ref').value,
        capPerBox: document.getElementById('m-cap-box').value,
        capNbBox: document.getElementById('m-cap-nb-box').value,
        trRef: document.getElementById('m-tr-ref').value,
        trPerPal: document.getElementById('m-tr-pal').value,
        trNbPal: document.getElementById('m-tr-nb-pal').value,
        trFmt: checkedFmt ? Number(checkedFmt.value) : 12
      };
    }

    function stepModalApps(delta) {
      const inp = document.getElementById('m-nb-app');
      const current = Number(inp.value) || 0;
      const next = Math.max(0, current + delta);
      inp.value = next;
      updateLivePreview();
    }

    function updateLivePreview() {
      const data = readModalFormData();
      const calc = computeLineNeedsHtml(data);
      document.getElementById('m-pf-preview').textContent = `Calcul auto : ${fmt(calc.pf)} PF`;
      document.getElementById('m-needs-preview').innerHTML = calc.html;
    }

    function openFormModal(idx) {
      editingIndex = idx;
      const isEdit = idx !== null && state.lines[idx];
      const base = isEdit ? state.lines[idx] : createEmptyLine();

      document.getElementById('m-title').textContent = isEdit ? '✏️ Modifier ligne' : '▶️ Nouvelle ligne';
      document.getElementById('m-fruit').value = base.fruit || '';
      document.getElementById('m-ver-app').value = base.verPerApp !== '' ? base.verPerApp : 3500;
      document.getElementById('m-nb-app').value = base.nbApp !== '' ? base.nbApp : 1;

      document.getElementById('m-et-ref').value = base.etRef || '';
      document.getElementById('m-et-pack').value = base.etPerPack !== '' ? base.etPerPack : 5000;
      document.getElementById('m-et-stk').value = base.etStkPack !== '' ? base.etStkPack : '';

      document.getElementById('m-cap-ref').value = base.capRef || '';
      document.getElementById('m-cap-box').value = base.capPerBox !== '' ? base.capPerBox : 400;
      document.getElementById('m-cap-nb-box').value = base.capNbBox !== '' ? base.capNbBox : 1;

      document.getElementById('m-tr-ref').value = base.trRef || '';
      document.getElementById('m-tr-pal').value = base.trPerPal !== '' ? base.trPerPal : 3000;
      document.getElementById('m-tr-nb-pal').value = base.trNbPal !== '' ? base.trNbPal : 1;

      const targetFmt = Number(base.trFmt) || 12;
      document.querySelectorAll('input[name="m_fmt"]').forEach(r => {
        r.checked = Number(r.value) === targetFmt;
      });

      updateLivePreview();
      document.getElementById('form-modal').classList.add('open');
    }

    function closeFormModal() {
      document.getElementById('form-modal').classList.remove('open');
      editingIndex = null;
    }

    function saveFormModal() {
      const data = readModalFormData();
      const newLine = {
        fruit: data.fruit,
        verPerApp: data.verPerApp === '' ? 3500 : data.verPerApp,
        nbApp: data.nbApp === '' ? 0 : data.nbApp,
        etRef: data.etRef,
        etPerPack: data.etPerPack === '' ? 5000 : data.etPerPack,
        etStkPack: data.etStkPack === '' ? 0 : data.etStkPack,
        capRef: data.capRef,
        capPerBox: data.capPerBox === '' ? 0 : data.capPerBox,
        capNbBox: data.capNbBox === '' ? 0 : data.capNbBox,
        trRef: data.trRef,
        trPerPal: data.trPerPal === '' ? 0 : data.trPerPal,
        trNbPal: data.trNbPal === '' ? 0 : data.trNbPal,
        trFmt: data.trFmt || 12
      };

      if (editingIndex !== null && state.lines[editingIndex]) {
        state.lines[editingIndex] = newLine;
      } else {
        state.lines.push(newLine);
      }

      saveState();
      closeFormModal();
      renderLines();
    }

    function deleteLine(idx) {
      state.lines.splice(idx, 1);
      saveState();
      renderLines();
    }

    function resetAll() {
      if (confirm('Voulez-vous remettre à zéro et effacer toutes les lignes ?')) {
        state = { verre: { ref: '', perPal: '', stkPal: '' }, lines: [] };
        saveState();
        bindFixedGlassInputs();
        renderLines();
      }
    }

    function printReport() {
      const area = document.getElementById('print-area');
      const now = new Date().toLocaleString('fr-FR');
      const vInfo = document.getElementById('g-ver-status').textContent;
      let cardsHtml = '';

      state.lines.forEach((l) => {
        const calc = computeLineNeedsHtml(l);
        const fName = (l.fruit || '').trim() || 'Ligne';
        cardsHtml += `
          <div class="p-card">
            <strong>${fName}</strong> : <strong>${fmt(calc.pf)} PF</strong> (${l.verPerApp || 0} verre/app × ${l.nbApp || 0} app)<br>
            ${calc.html.replace(/<[^>]+>/g, ' ')}
          </div>
        `;
      });

      area.innerHTML = `
        <div style="display:flex; justify-content:space-between; border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:10px;">
          <div><strong>Total PF : ${fmt(grandTotal())}</strong></div>
          <div>${now}</div>
        </div>
        <div class="p-card"><strong>🫙 Verre :</strong> ${vInfo}</div>
        ${cardsHtml || '<p>Aucune ligne.</p>'}
      `;
      window.print();
    }

    loadState();
    bindFixedGlassInputs();
    renderLines();
  </script>
</body>
</html>
