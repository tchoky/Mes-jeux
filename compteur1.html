<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteurs Production</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --info-bg: #eff6ff;
      --info-border: #bfdbfe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      max-width: 960px;
      margin: 0 auto;
    }

    /* En-tête Total PF */
    .top-card {
      background: var(--card);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.08);
    }

    .top-label {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
    }

    .top-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .top-value {
      font-size: 1.9rem;
      font-weight: 900;
      color: var(--primary);
    }

    /* État vide */
    .empty-box {
      background: var(--card);
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 14px;
    }

    /* Cartes de lignes lisibles */
    .line-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .line-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    .line-identity {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill-num {
      background: #e2e8f0;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 6px;
    }

    .pill-fruit {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      font-size: 0.9rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .pill-total {
      background: var(--info-bg);
      color: #1e40af;
      border: 1px solid var(--info-border);
      font-size: 0.95rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .line-tools {
      display: flex;
      gap: 6px;
    }

    /* Grille responsive des champs */
    .fields-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    .field label {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .field input[type="number"],
    .field input[type="text"] {
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.98rem;
      width: 100%;
      background: #fff;
    }

    .ref-row {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .abc-btn {
      padding: 8px 7px;
      border-radius: 8px;
      border: 1px solid #94a3b8;
      background: #e2e8f0;
      color: var(--text);
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .abc-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .fmt-group {
      display: flex;
      gap: 6px;
    }

    .fmt-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 7px 6px;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      background: #f8fafc;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }

    .fmt-btn input:checked + span {
      color: var(--primary);
    }

    /* Besoins & alertes */
    .needs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 8px;
    }

    .need-card {
      padding: 9px 11px;
      border-radius: 8px;
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .need-card.err {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .need-card.ok {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    /* Barre d'actions */
    .bottom-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 18px 0 12px;
    }

    button.btn {
      padding: 11px 18px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-start { background: var(--success); color: #fff; }
    .btn-start:hover { background: #15803d; }
    .btn-reset { background: var(--danger); color: #fff; }
    .btn-reset:hover { background: #b91c1c; }
    .btn-pdf   { background: var(--primary); color: #fff; }
    .btn-pdf:hover { background: var(--primary-hover); }
    .btn-sec   { background: #e2e8f0; color: var(--text); }
    .btn-mini  { padding: 6px 10px; font-size: 0.82rem; border-radius: 7px; }
    .btn-del   { background: #fee2e2; color: var(--danger); }

    /* Modale formulaire Start */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-y: auto;
    }

    .modal-bg.open {
      display: flex;
    }

    .modal-panel {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      width: 100%;
      max-width: 540px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 1.05rem;
      font-weight: 900;
    }

    .modal-section {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 11px;
      margin-bottom: 12px;
    }

    .modal-sec-title {
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    #print-area { display: none; }

    @media print {
      body { background: #fff; padding: 0; }
      .top-card, #lines-list, .bottom-bar, .modal-bg { display: none !important; }
      #print-area { display: block !important; }
      .p-card { border: 1px solid #bbb; border-radius: 8px; padding: 10px; margin-bottom: 12px; page-break-inside: avoid; }
      .p-err { color: #dc2626 !important; font-weight: bold; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <div class="top-card">
    <div>
      <div class="top-label">Total Produit Fini</div>
      <div class="top-sub" id="top-count">0 ligne</div>
    </div>
    <div class="top-value" id="top-total">0</div>
  </div>

  <div id="lines-list"></div>

  <div class="bottom-bar">
    <button type="button" class="btn btn-start" onclick="openFormModal(null)">▶️ Start</button>
    <button type="button" class="btn btn-reset" onclick="resetAll()">🔄 Reset</button>
    <button type="button" class="btn btn-pdf" onclick="printReport()">🖨️ PDF</button>
  </div>

  <!-- FORMULAIRE START -->
  <div class="modal-bg" id="form-modal">
    <div class="modal-panel">
      <div class="modal-head">
        <span id="m-title">▶️ Nouvelle ligne</span>
        <button type="button" class="btn btn-sec btn-mini" onclick="closeFormModal()">✕</button>
      </div>

      <div class="modal-section">
        <div class="modal-sec-title">🍓 Fruit & Production</div>
        <div class="fields-grid">
          <div class="field">
            <label>Fruit</label>
            <input type="text" inputmode="text" id="m-fruit" placeholder="Fruit 1">
          </div>
          <div class="field">
            <label>Verre / app</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-ver-app" placeholder="0">
          </div>
          <div class="field">
            <label>Nb app</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-nb-app" value="1">
          </div>
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-sec-title">🫙 Verre & 🏷️ Étiquette</div>
        <div class="fields-grid">
          <div class="field">
            <label>Réf V</label>
            <div class="ref-row">
              <input type="text" inputmode="numeric" id="m-ver-ref" placeholder="V">
              <button type="button" class="abc-btn" onclick="toggleAbc('m-ver-ref', this)">ABC</button>
            </div>
          </div>
          <div class="field">
            <label>Verre / pal</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-ver-pal" placeholder="0">
          </div>
          <div class="field">
            <label>Stk pal verre</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-ver-stk" placeholder="0">
          </div>
          <div class="field">
            <label>Réf eti</label>
            <div class="ref-row">
              <input type="text" inputmode="numeric" id="m-et-ref" placeholder="eti">
              <button type="button" class="abc-btn" onclick="toggleAbc('m-et-ref', this)">ABC</button>
            </div>
          </div>
          <div class="field">
            <label>Ét / paquet</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-et-pack" value="5000">
          </div>
          <div class="field">
            <label>Stk paquets</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-et-stk" placeholder="0">
          </div>
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-sec-title">🔘 Capsule</div>
        <div class="fields-grid">
          <div class="field">
            <label>Réf CRC</label>
            <div class="ref-row">
              <input type="text" inputmode="numeric" id="m-cap-ref" placeholder="CRC">
              <button type="button" class="abc-btn" onclick="toggleAbc('m-cap-ref', this)">ABC</button>
            </div>
          </div>
          <div class="field">
            <label>Cap / boîte</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-cap-box" value="400">
          </div>
          <div class="field">
            <label>Nb boîtes</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-cap-nb-box" value="1">
          </div>
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-sec-title">📦 Tray</div>
        <div class="fields-grid">
          <div class="field">
            <label>Réf cct</label>
            <div class="ref-row">
              <input type="text" inputmode="numeric" id="m-tr-ref" placeholder="cct">
              <button type="button" class="abc-btn" onclick="toggleAbc('m-tr-ref', this)">ABC</button>
            </div>
          </div>
          <div class="field">
            <label>Tray / palette</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-tr-pal" value="3000">
          </div>
          <div class="field">
            <label>Nb palettes</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="m-tr-nb-pal" value="1">
          </div>
          <div class="field">
            <label>Format</label>
            <div class="fmt-group">
              <label class="fmt-btn"><input type="radio" name="m_fmt" value="6"><span>6</span></label>
              <label class="fmt-btn"><input type="radio" name="m_fmt" value="8"><span>8</span></label>
              <label class="fmt-btn"><input type="radio" name="m_fmt" value="12" checked><span>12</span></label>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-sec" onclick="closeFormModal()">Annuler</button>
        <button type="button" class="btn btn-start" onclick="saveFormModal()">Valider ✓</button>
      </div>
    </div>
  </div>

  <div id="print-area"></div>

  <script>
    const STORAGE_KEY = 'compteurs_lisible_v1';
    let lines = [];
    let editingIndex = null;

    function defaultFruitName(idx) {
      return `Fruit ${idx + 1}`;
    }

    function createDefaultLine(idx = 0) {
      return {
        fruit: defaultFruitName(idx),
        verPerApp: '',
        nbApp: 1,
        verRef: '',
        verPerPal: '',
        verStkPal: '',
        etRef: '',
        etPerPack: 5000,
        etStkPack: '',
        capRef: '',
        capPerBox: 400,
        capNbBox: 1,
        trRef: '',
        trPerPal: 3000,
        trNbPal: 1,
        trFmt: 12
      };
    }

    function loadLines() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            lines = parsed;
            return;
          }
        }
      } catch (e) {}
      lines = [];
    }

    function saveLines() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(lines));
    }

    function fmt(n) {
      return Math.ceil(Number(n) || 0).toLocaleString('fr-FR');
    }

    function lineTotal(l) {
      return (Number(l.verPerApp) || 0) * (Number(l.nbApp) || 0);
    }

    function grandTotal() {
      return lines.reduce((s, l) => s + lineTotal(l), 0);
    }

    function fruitLabel(l, idx) {
      const f = (l.fruit || '').trim();
      return f ? f : defaultFruitName(idx);
    }

    function toggleAbc(id, btn) {
      const inp = document.getElementById(id);
      if (!inp) return;
      const isText = btn.classList.toggle('active');
      inp.inputMode = isText ? 'text' : 'numeric';
      inp.focus();
    }

    function renderLines() {
      const container = document.getElementById('lines-list');
      document.getElementById('top-total').textContent = fmt(grandTotal());
      document.getElementById('top-count').textContent =
        lines.length === 0 ? 'Aucune ligne' : `${lines.length} ligne${lines.length > 1 ? 's' : ''}`;

      if (lines.length === 0) {
        container.innerHTML = `<div class="empty-box">Aucune ligne pour l'instant.<br>Appuyez sur <strong>▶️ Start</strong> pour ajouter une ligne.</div>`;
        return;
      }

      container.innerHTML = '';

      lines.forEach((l, idx) => {
        const pf = lineTotal(l);
        const fName = fruitLabel(l, idx);

        // Calcul Verre
        const vPal = Number(l.verPerPal) || 0;
        const vStkPal = Number(l.verStkPal) || 0;
        const vNeedPal = vPal > 0 ? Math.ceil(pf / vPal) : 0;
        const vDispo = vPal * vStkPal;
        const vTag = (l.verRef || '').trim() ? ` [${l.verRef.trim()}]` : '';
        let vCls = 'need-card';
        let vMsg = `🫙 <strong>Verre${vTag}</strong> : besoin ${fmt(pf)}` + (vPal > 0 ? ` (${fmt(vNeedPal)} pal)` : '');
        if (vStkPal > 0 && vDispo < pf) {
          vCls = 'need-card err';
          vMsg += `<br>⚠️ Manque ${fmt(pf - vDispo)} verres`;
        } else if (vStkPal > 0 && vDispo >= pf) {
          vCls = 'need-card ok';
          vMsg += `<br>✔️ OK (+${fmt(vDispo - pf)})`;
        }

        // Calcul Étiquettes
        const etPack = Number(l.etPerPack) || 0;
        const etStkPack = Number(l.etStkPack) || 0;
        const etNeedPack = etPack > 0 ? Math.ceil(pf / etPack) : 0;
        const etDispo = etPack * etStkPack;
        const etTag = (l.etRef || '').trim() ? ` [${l.etRef.trim()}]` : '';
        let etCls = 'need-card';
        let etMsg = `🏷️ <strong>Étiquettes${etTag}</strong> : besoin ${fmt(pf)}` + (etPack > 0 ? ` (${fmt(etNeedPack)} pqt)` : '');
        if (etStkPack > 0 && etDispo < pf) {
          etCls = 'need-card err';
          etMsg += `<br>⚠️ Manque ${fmt(pf - etDispo)} étiquettes`;
        } else if (etStkPack > 0 && etDispo >= pf) {
          etCls = 'need-card ok';
          etMsg += `<br>✔️ OK (+${fmt(etDispo - pf)})`;
        }

        // Calcul Capsules
        const cBox = Number(l.capPerBox) || 0;
        const cNbBox = Number(l.capNbBox) || 0;
        const cNeedBox = cBox > 0 ? Math.ceil(pf / cBox) : 0;
        const cDispo = cBox * cNbBox;
        const cTag = (l.capRef || '').trim() ? ` [${l.capRef.trim()}]` : '';
        let cCls = 'need-card';
        let cMsg = `🔘 <strong>Capsules${cTag}</strong> : besoin ${fmt(pf)}` + (cBox > 0 ? ` (${fmt(cNeedBox)} bte)` : '');
        if (cDispo > 0 && cDispo < pf) {
          cCls = 'need-card err';
          cMsg += `<br>⚠️ Manque ${fmt(pf - cDispo)} capsules`;
        } else if (cDispo >= pf && cDispo > 0) {
          cCls = 'need-card ok';
          cMsg += `<br>✔️ OK (+${fmt(cDispo - pf)})`;
        }

        // Calcul Trays
        const trFmt = Number(l.trFmt) || 12;
        const trPal = Number(l.trPerPal) || 0;
        const trNbPal = Number(l.trNbPal) || 0;
        const trNeed = pf > 0 ? Math.ceil(pf / trFmt) : 0;
        const trDispo = trPal * trNbPal;
        const trTag = (l.trRef || '').trim() ? ` [${l.trRef.trim()}]` : '';
        let trCls = 'need-card';
        let trMsg = `📦 <strong>Trays${trTag} (x${trFmt})</strong> : besoin ${fmt(trNeed)} trays`;
        if (trDispo > 0 && trDispo < trNeed) {
          trCls = 'need-card err';
          trMsg += `<br>⚠️ Manque ${fmt(trNeed - trDispo)} trays`;
        } else if (trDispo >= trNeed && trDispo > 0) {
          trCls = 'need-card ok';
          trMsg += `<br>✔️ OK (+${fmt(trDispo - trNeed)})`;
        }

        const card = document.createElement('div');
        card.className = 'line-card';
        card.innerHTML = `
          <div class="line-header">
            <div class="line-identity">
              <span class="pill-num">Ligne ${idx + 1}</span>
              <span class="pill-fruit">🍓 ${fName}</span>
              <span class="pill-total">${fmt(pf)} PF</span>
            </div>
            <div class="line-tools">
              <button type="button" class="btn btn-sec btn-mini" onclick="openFormModal(${idx})">✏️ Modifier</button>
              <button type="button" class="btn btn-del btn-mini" onclick="deleteLine(${idx})">🗑️</button>
            </div>
          </div>
          <div style="font-size:0.84rem; color:var(--muted); margin-bottom:10px;">
            Verre/app : <strong>${l.verPerApp || 0}</strong> × App : <strong>${l.nbApp || 0}</strong>
          </div>
          <div class="needs-grid">
            <div class="${vCls}">${vMsg}</div>
            <div class="${etCls}">${etMsg}</div>
            <div class="${cCls}">${cMsg}</div>
            <div class="${trCls}">${trMsg}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openFormModal(idx) {
      editingIndex = idx;
      const isEdit = idx !== null && lines[idx];
      const prev = lines[lines.length - 1];
      const base = isEdit ? lines[idx] : {
        ...createDefaultLine(lines.length),
        verPerApp: prev ? prev.verPerApp : '',
        verRef: prev ? prev.verRef : '',
        verPerPal: prev ? prev.verPerPal : '',
        etRef: prev ? prev.etRef : '',
        etPerPack: prev ? (prev.etPerPack || 5000) : 5000
      };

      document.getElementById('m-title').textContent = isEdit
        ? `✏️ Modifier Ligne ${idx + 1}`
        : `▶️ Nouvelle ligne ${lines.length + 1}`;

      document.getElementById('m-fruit').value = base.fruit || defaultFruitName(isEdit ? idx : lines.length);
      document.getElementById('m-ver-app').value = base.verPerApp;
      document.getElementById('m-nb-app').value = base.nbApp || 1;

      document.getElementById('m-ver-ref').value = base.verRef || '';
      document.getElementById('m-ver-pal').value = base.verPerPal || '';
      document.getElementById('m-ver-stk').value = base.verStkPal || '';

      document.getElementById('m-et-ref').value = base.etRef || '';
      document.getElementById('m-et-pack').value = base.etPerPack || 5000;
      document.getElementById('m-et-stk').value = base.etStkPack || '';

      document.getElementById('m-cap-ref').value = base.capRef || '';
      document.getElementById('m-cap-box').value = base.capPerBox || 400;
      document.getElementById('m-cap-nb-box').value = base.capNbBox || 1;

      document.getElementById('m-tr-ref').value = base.trRef || '';
      document.getElementById('m-tr-pal').value = base.trPerPal || 3000;
      document.getElementById('m-tr-nb-pal').value = base.trNbPal || 1;

      const targetFmt = Number(base.trFmt) || 12;
      document.querySelectorAll('input[name="m_fmt"]').forEach(r => {
        r.checked = Number(r.value) === targetFmt;
      });

      document.getElementById('form-modal').classList.add('open');
    }

    function closeFormModal() {
      document.getElementById('form-modal').classList.remove('open');
      editingIndex = null;
    }

    function saveFormModal() {
      const idxForDefault = editingIndex !== null ? editingIndex : lines.length;
      const typedFruit = document.getElementById('m-fruit').value.trim();
      const checkedFmt = document.querySelector('input[name="m_fmt"]:checked');

      const newLine = {
        fruit: typedFruit || defaultFruitName(idxForDefault),
        verPerApp: document.getElementById('m-ver-app').value,
        nbApp: document.getElementById('m-nb-app').value || 1,
        verRef: document.getElementById('m-ver-ref').value,
        verPerPal: document.getElementById('m-ver-pal').value,
        verStkPal: document.getElementById('m-ver-stk').value,
        etRef: document.getElementById('m-et-ref').value,
        etPerPack: document.getElementById('m-et-pack').value || 5000,
        etStkPack: document.getElementById('m-et-stk').value,
        capRef: document.getElementById('m-cap-ref').value,
        capPerBox: document.getElementById('m-cap-box').value || 400,
        capNbBox: document.getElementById('m-cap-nb-box').value || 1,
        trRef: document.getElementById('m-tr-ref').value,
        trPerPal: document.getElementById('m-tr-pal').value || 3000,
        trNbPal: document.getElementById('m-tr-nb-pal').value || 1,
        trFmt: checkedFmt ? Number(checkedFmt.value) : 12
      };

      if (editingIndex !== null && lines[editingIndex]) {
        lines[editingIndex] = newLine;
      } else {
        lines.push(newLine);
      }

      saveLines();
      closeFormModal();
      renderLines();
    }

    function deleteLine(idx) {
      lines.splice(idx, 1);
      saveLines();
      renderLines();
    }

    function resetAll() {
      if (confirm('Voulez-vous remettre à zéro et effacer toutes les lignes ?')) {
        lines = [];
        saveLines();
        renderLines();
      }
    }

    function printReport() {
      const area = document.getElementById('print-area');
      const now = new Date().toLocaleString('fr-FR');
      let cardsHtml = '';

      lines.forEach((l, idx) => {
        const pf = lineTotal(l);
        const trFmt = Number(l.trFmt) || 12;
        const trNeed = pf > 0 ? Math.ceil(pf / trFmt) : 0;
        const cBox = Number(l.capPerBox) || 0;
        const cNeedBox = cBox > 0 ? Math.ceil(pf / cBox) : 0;
        const etPack = Number(l.etPerPack) || 0;
        const etNeedPack = etPack > 0 ? Math.ceil(pf / etPack) : 0;

        cardsHtml += `
          <div class="p-card">
            <strong>Ligne ${idx + 1} — ${fruitLabel(l, idx)}</strong> : <strong>${fmt(pf)} PF</strong> (${l.verPerApp || 0} verre/app × ${l.nbApp || 0} app)<br>
            🫙 Verre [${l.verRef || '-'}]: besoin ${fmt(pf)} •
            🏷️ Ét. [${l.etRef || '-'}]: besoin ${fmt(pf)} (${fmt(etNeedPack)} pqt à ${fmt(etPack)}) •
            🔘 Cap. [${l.capRef || '-'}]: besoin ${fmt(pf)} (${fmt(cNeedBox)} bte à ${fmt(cBox)}) •
            📦 Tray [${l.trRef || '-'}] (x${trFmt}): besoin ${fmt(trNeed)} trays
          </div>
        `;
      });

      area.innerHTML = `
        <div style="display:flex; justify-content:space-between; border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:14px;">
          <div><strong>Total PF : ${fmt(grandTotal())}</strong></div>
          <div>${now}</div>
        </div>
        ${cardsHtml || '<p>Aucune ligne.</p>'}
      `;
      window.print();
    }

    loadLines();
    renderLines();
  </script>
</body>
</html>
