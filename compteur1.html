<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteurs Production</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --info-bg: #eff6ff;
      --info-border: #bfdbfe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 8px;
      width: 100%;
    }

    .top-bar {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .top-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    .top-total {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--primary);
    }

    /* Bande composants fixes/communs : Ét., Verre et récap global */
    .strip-wrap {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: stretch;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      width: 100%;
    }

    .comp-col {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      min-width: 215px;
      flex: 1 0 215px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .comp-head {
      font-size: 0.9rem;
      font-weight: 800;
      padding-bottom: 4px;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }

    .line-flex {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-end;
      gap: 5px;
    }

    .f-item {
      display: flex;
      flex-direction: column;
      min-width: 50px;
      flex: 1 1 50px;
    }

    .f-item.ref-item {
      min-width: 66px;
      flex: 0 0 74px;
    }

    .f-item.fmt-item {
      flex: 0 0 auto;
    }

    .f-item label {
      font-size: 0.64rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 2px;
      white-space: nowrap;
    }

    .ref-row {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .f-item input[type="number"],
    .f-item input[type="text"] {
      padding: 5px 6px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font-size: 0.88rem;
      width: 100%;
      background: #fff;
    }

    .abc-btn {
      padding: 5px 5px;
      border-radius: 5px;
      border: 1px solid #94a3b8;
      background: #e2e8f0;
      color: #0f172a;
      font-size: 0.64rem;
      font-weight: 800;
      cursor: pointer;
      line-height: 1;
      flex: 0 0 auto;
    }

    .abc-btn.active-abc {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .fmt-pills {
      display: flex;
      gap: 3px;
    }

    .fmt-pill {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border: 1px solid #94a3b8;
      background: #f8fafc;
      padding: 4px 5px;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .fmt-pill input {
      margin: 0;
    }

    .fmt-pill input:checked + span {
      color: var(--primary);
    }

    .need-bar {
      padding: 6px 8px;
      border-radius: 6px;
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      font-size: 0.76rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .need-bar.err {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .need-bar.ok {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    /* Bloc Lignes de production */
    .prod-zone {
      margin-top: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
    }

    .prod-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 6px;
      margin-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
    }

    .prod-title {
      font-size: 0.95rem;
      font-weight: 800;
    }

    .line-card {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px;
    }

    .line-top {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-end;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .line-badge {
      font-size: 0.78rem;
      font-weight: 800;
      background: #e2e8f0;
      padding: 5px 7px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .sub-badge {
      font-size: 0.85rem;
      font-weight: 800;
      padding: 5px 8px;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      white-space: nowrap;
    }

    .line-needs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .tag-pill {
      padding: 4px 7px;
      border-radius: 5px;
      background: var(--info-bg);
      border: 1px solid var(--info-border);
    }

    .tag-pill.err {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .tag-pill.ok {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    button.act-btn {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn-add { background: var(--success); color: #fff; }
    .btn-del { background: #fee2e2; color: var(--danger); padding: 5px 8px; }
    .btn-pdf { background: var(--primary); color: #fff; padding: 8px 14px; }
    .btn-rst { background: var(--danger); color: #fff; padding: 8px 14px; }
    .btn-sec { background: #e2e8f0; color: var(--text); }

    .bottom-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 12px 0;
    }

    /* Modale Assistant "+ Ligne" */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #fff;
      border-radius: 10px;
      padding: 14px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 6px;
    }

    .modal-step {
      display: none;
    }

    .modal-step.active {
      display: block;
    }

    .modal-q {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 12px;
    }

    #print-report { display: none; }

    @media print {
      body { background: #fff; padding: 0; }
      .top-bar, .strip-wrap, .prod-zone, .bottom-actions, .modal-backdrop { display: none !important; }
      #print-report { display: block !important; }
      .p-sec { border: 1px solid #bbb; border-radius: 6px; padding: 8px; margin-bottom: 10px; page-break-inside: avoid; }
      .p-tbl { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 4px; }
      .p-tbl th, .p-tbl td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; }
      .p-err { color: #dc2626 !important; font-weight: bold; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .p-ok { color: #16a34a !important; font-weight: bold; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-title">Total ✅ PF</div>
    <div class="top-total" id="top-total">0</div>
  </div>

  <!-- COMPOSANTS GLOBAUX : 🏷️ Ét. (5000 par défaut) | 🫙 Verre (renseigné 1 fois) | Récap 🔘 Cap. & 📦 Trays -->
  <div class="strip-wrap" id="global-strip"></div>

  <!-- LIGNES DE PRODUCTION (SANS + GROUPE) -->
  <div class="prod-zone">
    <div class="prod-header">
      <div class="prod-title">✅ PF • Lignes</div>
      <button type="button" class="act-btn btn-add" onclick="openAddLineWizard()">+ Ligne</button>
    </div>
    <div id="lines-container"></div>
  </div>

  <div class="bottom-actions">
    <button type="button" class="act-btn btn-pdf" onclick="printSummary()">🖨️ PDF</button>
    <button type="button" class="act-btn btn-rst" onclick="resetAll()">🔄 Reset</button>
  </div>

  <!-- ASSISTANT "+ LIGNE" -->
  <div class="modal-backdrop" id="wizard-modal">
    <div class="modal-box">
      <div class="modal-title" id="wiz-title">➕ Nouvelle ligne</div>

      <!-- ÉTAPE 1 : APP + NB/APP REPRIS -->
      <div class="modal-step" id="wiz-step-1">
        <div class="modal-q">1. Combien d'App ?</div>
        <div class="line-flex">
          <div class="f-item">
            <label>App</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="wiz-app" placeholder="0">
          </div>
          <div class="f-item">
            <label>Nb/app (repris)</label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" id="wiz-nbperapp" placeholder="0">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="act-btn btn-sec" onclick="closeWizard()">Annuler</button>
          <button type="button" class="act-btn btn-add" onclick="goWizardStep2()">Suivant ➔</button>
        </div>
      </div>

      <!-- ÉTAPE 2 : MÊME TRAY ? -->
      <div class="modal-step" id="wiz-step-2">
        <div class="modal-q">2. Est-ce le même 📦 Tray ?</div>
        <div id="wiz-tray-prev" style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px;"></div>
        <div id="wiz-tray-form" style="display:none; margin-top:8px;">
          <div class="line-flex">
            <div class="f-item ref-item">
              <label>Réf cct</label>
              <div class="ref-row">
                <input type="text" inputmode="numeric" id="wiz-tray-ref" placeholder="cct">
                <button type="button" class="abc-btn" onclick="toggleInputAbc('wiz-tray-ref', this)">ABC</button>
              </div>
            </div>
            <div class="f-item">
              <label>Tr/pal</label>
              <input type="number" inputmode="numeric" pattern="[0-9]*" id="wiz-tray-pal" placeholder="0">
            </div>
            <div class="f-item fmt-item">
              <label>Fmt</label>
              <div class="fmt-pills">
                <label class="fmt-pill"><input type="radio" name="wiz_tray_fmt" value="6" checked><span>6</span></label>
                <label class="fmt-pill"><input type="radio" name="wiz_tray_fmt" value="8"><span>8</span></label>
                <label class="fmt-pill"><input type="radio" name="wiz_tray_fmt" value="12"><span>12</span></label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-actions" id="wiz-tray-btns">
          <button type="button" class="act-btn btn-add" onclick="chooseSameTray(true)">Oui (recopier)</button>
          <button type="button" class="act-btn btn-pdf" onclick="chooseSameTray(false)">Non (nouveau)</button>
        </div>
        <div class="modal-actions" id="wiz-tray-next" style="display:none;">
          <button type="button" class="act-btn btn-add" onclick="saveNewTrayAndGoStep3()">Suivant ➔</button>
        </div>
      </div>

      <!-- ÉTAPE 3 : MÊME CAPSULE ? -->
      <div class="modal-step" id="wiz-step-3">
        <div class="modal-q">3. Est-ce la même 🔘 Capsule ?</div>
        <div id="wiz-cap-prev" style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px;"></div>
        <div id="wiz-cap-form" style="display:none; margin-top:8px;">
          <div class="line-flex">
            <div class="f-item ref-item">
              <label>Réf CRC</label>
              <div class="ref-row">
                <input type="text" inputmode="numeric" id="wiz-cap-ref" placeholder="CRC">
                <button type="button" class="abc-btn" onclick="toggleInputAbc('wiz-cap-ref', this)">ABC</button>
              </div>
            </div>
            <div class="f-item">
              <label>Cap/bte</label>
              <input type="number" inputmode="numeric" pattern="[0-9]*" id="wiz-cap-box" placeholder="0">
            </div>
            <div class="f-item">
              <label>Bte/pal</label>
              <input type="number" inputmode="numeric" pattern="[0-9]*" id="wiz-cap-pal" placeholder="0">
            </div>
          </div>
        </div>
        <div class="modal-actions" id="wiz-cap-btns">
          <button type="button" class="act-btn btn-add" onclick="chooseSameCap(true)">Oui (recopier)</button>
          <button type="button" class="act-btn btn-pdf" onclick="chooseSameCap(false)">Non (nouvelle)</button>
        </div>
        <div class="modal-actions" id="wiz-cap-finish" style="display:none;">
          <button type="button" class="act-btn btn-add" onclick="saveNewCapAndFinish()">Valider ✓</button>
        </div>
      </div>
    </div>
  </div>

  <div id="print-report"></div>

  <script>
    const KEY = 'compteurs_sans_groupe_v1';

    let state = {
      etiquettes: { ref: '', perPack: 5000, stockPacks: '' },
      verre:      { ref: '', perPallet: '', stockPallets: '' },
      lines: []
    };

    let draftLine = null;

    function defLine() {
      return {
        nbApp: '',
        nbPerApp: '',
        tray: { ref: '', perPallet: '', packSize: 6 },
        cap:  { ref: '', perBox: '', boxesPerPallet: '' }
      };
    }

    function defState() {
      return {
        etiquettes: { ref: '', perPack: 5000, stockPacks: '' },
        verre:      { ref: '', perPallet: '', stockPallets: '' },
        lines: [defLine()]
      };
    }

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const p = JSON.parse(raw);
          state = Object.assign(defState(), p);
          state.etiquettes = Object.assign(defState().etiquettes, p.etiquettes || {});
          state.verre = Object.assign(defState().verre, p.verre || {});
          if (!Array.isArray(state.lines) || !state.lines.length) state.lines = [defLine()];
          return;
        }
      } catch (e) {}
      state = defState();
    }

    function save() {
      localStorage.setItem(KEY, JSON.stringify(state));
    }

    function fmt(n) {
      return Math.ceil(Number(n) || 0).toLocaleString('fr-FR');
    }

    function linePF(l) {
      return (Number(l.nbApp) || 0) * (Number(l.nbPerApp) || 0);
    }

    function totPF() {
      return state.lines.reduce((s, l) => s + linePF(l), 0);
    }

    function toggleInputAbc(inputId, btn) {
      const inp = document.getElementById(inputId);
      if (!inp) return;
      const isText = btn.classList.toggle('active-abc');
      inp.inputMode = isText ? 'text' : 'numeric';
      inp.focus();
    }

    function numField(lbl, val, fn) {
      const d = document.createElement('div');
      d.className = 'f-item';
      const l = document.createElement('label');
      l.textContent = lbl;
      const i = document.createElement('input');
      i.type = 'number';
      i.inputMode = 'numeric';
      i.pattern = '[0-9]*';
      i.min = '0';
      i.step = 'any';
      i.placeholder = '0';
      i.value = val;
      i.oninput = (e) => { fn(e.target.value); save(); refresh(); };
      d.appendChild(l);
      d.appendChild(i);
      return d;
    }

    function refField(lbl, val, fn) {
      const d = document.createElement('div');
      d.className = 'f-item ref-item';
      const l = document.createElement('label');
      l.textContent = lbl;

      const wrap = document.createElement('div');
      wrap.className = 'ref-row';

      const i = document.createElement('input');
      i.type = 'text';
      i.inputMode = 'numeric';
      i.placeholder = lbl.replace('Réf ', '');
      i.value = val;
      i.oninput = (e) => { fn(e.target.value); save(); refresh(); };

      const abc = document.createElement('button');
      abc.type = 'button';
      abc.className = 'abc-btn';
      abc.textContent = 'ABC';
      abc.onclick = () => {
        const isText = abc.classList.toggle('active-abc');
        i.inputMode = isText ? 'text' : 'numeric';
        i.focus();
      };

      wrap.appendChild(i);
      wrap.appendChild(abc);
      d.appendChild(l);
      d.appendChild(wrap);
      return d;
    }

    function renderGlobalStrip() {
      const strip = document.getElementById('global-strip');
      strip.innerHTML = '';

      // 🏷️ Ét. (5000 par défaut)
      const cEt = document.createElement('div');
      cEt.className = 'comp-col';
      cEt.innerHTML = `<div class="comp-head">🏷️ Ét.</div>`;
      const lEt = document.createElement('div');
      lEt.className = 'line-flex';
      lEt.appendChild(refField('Réf eti', state.etiquettes.ref, (v) => { state.etiquettes.ref = v; }));
      lEt.appendChild(numField('Ét/pqt', state.etiquettes.perPack, (v) => { state.etiquettes.perPack = v; }));
      lEt.appendChild(numField('Stk pqt', state.etiquettes.stockPacks, (v) => { state.etiquettes.stockPacks = v; }));
      cEt.appendChild(lEt);
      const nEt = document.createElement('div');
      nEt.className = 'need-bar';
      nEt.id = 'nd_et';
      cEt.appendChild(nEt);
      strip.appendChild(cEt);

      // 🫙 Verre (renseigné 1 seule fois, puisé par toutes les lignes)
      const cVer = document.createElement('div');
      cVer.className = 'comp-col';
      cVer.innerHTML = `<div class="comp-head">🫙 Verre</div>`;
      const lVer = document.createElement('div');
      lVer.className = 'line-flex';
      lVer.appendChild(refField('Réf V', state.verre.ref, (v) => { state.verre.ref = v; }));
      lVer.appendChild(numField('Ver/pal', state.verre.perPallet, (v) => { state.verre.perPallet = v; }));
      lVer.appendChild(numField('Stk pal', state.verre.stockPallets, (v) => { state.verre.stockPallets = v; }));
      cVer.appendChild(lVer);
      const nVer = document.createElement('div');
      nVer.className = 'need-bar';
      nVer.id = 'nd_ver';
      cVer.appendChild(nVer);
      strip.appendChild(cVer);

      // Récapitulatif global 🔘 Cap. et 📦 Trays cumulés
      const cCapSum = document.createElement('div');
      cCapSum.className = 'comp-col';
      cCapSum.innerHTML = `<div class="comp-head">🔘 Cap. (Total)</div><div class="need-bar" id="nd_cap_tot"></div>`;
      strip.appendChild(cCapSum);

      const cTrSum = document.createElement('div');
      cTrSum.className = 'comp-col';
      cTrSum.innerHTML = `<div class="comp-head">📦 Trays (Total)</div><div class="need-bar" id="nd_tr_tot"></div>`;
      strip.appendChild(cTrSum);
    }

    function renderLines() {
      const box = document.getElementById('lines-container');
      box.innerHTML = '';

      state.lines.forEach((l, idx) => {
        const card = document.createElement('div');
        card.className = 'line-card';

        const top = document.createElement('div');
        top.className = 'line-top';

        const badge = document.createElement('span');
        badge.className = 'line-badge';
        badge.textContent = `L${idx + 1}`;
        top.appendChild(badge);

        // App & Nb/app
        top.appendChild(numField('App', l.nbApp, (v) => { state.lines[idx].nbApp = v; }));
        top.appendChild(numField('Nb/app', l.nbPerApp, (v) => { state.lines[idx].nbPerApp = v; }));

        const sub = document.createElement('span');
        sub.className = 'sub-badge';
        sub.id = `sub_${idx}`;
        sub.textContent = `= ${fmt(linePF(l))}`;
        top.appendChild(sub);

        // 📦 Tray de la ligne
        top.appendChild(refField('Réf cct', l.tray.ref, (v) => { state.lines[idx].tray.ref = v; }));
        top.appendChild(numField('Tr/pal', l.tray.perPallet, (v) => { state.lines[idx].tray.perPallet = v; }));

        const fd = document.createElement('div');
        fd.className = 'f-item fmt-item';
        const fl = document.createElement('label');
        fl.textContent = 'Fmt';
        fd.appendChild(fl);
        const fp = document.createElement('div');
        fp.className = 'fmt-pills';
        [6, 8, 12].forEach(o => {
          const lb = document.createElement('label');
          lb.className = 'fmt-pill';
          const rd = document.createElement('input');
          rd.type = 'radio';
          rd.name = `fmt_line_${idx}`;
          rd.value = o;
          rd.checked = Number(l.tray.packSize) === o;
          rd.onchange = () => { state.lines[idx].tray.packSize = o; save(); refresh(); };
          const sp = document.createElement('span');
          sp.textContent = o;
          lb.appendChild(rd);
          lb.appendChild(sp);
          fp.appendChild(lb);
        });
        fd.appendChild(fp);
        top.appendChild(fd);

        // 🔘 Capsule de la ligne
        top.appendChild(refField('Réf CRC', l.cap.ref, (v) => { state.lines[idx].cap.ref = v; }));
        top.appendChild(numField('Cap/bte', l.cap.perBox, (v) => { state.lines[idx].cap.perBox = v; }));
        top.appendChild(numField('Bte/pal', l.cap.boxesPerPallet, (v) => { state.lines[idx].cap.boxesPerPallet = v; }));

        if (state.lines.length > 1) {
          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'act-btn btn-del';
          del.textContent = '×';
          del.onclick = () => { state.lines.splice(idx, 1); save(); renderLines(); refresh(); };
          top.appendChild(del);
        }

        card.appendChild(top);

        const needs = document.createElement('div');
        needs.className = 'line-needs';
        needs.id = `lneeds_${idx}`;
        card.appendChild(needs);

        box.appendChild(card);
      });
    }

    function refresh() {
      const pf = totPF();
      document.getElementById('top-total').textContent = fmt(pf);

      // 🏷️ Étiquettes (5000 par défaut)
      const perP = Number(state.etiquettes.perPack) || 0;
      const stkP = Number(state.etiquettes.stockPacks) || 0;
      const stkEt = stkP * perP;
      const needPqt = perP > 0 ? Math.ceil(pf / perP) : 0;
      const etTag = (state.etiquettes.ref || '').trim() ? ` [${state.etiquettes.ref.trim()}]` : '';
      const nEt = document.getElementById('nd_et');
      if (nEt) {
        nEt.className = 'need-bar';
        let txt = `Besoin${etTag}: ${fmt(pf)} ét.` + (perP > 0 ? ` (${fmt(needPqt)} pqt)` : '');
        if (stkP > 0) {
          const diff = stkEt - pf;
          if (diff < 0) {
            nEt.classList.add('err');
            txt += ` • Manque ${fmt(Math.abs(diff))} ét.`;
          } else {
            nEt.classList.add('ok');
            txt += ` • OK (+${fmt(diff)})`;
          }
        }
        nEt.textContent = txt;
      }

      // 🫙 Verre (puisé par toutes les lignes)
      const vPal = Number(state.verre.perPallet) || 0;
      const vStkPal = Number(state.verre.stockPallets) || 0;
      const vStkUnits = vStkPal * vPal;
      const vNeedPal = vPal > 0 ? Math.ceil(pf / vPal) : 0;
      const vTag = (state.verre.ref || '').trim() ? ` [${state.verre.ref.trim()}]` : '';
      const nVer = document.getElementById('nd_ver');
      if (nVer) {
        nVer.className = 'need-bar';
        let txt = `Puisé${vTag}: ${fmt(pf)} ver.` + (vPal > 0 ? ` (${fmt(vNeedPal)} pal)` : '');
        if (vStkPal > 0) {
          const diff = vStkUnits - pf;
          if (diff < 0) {
            nVer.classList.add('err');
            txt += ` • Manque ${fmt(Math.abs(diff))} ver.`;
          } else {
            nVer.classList.add('ok');
            txt += ` • Reste ${fmt(diff)} ver.`;
          }
        }
        nVer.textContent = txt;
      }

      // Détail par ligne + cumul Cap / Trays / Verre puisé
      let totTrays = 0;
      let totCap = 0;
      let cumulVerre = 0;

      state.lines.forEach((l, idx) => {
        const q = linePF(l);
        cumulVerre += q;

        const subEl = document.getElementById(`sub_${idx}`);
        if (subEl) subEl.textContent = `= ${fmt(q)}`;

        // Tray ligne
        const fmtN = Number(l.tray.packSize) || 6;
        const trPal = Number(l.tray.perPallet) || 0;
        const needTr = q > 0 ? Math.ceil(q / fmtN) : 0;
        const needTrPal = trPal > 0 ? Math.ceil(needTr / trPal) : 0;
        totTrays += needTr;
        const trTag = (l.tray.ref || '').trim() ? ` [${l.tray.ref.trim()}]` : '';

        // Cap ligne
        const cBox = Number(l.cap.perBox) || 0;
        const cBtePal = Number(l.cap.boxesPerPallet) || 0;
        const cPal = cBox * cBtePal;
        const needBte = cBox > 0 ? Math.ceil(q / cBox) : 0;
        const needCPal = cPal > 0 ? Math.ceil(q / cPal) : 0;
        totCap += q;
        const cTag = (l.cap.ref || '').trim() ? ` [${l.cap.ref.trim()}]` : '';

        // Verre puisé sur cette ligne
        let verreClass = 'tag-pill';
        let verreTxt = `🫙 Puisé: ${fmt(q)} (cumul ${fmt(cumulVerre)})`;
        if (vStkUnits > 0) {
          const reste = vStkUnits - cumulVerre;
          if (reste < 0) {
            verreClass = 'tag-pill err';
            verreTxt = `🫙 Manque ${fmt(Math.min(q, Math.abs(reste)))} ver. (cumul ${fmt(cumulVerre)}/${fmt(vStkUnits)})`;
          } else {
            verreClass = 'tag-pill ok';
            verreTxt = `🫙 Reste ${fmt(reste)} ver.`;
          }
        }

        const lnEl = document.getElementById(`lneeds_${idx}`);
        if (lnEl) {
          lnEl.innerHTML = `
            <span class="tag-pill">📦 Tray${trTag} (x${fmtN}): ${fmt(needTr)} tr.${trPal > 0 ? ` / ${fmt(needTrPal)} pal` : ''}</span>
            <span class="tag-pill">🔘 Cap${cTag}: ${fmt(q)} cap.${cBox > 0 ? ` / ${fmt(needBte)} bte` : ''}${cPal > 0 ? ` / ${fmt(needCPal)} pal` : ''}</span>
            <span class="${verreClass}">${verreTxt}</span>
          `;
        }
      });

      const capTotEl = document.getElementById('nd_cap_tot');
      if (capTotEl) capTotEl.textContent = `Total besoin: ${fmt(totCap)} cap.`;

      const trTotEl = document.getElementById('nd_tr_tot');
      if (trTotEl) trTotEl.textContent = `Total besoin: ${fmt(totTrays)} trays`;
    }

    // --- ASSISTANT "+ LIGNE" ---
    function showWizardStep(stepNum) {
      [1, 2, 3].forEach(n => {
        document.getElementById(`wiz-step-${n}`).classList.toggle('active', n === stepNum);
      });
    }

    function openAddLineWizard() {
      const prev = state.lines[state.lines.length - 1] || defLine();
      draftLine = {
        nbApp: '',
        nbPerApp: prev.nbPerApp || '',
        tray: { ...prev.tray },
        cap: { ...prev.cap }
      };

      document.getElementById('wiz-title').textContent = `➕ Ligne ${state.lines.length + 1}`;
      document.getElementById('wiz-app').value = '';
      document.getElementById('wiz-nbperapp').value = prev.nbPerApp || '';

      // Reset étape 2 (Tray)
      document.getElementById('wiz-tray-prev').textContent =
        `Précédent : Réf [${prev.tray.ref || '-'}] • Tr/pal: ${prev.tray.perPallet || 0} • Fmt: ${prev.tray.packSize || 6}`;
      document.getElementById('wiz-tray-form').style.display = 'none';
      document.getElementById('wiz-tray-btns').style.display = 'flex';
      document.getElementById('wiz-tray-next').style.display = 'none';

      // Reset étape 3 (Capsule)
      document.getElementById('wiz-cap-prev').textContent =
        `Précédent : Réf [${prev.cap.ref || '-'}] • Cap/bte: ${prev.cap.perBox || 0} • Bte/pal: ${prev.cap.boxesPerPallet || 0}`;
      document.getElementById('wiz-cap-form').style.display = 'none';
      document.getElementById('wiz-cap-btns').style.display = 'flex';
      document.getElementById('wiz-cap-finish').style.display = 'none';

      showWizardStep(1);
      document.getElementById('wizard-modal').classList.add('open');
      setTimeout(() => document.getElementById('wiz-app').focus(), 50);
    }

    function closeWizard() {
      document.getElementById('wizard-modal').classList.remove('open');
      draftLine = null;
    }

    function goWizardStep2() {
      draftLine.nbApp = document.getElementById('wiz-app').value;
      draftLine.nbPerApp = document.getElementById('wiz-nbperapp').value;
      showWizardStep(2);
    }

    function chooseSameTray(isSame) {
      if (isSame) {
        // Garde les infos de tray du précédent
        showWizardStep(3);
      } else {
        document.getElementById('wiz-tray-ref').value = '';
        document.getElementById('wiz-tray-pal').value = '';
        document.getElementById('wiz-tray-form').style.display = 'block';
        document.getElementById('wiz-tray-btns').style.display = 'none';
        document.getElementById('wiz-tray-next').style.display = 'flex';
      }
    }

    function saveNewTrayAndGoStep3() {
      const checkedFmt = document.querySelector('input[name="wiz_tray_fmt"]:checked');
      draftLine.tray = {
        ref: document.getElementById('wiz-tray-ref').value,
        perPallet: document.getElementById('wiz-tray-pal').value,
        packSize: checkedFmt ? Number(checkedFmt.value) : 6
      };
      showWizardStep(3);
    }

    function chooseSameCap(isSame) {
      if (isSame) {
        finishWizard();
      } else {
        document.getElementById('wiz-cap-ref').value = '';
        document.getElementById('wiz-cap-box').value = '';
        document.getElementById('wiz-cap-pal').value = '';
        document.getElementById('wiz-cap-form').style.display = 'block';
        document.getElementById('wiz-cap-btns').style.display = 'none';
        document.getElementById('wiz-cap-finish').style.display = 'flex';
      }
    }

    function saveNewCapAndFinish() {
      draftLine.cap = {
        ref: document.getElementById('wiz-cap-ref').value,
        perBox: document.getElementById('wiz-cap-box').value,
        boxesPerPallet: document.getElementById('wiz-cap-pal').value
      };
      finishWizard();
    }

    function finishWizard() {
      state.lines.push(draftLine);
      save();
      closeWizard();
      renderLines();
      refresh();
    }

    function resetAll() {
      if (confirm('Reset à zéro ?')) {
        state = defState();
        save();
        renderGlobalStrip();
        renderLines();
        refresh();
      }
    }

    function printSummary() {
      const rep = document.getElementById('print-report');
      const now = new Date().toLocaleString('fr-FR');
      const pf = totPF();

      let rowsHtml = '';
      state.lines.forEach((l, i) => {
        const q = linePF(l);
        const fmtN = Number(l.tray.packSize) || 6;
        const needTr = q > 0 ? Math.ceil(q / fmtN) : 0;
        rowsHtml += `
          <tr>
            <td>L${i + 1}</td>
            <td>${l.nbApp || 0}</td>
            <td>${l.nbPerApp || 0}</td>
            <td><strong>${fmt(q)}</strong></td>
            <td>${l.tray.ref || '-'} (x${fmtN}) → ${fmt(needTr)} tr.</td>
            <td>${l.cap.ref || '-'} → ${fmt(q)} cap.</td>
          </tr>
        `;
      });

      const etTxt = document.getElementById('nd_et').textContent;
      const verTxt = document.getElementById('nd_ver').textContent;

      rep.innerHTML = `
        <div style="display:flex; justify-content:space-between; border-bottom:2px solid #000; padding-bottom:6px; margin-bottom:10px;">
          <strong>Total ✅ PF: ${fmt(pf)}</strong>
          <span>${now}</span>
        </div>
        <div class="p-sec">
          <strong>🏷️ Ét. & 🫙 Verre</strong><br>
          ${etTxt}<br>
          ${verTxt}
        </div>
        <div class="p-sec">
          <strong>✅ Lignes de production</strong>
          <table class="p-tbl">
            <thead>
              <tr><th>Ligne</th><th>App</th><th>Nb/app</th><th>PF</th><th>📦 Tray</th><th>🔘 Cap.</th></tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      `;
      window.print();
    }

    load();
    renderGlobalStrip();
    renderLines();
    refresh();
  </script>
</body>
</html>
