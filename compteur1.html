<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteurs Production</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --info-bg: #eff6ff;
      --info-border: #bfdbfe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      max-width: 960px;
      margin: 0 auto;
    }

    /* En-tête Total PF + +/- sur la première page */
    .top-card {
      background: var(--card);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.08);
    }

    .top-label {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
    }

    .top-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-value {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--primary);
    }

    /* Deuxième bloc : Verre + case Nb verre / app */
    .glass-fixed-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .glass-line-1 {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 8px;
    }

    .glass-line-2 {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--info-bg);
      border: 1px solid var(--info-border);
    }

    .glass-line-2.err {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .glass-line-2.ok {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    .field {
      display: flex;
      flex-direction: column;
      min-width: 105px;
    }

    .field label {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .field input[type="number"],
    .field input[type="text"] {
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.98rem;
      width: 100%;
      background: #fff;
    }

    .ref-row {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .abc-btn {
      padding: 8px 7px;
      border-radius: 8px;
      border: 1px solid #94a3b8;
      background: #e2e8f0;
      color: var(--text);
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .abc-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .step-btn {
      width: 32px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid #94a3b8;
      background: #e2e8f0;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .step-btn:active {
      transform: scale(0.96);
    }

    .step-num-inp {
      width: 64px !important;
      text-align: center;
      padding: 7px 6px !important;
    }

    .empty-box {
      background: var(--card);
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 14px;
    }

    .line-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .line-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
    }

    .line-identity {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill-fruit {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      font-size: 0.96rem;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 7px;
    }

    .line-tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mini-stepper {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 3px 6px;
      font-size: 0.84rem;
      font-weight: 800;
    }

    .mini-step-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid #94a3b8;
      background: #e2e8f0;
      color: var(--text);
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .line-meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    /* Lignes compactes sans dénomination */
    .consumables-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cons-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      cursor: pointer;
      transition: transform 0.08s ease;
    }

    .cons-row:active {
      transform: scale(0.99);
    }

    .cons-row.err {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .cons-row.ok {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    .cons-text {
      font-size: 0.86rem;
      font-weight: 700;
      line-height: 1.3;
      flex: 1;
    }

    .cons-right-controls {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .cons-step-btn {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      border: 1px solid #94a3b8;
      background: #ffffff;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .bottom-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 18px 0 12px;
    }

    button.btn {
      padding: 11px 18px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-add { background: var(--success); color: #fff; }
    .btn-add:hover { background: #15803d; }
    .btn-reset { background: var(--danger); color: #fff; }
    .btn-reset:hover { background: #b91c1c; }
    .btn-pdf   { background: var(--primary); color: #fff; }
    .btn-pdf:hover { background: var(--primary-hover); }
    .btn-sec   { background: #e2e8f0; color: var(--text); }
    .btn-mini  { padding: 7px 11px; font-size: 0.84rem; border-radius: 8px; }
    .btn-del   { background: #fee2e2; color: var(--danger); }

    /* Modales */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-bg.open {
      display: flex;
    }

    .modal-panel {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 1.05rem;
      font-weight: 900;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .fmt-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .fmt-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 7px 6px;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      background: #f8fafc;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }

    #print-area { display: none; }

    @media print {
      body { background: #fff; padding: 0; }
      .top-card, .glass-fixed-card, #lines-list, .bottom-bar, .modal-bg { display: none !important; }
      #print-area { display: block !important; }
      .p-card { border: 1px solid #bbb; border-radius: 8px; padding: 10px; margin-bottom: 12px; page-break-inside: avoid; }
    }
  </style>
</head>
<body>

  <!-- PREMIÈRE PAGE : TOTAL PF + +/- -->
  <div class="top-card">
    <div>
      <div class="top-label">Total Produit Fini</div>
      <div class="top-sub" id="top-count">Aucune ligne</div>
    </div>
    <div class="top-right">
      <div class="mini-stepper">
        <span>App:</span>
        <button type="button" class="mini-step-btn" onclick="stepFirstLineApps(-1)">-</button>
        <span id="top-app-val">0</span>
        <button type="button" class="mini-step-btn" onclick="stepFirstLineApps(1)">+</button>
      </div>
      <div class="top-value" id="top-total">0</div>
    </div>
  </div>

  <!-- DEUXIÈME BLOC : VERRE + CASE NB DE VERRE / APP -->
  <div class="glass-fixed-card">
    <div class="glass-line-1">
      <div class="field" style="flex:1 1 115px;">
        <label>Nb verre / app</label>
        <input type="number" inputmode="numeric" pattern="[0-9]*" id="g-ver-app" value="3500">
      </div>
      <div class="field" style="flex:1 1 120px;">
        <label>🫙 Nom verre (Réf V)</label>
        <div class="ref-row">
          <input type="text" inputmode="numeric" id="g-ver-ref" placeholder="Nom / V">
          <button type="button" class="abc-btn" onclick="toggleAbc('g-ver-ref', this)">ABC</button>
        </div>
      </div>
      <div class="field" style="flex:1 1 105px;">
        <label>Nb / palette</label>
        <input type="number" inputmode="numeric" pattern="[0-9]*" id="g-ver-pal" placeholder="0">
      </div>
      <div class="field" style="flex:0 0 auto;">
        <label>Nb palettes</label>
        <div class="stepper">
          <button type="button" class="step-btn" onclick="stepGlassPallets(-1)">-</button>
          <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-num-inp" id="g-ver-stk" placeholder="0">
          <button type="button" class="step-btn" onclick="stepGlassPallets(1)">+</button>
        </div>
      </div>
    </div>
    <div class="glass-line-2" id="g-ver-status">
      <span>Stock : 0 pal</span>
      <span>Besoin PF : 0</span>
    </div>
  </div>

  <div id="lines-list"></div>

  <!-- BOUTON AJOUT -->
  <div class="bottom-bar">
    <button type="button" class="btn btn-add" onclick="openAddAppModal()">➕ Ajout</button>
    <button type="button" class="btn btn-reset" onclick="resetAll()">🔄 Reset</button>
    <button type="button" class="btn btn-pdf" onclick="printReport()">🖨️ PDF</button>
  </div>

  <!-- MODALE AJOUT : FRUIT + NB APP -->
  <div class="modal-bg" id="add-modal">
    <div class="modal-panel">
      <div class="modal-head">
        <span>➕ Ajout</span>
        <button type="button" class="btn btn-sec btn-mini" onclick="closeAddModal()">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <div class="field">
          <label>Fruit</label>
          <input type="text" inputmode="text" id="add-fruit" placeholder="Fruit 1">
        </div>
        <div class="field">
          <label>Combien d'app ?</label>
          <div class="stepper">
            <button type="button" class="step-btn" onclick="stepAddApps(-1)">-</button>
            <input type="number" inputmode="numeric" pattern="[0-9]*" class="step-num-inp" id="add-nb-app" value="1">
            <button type="button" class="step-btn" onclick="stepAddApps(1)">+</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sec" onclick="closeAddModal()">Annuler</button>
        <button type="button" class="btn btn-add" onclick="confirmAddLine()">Valider ✓</button>
      </div>
    </div>
  </div>

  <!-- MODALE CLIC SUR LIGNE : NOMBRE PAR BOÎTE & NB DE BOÎTES -->
  <div class="modal-bg" id="cons-modal">
    <div class="modal-panel">
      <div class="modal-head">
        <span id="cons-title">Détail</span>
        <button type="button" class="btn btn-sec btn-mini" onclick="closeConsModal()">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div class="field">
          <label id="cons-per-box-label">Nombre par boîte</label>
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="cons-per-box" placeholder="0">
        </div>
        <div class="field">
          <label id="cons-nb-box-label">Nombre de boîtes (0 si rien)</label>
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="cons-nb-box" placeholder="0">
        </div>
        <div class="field" id="cons-fmt-wrap" style="display:none;">
          <label>Format</label>
          <div class="fmt-group">
            <label class="fmt-btn"><input type="radio" name="cons_fmt" value="6"><span>6</span></label>
            <label class="fmt-btn"><input type="radio" name="cons_fmt" value="8"><span>8</span></label>
            <label class="fmt-btn"><input type="radio" name="cons_fmt" value="12" checked><span>12</span></label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sec" onclick="closeConsModal()">Annuler</button>
        <button type="button" class="btn btn-add" onclick="saveConsModal()">Valider ✓</button>
      </div>
    </div>
  </div>

  <div id="print-area"></div>

  <script>
    const STORAGE_KEY = 'compteurs_epure_ecart_v1';

    let state = {
      verre: { verPerApp: 3500, ref: '', perPal: '', stkPal: '' },
      lines: []
    };

    let activeConsTarget = null;

    function getDefaultFruit(index) {
      return `Fruit ${index + 1}`;
    }

    function getVerPerApp() {
      const v = Number(state.verre.verPerApp);
      return Number.isFinite(v) && v >= 0 ? v : 3500;
    }

    function createLine(fruit = 'Fruit 1', nbApp = 1) {
      return {
        fruit: fruit,
        nbApp: nbApp,
        etPerPack: 5000,
        etStkPack: 0,
        capPerBox: 400,
        capNbBox: 0,
        trPerPal: 3000,
        trNbPal: 0,
        trFmt: 12
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.verre = Object.assign({ verPerApp: 3500, ref: '', perPal: '', stkPal: '' }, parsed.verre || {});
          state.lines = Array.isArray(parsed.lines) ? parsed.lines : [];
          return;
        }
      } catch (e) {}
      state = { verre: { verPerApp: 3500, ref: '', perPal: '', stkPal: '' }, lines: [] };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function fmt(n) {
      return Math.ceil(Number(n) || 0).toLocaleString('fr-FR');
    }

    function plural(count, sing, plur) {
      return count <= 1 ? sing : plur;
    }

    function lineTotal(l) {
      return getVerPerApp() * (Number(l.nbApp) || 0);
    }

    function grandTotal() {
      return state.lines.reduce((s, l) => s + lineTotal(l), 0);
    }

    function fruitDisplay(l, idx) {
      const f = (l.fruit || '').trim();
      return f ? f : getDefaultFruit(idx);
    }

    function toggleAbc(id, btn) {
      const inp = document.getElementById(id);
      if (!inp) return;
      const isText = btn.classList.toggle('active');
      inp.inputMode = isText ? 'text' : 'numeric';
      inp.focus();
    }

    function bindFixedGlassInputs() {
      const appInp = document.getElementById('g-ver-app');
      const refInp = document.getElementById('g-ver-ref');
      const palInp = document.getElementById('g-ver-pal');
      const stkInp = document.getElementById('g-ver-stk');

      appInp.value = state.verre.verPerApp !== '' && state.verre.verPerApp !== undefined ? state.verre.verPerApp : 3500;
      refInp.value = state.verre.ref || '';
      palInp.value = state.verre.perPal || '';
      stkInp.value = state.verre.stkPal || '';

      appInp.oninput = (e) => {
        state.verre.verPerApp = e.target.value;
        saveState();
        renderLines();
      };
      refInp.oninput = (e) => { state.verre.ref = e.target.value; saveState(); refreshGlassStatus(); };
      palInp.oninput = (e) => { state.verre.perPal = e.target.value; saveState(); refreshGlassStatus(); };
      stkInp.oninput = (e) => { state.verre.stkPal = e.target.value; saveState(); refreshGlassStatus(); };
    }

    function stepGlassPallets(delta) {
      const current = Number(state.verre.stkPal) || 0;
      const next = Math.max(0, current + delta);
      state.verre.stkPal = next;
      document.getElementById('g-ver-stk').value = next;
      saveState();
      refreshGlassStatus();
    }

    function stepFirstLineApps(delta) {
      if (!state.lines.length) {
        if (delta > 0) {
          state.lines.push(createLine(getDefaultFruit(0), delta));
          saveState();
          renderLines();
        }
        return;
      }
      const current = Number(state.lines[0].nbApp) || 0;
      state.lines[0].nbApp = Math.max(0, current + delta);
      saveState();
      renderLines();
    }

    function stepLineApps(idx, delta) {
      if (!state.lines[idx]) return;
      const current = Number(state.lines[idx].nbApp) || 0;
      state.lines[idx].nbApp = Math.max(0, current + delta);
      saveState();
      renderLines();
    }

    function stepConsumable(idx, type, delta, event) {
      if (event) event.stopPropagation();
      const l = state.lines[idx];
      if (!l) return;

      if (type === 'et') {
        l.etStkPack = Math.max(0, (Number(l.etStkPack) || 0) + delta);
      } else if (type === 'cap') {
        l.capNbBox = Math.max(0, (Number(l.capNbBox) || 0) + delta);
      } else if (type === 'tr') {
        l.trNbPal = Math.max(0, (Number(l.trNbPal) || 0) + delta);
      }
      saveState();
      renderLines();
    }

    function refreshGlassStatus() {
      const pf = grandTotal();
      const vRef = (state.verre.ref || '').trim();
      const vPerPal = Number(state.verre.perPal) || 0;
      const vStkPal = Number(state.verre.stkPal) || 0;
      const vStockUnits = vPerPal * vStkPal;
      const vNeedPal = vPerPal > 0 ? Math.ceil(pf / vPerPal) : 0;

      const bar = document.getElementById('g-ver-status');
      bar.className = 'glass-line-2';

      const namePart = vRef ? `<strong>${vRef}</strong> • ` : '';
      const needPart = `Besoin PF : <strong>${fmt(pf)}</strong>`;

      if (pf > 0 && vPerPal > 0) {
        const diffPal = vStkPal - vNeedPal;
        if (diffPal < 0) {
          const m = Math.abs(diffPal);
          bar.classList.add('err');
          bar.innerHTML = `<span>${namePart}Stock : <strong>${vStkPal}</strong> ${plural(vStkPal, 'palette', 'palettes')}</span><span>${needPart} (${vNeedPal} pal) • Manque ${m} ${plural(m, 'palette', 'palettes')}</span>`;
        } else if (diffPal > 0) {
          bar.classList.add('ok');
          bar.innerHTML = `<span>${namePart}Stock : <strong>${vStkPal}</strong> ${plural(vStkPal, 'palette', 'palettes')}</span><span>${needPart} (${vNeedPal} pal) • ${diffPal} ${plural(diffPal, 'palette', 'palettes')} en trop</span>`;
        } else {
          bar.classList.add('ok');
          bar.innerHTML = `<span>${namePart}Stock : <strong>${vStkPal}</strong> ${plural(vStkPal, 'palette', 'palettes')}</span><span>${needPart} (${vNeedPal} pal) • OK</span>`;
        }
      } else if (pf > 0 && vStockUnits < pf) {
        bar.classList.add('err');
        bar.innerHTML = `<span>${namePart}Stock : <strong>${vStkPal}</strong> ${plural(vStkPal, 'palette', 'palettes')}</span><span>${needPart} • Manque ${fmt(pf - vStockUnits)}</span>`;
      } else {
        bar.innerHTML = `<span>${namePart}Stock : <strong>${vStkPal}</strong> ${plural(vStkPal, 'palette', 'palettes')}</span><span>${needPart}</span>`;
      }
    }

    function renderLines() {
      const container = document.getElementById('lines-list');
      const pfTotal = grandTotal();
      const verPerApp = getVerPerApp();

      document.getElementById('top-total').textContent = fmt(pfTotal);
      document.getElementById('top-count').textContent =
        state.lines.length === 0 ? 'Aucune ligne' : `${state.lines.length} ligne${state.lines.length > 1 ? 's' : ''}`;
      document.getElementById('top-app-val').textContent =
        state.lines.length > 0 ? (Number(state.lines[0].nbApp) || 0) : 0;

      refreshGlassStatus();

      if (state.lines.length === 0) {
        container.innerHTML = `<div class="empty-box">Aucune ligne pour l'instant.<br>Appuyez sur <strong>➕ Ajout</strong> pour commencer.</div>`;
        return;
      }

      container.innerHTML = '';

      state.lines.forEach((l, idx) => {
        const pf = lineTotal(l);
        const fruitName = fruitDisplay(l, idx);

        // 1. Paquets (sans dénomination "étiquette")
        const etPack = Number(l.etPerPack) || 5000;
        const etStk = Number(l.etStkPack) || 0;
        const etNeed = pf > 0 && etPack > 0 ? Math.ceil(pf / etPack) : 0;
        let etCls = 'cons-row';
        let etMsg = `<strong>${fmt(etNeed)}</strong> ${plural(etNeed, 'paquet', 'paquets')} de ${fmt(etPack)}`;
        if (etNeed > 0) {
          const diffEt = etStk - etNeed;
          if (diffEt < 0) {
            const m = Math.abs(diffEt);
            etCls = 'cons-row err';
            etMsg += ` • Manque ${m} ${plural(m, 'paquet', 'paquets')}`;
          } else if (diffEt > 0) {
            etCls = 'cons-row ok';
            etMsg += ` • ${diffEt} ${plural(diffEt, 'paquet', 'paquets')} en trop`;
          } else {
            etCls = 'cons-row ok';
            etMsg += ` • OK (${etStk} ${plural(etStk, 'paquet', 'paquets')})`;
          }
        }

        // 2. Boîtes (sans dénomination "capsule")
        const cBox = Number(l.capPerBox) || 400;
        const cNbBox = Number(l.capNbBox) || 0;
        const cNeed = pf > 0 && cBox > 0 ? Math.ceil(pf / cBox) : 0;
        let cCls = 'cons-row';
        let cMsg = `<strong>${fmt(cNeed)}</strong> ${plural(cNeed, 'boîte', 'boîtes')} de ${fmt(cBox)}`;
        if (cNeed > 0) {
          const diffC = cNbBox - cNeed;
          if (diffC < 0) {
            const m = Math.abs(diffC);
            cCls = 'cons-row err';
            cMsg += ` • Manque ${m} ${plural(m, 'boîte', 'boîtes')}`;
          } else if (diffC > 0) {
            cCls = 'cons-row ok';
            cMsg += ` • ${diffC} ${plural(diffC, 'boîte', 'boîtes')} en trop`;
          } else {
            cCls = 'cons-row ok';
            cMsg += ` • OK (${cNbBox} ${plural(cNbBox, 'boîte', 'boîtes')})`;
          }
        }

        // 3. Palettes / format (sans dénomination "tray")
        const trFmt = Number(l.trFmt) || 12;
        const trPal = Number(l.trPerPal) || 3000;
        const trNbPal = Number(l.trNbPal) || 0;
        const trUnits = pf > 0 ? Math.ceil(pf / trFmt) : 0;
        const trNeed = trUnits > 0 && trPal > 0 ? Math.ceil(trUnits / trPal) : 0;
        let trCls = 'cons-row';
        let trMsg = `<strong>${fmt(trNeed)}</strong> ${plural(trNeed, 'palette', 'palettes')} de ${fmt(trPal)} (x${trFmt})`;
        if (trNeed > 0) {
          const diffTr = trNbPal - trNeed;
          if (diffTr < 0) {
            const m = Math.abs(diffTr);
            trCls = 'cons-row err';
            trMsg += ` • Manque ${m} ${plural(m, 'palette', 'palettes')}`;
          } else if (diffTr > 0) {
            trCls = 'cons-row ok';
            trMsg += ` • ${diffTr} ${plural(diffTr, 'palette', 'palettes')} en trop`;
          } else {
            trCls = 'cons-row ok';
            trMsg += ` • OK (${trNbPal} ${plural(trNbPal, 'palette', 'palettes')})`;
          }
        }

        const card = document.createElement('div');
        card.className = 'line-card';
        card.innerHTML = `
          <div class="line-header">
            <div class="line-identity">
              <span class="pill-fruit">🍓 ${fruitName}</span>
            </div>
            <div class="line-tools">
              <div class="mini-stepper">
                <span>App:</span>
                <button type="button" class="mini-step-btn" onclick="stepLineApps(${idx}, -1)">-</button>
                <span>${Number(l.nbApp) || 0}</span>
                <button type="button" class="mini-step-btn" onclick="stepLineApps(${idx}, 1)">+</button>
              </div>
              <button type="button" class="btn btn-del btn-mini" onclick="deleteLine(${idx})">🗑️</button>
            </div>
          </div>
          <div class="line-meta">
            ${verPerApp} × ${l.nbApp || 0} app = <strong>${fmt(pf)}</strong>
          </div>
          <div class="consumables-stack">
            <div class="${etCls}" onclick="openConsModal(${idx}, 'et')">
              <div class="cons-text">${etMsg}</div>
              <div class="cons-right-controls">
                <button type="button" class="cons-step-btn" onclick="stepConsumable(${idx}, 'et', -1, event)">-</button>
                <button type="button" class="cons-step-btn" onclick="stepConsumable(${idx}, 'et', 1, event)">+</button>
              </div>
            </div>

            <div class="${cCls}" onclick="openConsModal(${idx}, 'cap')">
              <div class="cons-text">${cMsg}</div>
              <div class="cons-right-controls">
                <button type="button" class="cons-step-btn" onclick="stepConsumable(${idx}, 'cap', -1, event)">-</button>
                <button type="button" class="cons-step-btn" onclick="stepConsumable(${idx}, 'cap', 1, event)">+</button>
              </div>
            </div>

            <div class="${trCls}" onclick="openConsModal(${idx}, 'tr')">
              <div class="cons-text">${trMsg}</div>
              <div class="cons-right-controls">
                <button type="button" class="cons-step-btn" onclick="stepConsumable(${idx}, 'tr', -1, event)">-</button>
                <button type="button" class="cons-step-btn" onclick="stepConsumable(${idx}, 'tr', 1, event)">+</button>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- MODALE AJOUT (FRUIT + NB APP) ---
    function openAddAppModal() {
      const defFruit = getDefaultFruit(state.lines.length);
      document.getElementById('add-fruit').value = defFruit;
      document.getElementById('add-fruit').placeholder = defFruit;
      document.getElementById('add-nb-app').value = 1;
      document.getElementById('add-modal').classList.add('open');
      setTimeout(() => document.getElementById('add-fruit').focus(), 50);
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.remove('open');
    }

    function stepAddApps(delta) {
      const inp = document.getElementById('add-nb-app');
      inp.value = Math.max(0, (Number(inp.value) || 0) + delta);
    }

    function confirmAddLine() {
      const defFruit = getDefaultFruit(state.lines.length);
      const typedFruit = document.getElementById('add-fruit').value.trim();
      const fruit = typedFruit || defFruit;
      const nbApp = Math.max(0, Number(document.getElementById('add-nb-app').value) || 0);
      state.lines.push(createLine(fruit, nbApp));
      saveState();
      closeAddModal();
      renderLines();
    }

    // --- MODALE CLIC SUR LIGNE ---
    function openConsModal(lineIdx, type) {
      const l = state.lines[lineIdx];
      if (!l) return;
      activeConsTarget = { lineIdx, type };

      const fmtWrap = document.getElementById('cons-fmt-wrap');
      fmtWrap.style.display = 'none';

      if (type === 'et') {
        document.getElementById('cons-title').textContent = 'Paquets';
        document.getElementById('cons-per-box-label').textContent = 'Nombre par paquet';
        document.getElementById('cons-nb-box-label').textContent = 'Nombre de paquets (0 si rien)';
        document.getElementById('cons-per-box').value = l.etPerPack || 5000;
        document.getElementById('cons-nb-box').value = l.etStkPack || 0;
      } else if (type === 'cap') {
        document.getElementById('cons-title').textContent = 'Boîtes';
        document.getElementById('cons-per-box-label').textContent = 'Nombre par boîte';
        document.getElementById('cons-nb-box-label').textContent = 'Nombre de boîtes (0 si rien)';
        document.getElementById('cons-per-box').value = l.capPerBox || 400;
        document.getElementById('cons-nb-box').value = l.capNbBox || 0;
      } else if (type === 'tr') {
        document.getElementById('cons-title').textContent = 'Palettes';
        document.getElementById('cons-per-box-label').textContent = 'Nombre par palette';
        document.getElementById('cons-nb-box-label').textContent = 'Nombre de palettes (0 si rien)';
        document.getElementById('cons-per-box').value = l.trPerPal || 3000;
        document.getElementById('cons-nb-box').value = l.trNbPal || 0;
        fmtWrap.style.display = 'block';
        const targetFmt = Number(l.trFmt) || 12;
        document.querySelectorAll('input[name="cons_fmt"]').forEach(r => {
          r.checked = Number(r.value) === targetFmt;
        });
      }

      document.getElementById('cons-modal').classList.add('open');
    }

    function closeConsModal() {
      document.getElementById('cons-modal').classList.remove('open');
      activeConsTarget = null;
    }

    function saveConsModal() {
      if (!activeConsTarget) return;
      const { lineIdx, type } = activeConsTarget;
      const l = state.lines[lineIdx];
      if (!l) return;

      const perBoxVal = Math.max(0, Number(document.getElementById('cons-per-box').value) || 0);
      const nbBoxVal = Math.max(0, Number(document.getElementById('cons-nb-box').value) || 0);

      if (type === 'et') {
        l.etPerPack = perBoxVal;
        l.etStkPack = nbBoxVal;
      } else if (type === 'cap') {
        l.capPerBox = perBoxVal;
        l.capNbBox = nbBoxVal;
      } else if (type === 'tr') {
        l.trPerPal = perBoxVal;
        l.trNbPal = nbBoxVal;
        const ch = document.querySelector('input[name="cons_fmt"]:checked');
        l.trFmt = ch ? Number(ch.value) : 12;
      }

      saveState();
      closeConsModal();
      renderLines();
    }

    function deleteLine(idx) {
      state.lines.splice(idx, 1);
      saveState();
      renderLines();
    }

    function resetAll() {
      if (confirm('Voulez-vous remettre à zéro et effacer toutes les lignes ?')) {
        const currentApp = state.verre && state.verre.verPerApp !== '' ? state.verre.verPerApp : 3500;
        state = { verre: { verPerApp: currentApp, ref: '', perPal: '', stkPal: '' }, lines: [] };
        saveState();
        bindFixedGlassInputs();
        renderLines();
      }
    }

    function printReport() {
      const area = document.getElementById('print-area');
      const now = new Date().toLocaleString('fr-FR');
      const vInfo = document.getElementById('g-ver-status').textContent;
      let cardsHtml = '';

      state.lines.forEach((l, i) => {
        const pf = lineTotal(l);
        cardsHtml += `
          <div class="p-card">
            <strong>${fruitDisplay(l, i)}</strong> (${getVerPerApp()} × ${l.nbApp || 0} app = ${fmt(pf)})<br>
            ${fmt(l.etPerPack || 5000)}/pqt (stk ${l.etStkPack || 0}) •
            ${fmt(l.capPerBox || 400)}/bte (stk ${l.capNbBox || 0}) •
            ${fmt(l.trPerPal || 3000)}/pal x${l.trFmt || 12} (stk ${l.trNbPal || 0})
          </div>
        `;
      });

      area.innerHTML = `
        <div style="display:flex; justify-content:space-between; border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:10px;">
          <div><strong>Total PF : ${fmt(grandTotal())}</strong></div>
          <div>${now}</div>
        </div>
        <div class="p-card"><strong>Verre :</strong> ${vInfo}</div>
        ${cardsHtml || '<p>Aucune ligne.</p>'}
      `;
      window.print();
    }

    loadState();
    bindFixedGlassInputs();
    renderLines();
  </script>
</body>
</html>
