<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteurs - Vue compacte</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --info-bg: #eff6ff;
      --info-border: #bfdbfe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 8px;
      width: 100%;
      max-width: 100%;
    }

    .top-bar {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .top-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    .top-total {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--primary);
    }

    /* Bande horizontale sur toute la largeur */
    .strip-wrap {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: stretch;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      width: 100%;
    }

    .comp-col {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      min-width: 225px;
      flex: 1 0 225px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .comp-head {
      font-size: 0.92rem;
      font-weight: 800;
      padding-bottom: 4px;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }

    .line-flex {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-end;
      gap: 5px;
    }

    .f-item {
      display: flex;
      flex-direction: column;
      min-width: 52px;
      flex: 1 1 52px;
    }

    .f-item.ref-item {
      min-width: 66px;
      flex: 0 0 74px;
    }

    .f-item.fmt-item {
      flex: 0 0 auto;
    }

    .f-item label {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 2px;
      white-space: nowrap;
    }

    .ref-row {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .f-item input[type="number"],
    .f-item input[type="text"] {
      padding: 5px 6px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font-size: 0.9rem;
      width: 100%;
    }

    .abc-btn {
      padding: 5px 5px;
      border-radius: 5px;
      border: 1px solid #94a3b8;
      background: #e2e8f0;
      color: #0f172a;
      font-size: 0.65rem;
      font-weight: 800;
      cursor: pointer;
      line-height: 1;
      flex: 0 0 auto;
    }

    .abc-btn.active-abc {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .fmt-pills {
      display: flex;
      gap: 4px;
    }

    .fmt-pill {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border: 1px solid #94a3b8;
      background: #f8fafc;
      padding: 4px 6px;
      border-radius: 5px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .fmt-pill input {
      margin: 0;
    }

    .fmt-pill input:checked + span {
      color: var(--primary);
    }

    .need-bar {
      padding: 6px 8px;
      border-radius: 6px;
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .need-bar.err {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .need-bar.ok {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    /* Zone Groupes en dessous */
    .groups-zone {
      margin-top: 10px;
      width: 100%;
    }

    .groups-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .groups-title {
      font-size: 0.95rem;
      font-weight: 800;
    }

    .grp-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px;
    }

    .grp-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .grp-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .grp-name {
      padding: 5px 8px;
      border: 1px solid #94a3b8;
      border-radius: 5px;
      font-size: 0.88rem;
      font-weight: 700;
      width: 120px;
    }

    .grp-tot {
      font-size: 0.85rem;
      font-weight: 800;
      background: #f1f5f9;
      border: 1px solid var(--border);
      padding: 5px 8px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .grp-pool {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 5px;
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      margin-bottom: 6px;
    }

    .grp-pool.err {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .grp-pool.ok {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    .row-line {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-end;
      gap: 6px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 5px;
    }

    .sub-badge {
      font-size: 0.85rem;
      font-weight: 800;
      padding: 5px 8px;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      white-space: nowrap;
    }

    button.act-btn {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn-add { background: var(--success); color: #fff; }
    .btn-del { background: #fee2e2; color: var(--danger); padding: 5px 8px; }
    .btn-pdf { background: var(--primary); color: #fff; padding: 8px 14px; }
    .btn-rst { background: var(--danger); color: #fff; padding: 8px 14px; }

    .bottom-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 12px;
      margin-bottom: 12px;
    }

    #print-report { display: none; }

    @media print {
      body { background: #fff; padding: 0; }
      .top-bar, .strip-wrap, .groups-zone, .bottom-actions { display: none !important; }
      #print-report { display: block !important; }
      .p-sec { border: 1px solid #bbb; border-radius: 6px; padding: 8px; margin-bottom: 10px; page-break-inside: avoid; }
      .p-tbl { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 4px; }
      .p-tbl th, .p-tbl td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; }
      .p-err { color: #dc2626 !important; font-weight: bold; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .p-ok { color: #16a34a !important; font-weight: bold; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-title">Total ✅ PF</div>
    <div class="top-total" id="top-total">0</div>
  </div>

  <!-- 🏷️ Ét. | 🔘 Cap. | 📦 Trays | 🫙 Verre SUR UNE MÊME LIGNE -->
  <div class="strip-wrap" id="comp-strip"></div>

  <!-- GROUPES EN DESSOUS (PUISENT DANS 🫙 VERRE RENSEIGNÉ UNE SEULE FOIS) -->
  <div class="groups-zone">
    <div class="groups-header">
      <div class="groups-title">✅ PF par groupe</div>
      <button class="act-btn btn-add" onclick="addGroup()">+ Groupe</button>
    </div>
    <div id="groups-container"></div>
  </div>

  <div class="bottom-actions">
    <button class="act-btn btn-pdf" onclick="printSummary()">🖨️ PDF</button>
    <button class="act-btn btn-rst" onclick="resetAll()">🔄 Reset</button>
  </div>

  <div id="print-report"></div>

  <script>
    const KEY = 'compteurs_verre_iphone_v1';

    let state = {
      groups: [],
      components: {
        etiquettes: { ref: '', perPack: '', stockPacks: '' },
        capsules:   { ref: '', perBox: '', boxesPerPallet: '', stockPallets: '' },
        trays:      { ref: '', perPallet: '', packSize: 6, stockPallets: '' },
        verre:      { ref: '', perPallet: '', stockPallets: '' }
      }
    };

    function defGroup(idx) {
      return {
        id: 'g_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
        name: `Fruit ${idx + 1}`,
        rows: [{ nbApp: '', nbPerApp: '' }]
      };
    }

    function defState() {
      return {
        groups: [defGroup(0)],
        components: {
          etiquettes: { ref: '', perPack: '', stockPacks: '' },
          capsules:   { ref: '', perBox: '', boxesPerPallet: '', stockPallets: '' },
          trays:      { ref: '', perPallet: '', packSize: 6, stockPallets: '' },
          verre:      { ref: '', perPallet: '', stockPallets: '' }
        }
      };
    }

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const p = JSON.parse(raw);
          state = Object.assign(defState(), p);
          state.components = Object.assign(defState().components, p.components || {});
          if (!Array.isArray(state.groups) || !state.groups.length) state.groups = [defGroup(0)];
          return;
        }
      } catch (e) {}
      state = defState();
    }

    function save() {
      localStorage.setItem(KEY, JSON.stringify(state));
    }

    function fmt(n) {
      return Math.ceil(Number(n) || 0).toLocaleString('fr-FR');
    }

    function rowPF(r) {
      return (Number(r.nbApp) || 0) * (Number(r.nbPerApp) || 0);
    }

    function grpPF(g) {
      return (g.rows || []).reduce((s, r) => s + rowPF(r), 0);
    }

    function totPF() {
      return state.groups.reduce((s, g) => s + grpPF(g), 0);
    }

    function gName(g, i) {
      const t = (g.name || '').trim();
      return t ? t : `Fruit ${i + 1}`;
    }

    function getVerreTotalStock() {
      const v = state.components.verre;
      return (Number(v.perPallet) || 0) * (Number(v.stockPallets) || 0);
    }

    function calcNeed(key, pf) {
      const c = state.components[key];
      const tag = (c.ref || '').trim() ? ` [${(c.ref || '').trim()}]` : '';

      if (key === 'etiquettes') {
        const perP = Number(c.perPack) || 0;
        const stkP = Number(c.stockPacks) || 0;
        const stkU = stkP * perP;
        const needP = perP > 0 ? Math.ceil(pf / perP) : 0;
        const missU = Math.max(0, pf - stkU);
        const missP = perP > 0 ? Math.max(0, needP - stkP) : 0;
        return {
          txt: `Besoin${tag}: ${fmt(pf)} ét.` + (perP > 0 ? ` (${fmt(needP)} pqt)` : ''),
          hasStk: stkP > 0,
          missU,
          missTxt: `Manque: ${fmt(missU)} ét.` + (perP > 0 ? ` (${fmt(missP)} pqt)` : ''),
          okTxt: `OK (+${fmt(stkU - pf)} ét.)`
        };
      }

      if (key === 'capsules') {
        const perB = Number(c.perBox) || 0;
        const btePal = Number(c.boxesPerPallet) || 0;
        const perPal = perB * btePal;
        const stkPal = Number(c.stockPallets) || 0;
        const stkU = stkPal * perPal;
        const needB = perB > 0 ? Math.ceil(pf / perB) : 0;
        const needPal = perPal > 0 ? Math.ceil(pf / perPal) : 0;
        const missU = Math.max(0, pf - stkU);
        const missPal = perPal > 0 ? Math.max(0, needPal - stkPal) : 0;
        return {
          txt: `Besoin${tag}: ${fmt(pf)} cap.` + (perB > 0 ? ` / ${fmt(needB)} bte` : '') + (perPal > 0 ? ` / ${fmt(needPal)} pal` : ''),
          hasStk: stkPal > 0,
          missU,
          missTxt: `Manque: ${fmt(missU)} cap.` + (perPal > 0 ? ` (${fmt(missPal)} pal)` : ''),
          okTxt: `OK (+${fmt(stkU - pf)} cap.)`
        };
      }

      if (key === 'trays') {
        const perPal = Number(c.perPallet) || 0;
        const fmtN = Number(c.packSize) || 6;
        const stkPal = Number(c.stockPallets) || 0;
        const needTr = pf > 0 ? Math.ceil(pf / fmtN) : 0;
        const needPal = perPal > 0 ? Math.ceil(needTr / perPal) : 0;
        const stkTr = stkPal * perPal;
        const missTr = Math.max(0, needTr - stkTr);
        const missPal = perPal > 0 ? Math.max(0, needPal - stkPal) : 0;
        return {
          txt: `Besoin${tag} (x${fmtN}): ${fmt(needTr)} tr.` + (perPal > 0 ? ` / ${fmt(needPal)} pal` : ''),
          hasStk: stkPal > 0,
          missU: missTr,
          missTxt: `Manque: ${fmt(missTr)} tr.` + (perPal > 0 ? ` (${fmt(missPal)} pal)` : ''),
          okTxt: `OK (+${fmt(stkTr - needTr)} tr.)`
        };
      }

      // verre (renseigné une seule fois, puisé par les groupes)
      const perPal = Number(c.perPallet) || 0;
      const stkPal = Number(c.stockPallets) || 0;
      const stkU = stkPal * perPal;
      const needPal = perPal > 0 ? Math.ceil(pf / perPal) : 0;
      const missU = Math.max(0, pf - stkU);
      const missPal = perPal > 0 ? Math.max(0, needPal - stkPal) : 0;
      return {
        txt: `Puisé${tag}: ${fmt(pf)} ver.` + (perPal > 0 ? ` (${fmt(needPal)} pal)` : '') + (stkU > 0 ? ` / Stk: ${fmt(stkU)}` : ''),
        hasStk: stkPal > 0,
        missU,
        missTxt: `Manque: ${fmt(missU)} ver.` + (perPal > 0 ? ` (${fmt(missPal)} pal)` : ''),
        okTxt: `Reste: ${fmt(stkU - pf)} ver.`
      };
    }

    function refresh() {
      const pf = totPF();
      document.getElementById('top-total').textContent = fmt(pf);

      ['etiquettes', 'capsules', 'trays', 'verre'].forEach(k => {
        const el = document.getElementById(`nd_${k}`);
        if (!el) return;
        const info = calcNeed(k, pf);
        el.className = 'need-bar';
        if (info.hasStk) {
          if (info.missU > 0) {
            el.classList.add('err');
            el.textContent = `${info.txt} • ${info.missTxt}`;
          } else {
            el.classList.add('ok');
            el.textContent = `${info.txt} • ${info.okTxt}`;
          }
        } else {
          el.textContent = info.txt;
        }
      });

      // Calcul cumulé puisé dans le Verre par ordre des groupes
      const verreTotal = getVerreTotalStock();
      const verreRef = (state.components.verre.ref || '').trim();
      let cumulPF = 0;

      state.groups.forEach((g, gi) => {
        const gVal = grpPF(g);
        cumulPF += gVal;

        const ge = document.getElementById(`gt_${gi}`);
        if (ge) ge.textContent = `= ${fmt(gVal)}`;

        g.rows.forEach((r, ri) => {
          const re = document.getElementById(`rs_${gi}_${ri}`);
          if (re) re.textContent = `= ${fmt(rowPF(r))}`;
        });

        const pe = document.getElementById(`gp_${gi}`);
        if (pe) {
          const tag = verreRef ? ` [${verreRef}]` : '';
          if (verreTotal > 0) {
            const resteApresGroupe = verreTotal - cumulPF;
            if (resteApresGroupe < 0) {
              const manqueIci = Math.min(gVal, Math.abs(resteApresGroupe));
              pe.className = 'grp-pool err';
              pe.textContent = `🫙 Verre${tag}: puise ${fmt(gVal)} (cumul ${fmt(cumulPF)} / ${fmt(verreTotal)}) — Manque ${fmt(manqueIci)} sur ce groupe !`;
            } else {
              pe.className = 'grp-pool ok';
              pe.textContent = `🫙 Verre${tag}: puise ${fmt(gVal)} (cumul ${fmt(cumulPF)} / ${fmt(verreTotal)}) — Reste ${fmt(resteApresGroupe)}`;
            }
          } else {
            pe.className = 'grp-pool';
            pe.textContent = `🫙 Verre${tag}: puise ${fmt(gVal)} (cumul ${fmt(cumulPF)})`;
          }
        }
      });
    }

    // Clavier numérique par défaut sur iPhone
    function numField(lbl, val, fn) {
      const d = document.createElement('div');
      d.className = 'f-item';
      const l = document.createElement('label');
      l.textContent = lbl;
      const i = document.createElement('input');
      i.type = 'number';
      i.inputMode = 'numeric';
      i.pattern = '[0-9]*';
      i.min = '0';
      i.step = 'any';
      i.placeholder = '0';
      i.value = val;
      i.oninput = (e) => { fn(e.target.value); save(); refresh(); };
      d.appendChild(l);
      d.appendChild(i);
      return d;
    }

    // Clavier numérique par défaut + petit bouton ABC pour passer en mode lettres
    function refField(lbl, val, fn) {
      const d = document.createElement('div');
      d.className = 'f-item ref-item';
      const l = document.createElement('label');
      l.textContent = lbl;

      const wrap = document.createElement('div');
      wrap.className = 'ref-row';

      const i = document.createElement('input');
      i.type = 'text';
      i.inputMode = 'numeric';
      i.placeholder = lbl.replace('Réf ', '');
      i.value = val;
      i.oninput = (e) => { fn(e.target.value); save(); refresh(); };

      const abc = document.createElement('button');
      abc.type = 'button';
      abc.className = 'abc-btn';
      abc.textContent = 'ABC';
      abc.title = 'Basculer clavier lettres / chiffres';
      abc.onclick = () => {
        const isTextMode = abc.classList.toggle('active-abc');
        i.inputMode = isTextMode ? 'text' : 'numeric';
        i.focus();
      };

      wrap.appendChild(i);
      wrap.appendChild(abc);
      d.appendChild(l);
      d.appendChild(wrap);
      return d;
    }

    function render() {
      const strip = document.getElementById('comp-strip');
      strip.innerHTML = '';

      // Ordre : Ét. | Cap. | Trays | Verre (sans 5,3,2,4,1)
      strip.appendChild(makeCol('etiquettes', '🏷️ Ét.',   'Réf eti'));
      strip.appendChild(makeCol('capsules',   '🔘 Cap.',  'Réf CRC'));
      strip.appendChild(makeCol('trays',      '📦 Trays', 'Réf cct'));
      strip.appendChild(makeCol('verre',      '🫙 Verre', 'Réf V'));

      renderGroups();
      refresh();
    }

    function makeCol(key, title, refLbl) {
      const c = state.components[key];
      const col = document.createElement('div');
      col.className = 'comp-col';

      const head = document.createElement('div');
      head.className = 'comp-head';
      head.textContent = title;
      col.appendChild(head);

      const line = document.createElement('div');
      line.className = 'line-flex';
      line.appendChild(refField(refLbl, c.ref, (v) => { state.components[key].ref = v; }));

      if (key === 'etiquettes') {
        line.appendChild(numField('Ét/pqt', c.perPack, (v) => { state.components.etiquettes.perPack = v; }));
        line.appendChild(numField('Stk', c.stockPacks, (v) => { state.components.etiquettes.stockPacks = v; }));
      } else if (key === 'capsules') {
        line.appendChild(numField('Cap/bte', c.perBox, (v) => { state.components.capsules.perBox = v; }));
        line.appendChild(numField('Bte/pal', c.boxesPerPallet, (v) => { state.components.capsules.boxesPerPallet = v; }));
        line.appendChild(numField('Stk pal', c.stockPallets, (v) => { state.components.capsules.stockPallets = v; }));
      } else if (key === 'trays') {
        line.appendChild(numField('Tr/pal', c.perPallet, (v) => { state.components.trays.perPallet = v; }));

        const fd = document.createElement('div');
        fd.className = 'f-item fmt-item';
        const fl = document.createElement('label');
        fl.textContent = 'Fmt';
        fd.appendChild(fl);

        const fp = document.createElement('div');
        fp.className = 'fmt-pills';
        [6, 8, 12].forEach(o => {
          const lb = document.createElement('label');
          lb.className = 'fmt-pill';
          const rd = document.createElement('input');
          rd.type = 'radio';
          rd.name = 'tray_fmt_rad';
          rd.value = o;
          rd.checked = Number(c.packSize) === o;
          rd.onchange = () => { state.components.trays.packSize = o; save(); refresh(); };
          const sp = document.createElement('span');
          sp.textContent = o;
          lb.appendChild(rd);
          lb.appendChild(sp);
          fp.appendChild(lb);
        });
        fd.appendChild(fp);
        line.appendChild(fd);

        line.appendChild(numField('Stk pal', c.stockPallets, (v) => { state.components.trays.stockPallets = v; }));
      } else {
        // Verre : renseigné une seule fois, puisé par les groupes
        line.appendChild(numField('Ver/pal', c.perPallet, (v) => { state.components.verre.perPallet = v; }));
        line.appendChild(numField('Stk pal', c.stockPallets, (v) => { state.components.verre.stockPallets = v; }));
      }

      col.appendChild(line);

      const nd = document.createElement('div');
      nd.className = 'need-bar';
      nd.id = `nd_${key}`;
      col.appendChild(nd);

      return col;
    }

    function renderGroups() {
      const container = document.getElementById('groups-container');
      container.innerHTML = '';

      state.groups.forEach((g, gi) => {
        const card = document.createElement('div');
        card.className = 'grp-card';

        const top = document.createElement('div');
        top.className = 'grp-top';

        const left = document.createElement('div');
        left.className = 'grp-left';

        const ni = document.createElement('input');
        ni.type = 'text';
        ni.inputMode = 'text';
        ni.className = 'grp-name';
        ni.placeholder = `Fruit ${gi + 1}`;
        ni.value = g.name;
        ni.oninput = (e) => { state.groups[gi].name = e.target.value; save(); refresh(); };

        const totB = document.createElement('span');
        totB.className = 'grp-tot';
        totB.id = `gt_${gi}`;
        totB.textContent = `= ${fmt(grpPF(g))}`;

        left.appendChild(ni);
        left.appendChild(totB);
        top.appendChild(left);

        const btns = document.createElement('div');
        btns.style.display = 'flex';
        btns.style.gap = '6px';

        const addR = document.createElement('button');
        addR.type = 'button';
        addR.className = 'act-btn btn-add';
        addR.textContent = '+ Ligne';
        addR.onclick = () => { state.groups[gi].rows.push({ nbApp: '', nbPerApp: '' }); save(); renderGroups(); refresh(); };
        btns.appendChild(addR);

        if (state.groups.length > 1) {
          const delG = document.createElement('button');
          delG.type = 'button';
          delG.className = 'act-btn btn-del';
          delG.textContent = '×';
          delG.onclick = () => { state.groups.splice(gi, 1); save(); renderGroups(); refresh(); };
          btns.appendChild(delG);
        }

        top.appendChild(btns);
        card.appendChild(top);

        const pool = document.createElement('div');
        pool.className = 'grp-pool';
        pool.id = `gp_${gi}`;
        card.appendChild(pool);

        g.rows.forEach((r, ri) => {
          const line = document.createElement('div');
          line.className = 'row-line';

          line.appendChild(numField('App', r.nbApp, (v) => { state.groups[gi].rows[ri].nbApp = v; }));
          line.appendChild(numField('Nb/app', r.nbPerApp, (v) => { state.groups[gi].rows[ri].nbPerApp = v; }));

          const sb = document.createElement('span');
          sb.className = 'sub-badge';
          sb.id = `rs_${gi}_${ri}`;
          sb.textContent = `= ${fmt(rowPF(r))}`;
          line.appendChild(sb);

          if (g.rows.length > 1) {
            const delR = document.createElement('button');
            delR.type = 'button';
            delR.className = 'act-btn btn-del';
            delR.textContent = '×';
            delR.onclick = () => { state.groups[gi].rows.splice(ri, 1); save(); renderGroups(); refresh(); };
            line.appendChild(delR);
          }

          card.appendChild(line);
        });

        container.appendChild(card);
      });
    }

    function addGroup() {
      state.groups.push(defGroup(state.groups.length));
      save();
      renderGroups();
      refresh();
    }

    function resetAll() {
      if (confirm('Reset à zéro ?')) {
        state = defState();
        save();
        render();
      }
    }

    function printSummary() {
      const rep = document.getElementById('print-report');
      const now = new Date().toLocaleString('fr-FR');
      const pf = totPF();

      let rowsHtml = '';
      state.groups.forEach((g, gi) => {
        const gn = gName(g, gi);
        g.rows.forEach((r, ri) => {
          rowsHtml += `<tr><td>${gn}</td><td>L${ri + 1}</td><td>${r.nbApp || 0}</td><td>${r.nbPerApp || 0}</td><td><strong>${fmt(rowPF(r))}</strong></td></tr>`;
        });
        rowsHtml += `<tr><td colspan="4"><strong>Total ${gn}</strong></td><td><strong>${fmt(grpPF(g))}</strong></td></tr>`;
      });

      const list = [
        { k: 'etiquettes', t: '🏷️ Ét. (eti)' },
        { k: 'capsules',   t: '🔘 Cap. (CRC)' },
        { k: 'trays',      t: '📦 Trays (cct)' },
        { k: 'verre',      t: '🫙 Verre (V)' }
      ];

      let cHtml = '';
      list.forEach(item => {
        const c = state.components[item.k];
        const info = calcNeed(item.k, pf);
        const extra = info.hasStk
          ? `<div class="${info.missU > 0 ? 'p-err' : 'p-ok'}">${info.missU > 0 ? info.missTxt : info.okTxt}</div>`
          : '';
        cHtml += `<div class="p-sec"><strong>${item.t}</strong> — Réf: <em>${c.ref || '-'}</em><br>${info.txt}${extra}</div>`;
      });

      rep.innerHTML = `
        <div style="display:flex; justify-content:space-between; border-bottom:2px solid #000; padding-bottom:6px; margin-bottom:10px;">
          <strong>Total ✅ PF: ${fmt(pf)}</strong>
          <span>${now}</span>
        </div>
        <div class="p-sec">
          <strong>✅ PF par groupe</strong>
          <table class="p-tbl">
            <thead><tr><th>Groupe</th><th>Ligne</th><th>App</th><th>Nb/app</th><th>Total</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
        ${cHtml}
      `;
      window.print();
    }

    load();
    render();
  </script>
</body>
</html>
