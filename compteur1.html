<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteurs - Mode Ligne & Start</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --info-bg: #eff6ff;
      --info-border: #bfdbfe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 8px;
      width: 100%;
    }

    .top-bar {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .top-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    .top-total {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--primary);
    }

    .empty-hint {
      background: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 18px 12px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .line-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px;
    }

    .line-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid #e2e8f0;
    }

    .line-badge {
      font-size: 0.82rem;
      font-weight: 800;
      background: #e2e8f0;
      padding: 3px 8px;
      border-radius: 5px;
    }

    .fruit-tag {
      font-size: 0.82rem;
      font-weight: 800;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      padding: 3px 8px;
      border-radius: 5px;
    }

    .sub-badge {
      font-size: 0.88rem;
      font-weight: 900;
      padding: 3px 8px;
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
      border-radius: 5px;
    }

    .one-row {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: flex-end;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .f-box {
      display: flex;
      flex-direction: column;
      min-width: 56px;
      flex: 1 1 56px;
    }

    .f-box.fruit-box {
      min-width: 82px;
      flex: 0 0 92px;
    }

    .f-box.ref-box {
      min-width: 72px;
      flex: 0 0 80px;
    }

    .f-box.fmt-box {
      flex: 0 0 auto;
    }

    .f-box label {
      font-size: 0.64rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 2px;
      white-space: nowrap;
    }

    .ref-wrap {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .f-box input[type="number"],
    .f-box input[type="text"] {
      padding: 5px 6px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font-size: 0.88rem;
      width: 100%;
      background: #fff;
    }

    .abc-btn {
      padding: 5px 5px;
      border-radius: 5px;
      border: 1px solid #94a3b8;
      background: #e2e8f0;
      color: #0f172a;
      font-size: 0.62rem;
      font-weight: 800;
      cursor: pointer;
      line-height: 1;
      flex: 0 0 auto;
    }

    .abc-btn.active-abc {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .fmt-pills {
      display: flex;
      gap: 3px;
    }

    .fmt-pill {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border: 1px solid #94a3b8;
      background: #f8fafc;
      padding: 4px 5px;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .fmt-pill input {
      margin: 0;
    }

    .fmt-pill input:checked + span {
      color: var(--primary);
    }

    .needs-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .need-chip {
      padding: 4px 8px;
      border-radius: 5px;
      background: var(--info-bg);
      border: 1px solid var(--info-border);
    }

    .need-chip.err {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .need-chip.ok {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 14px 0;
    }

    button.act-btn {
      padding: 8px 14px;
      border-radius: 7px;
      border: none;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .btn-start { background: var(--success); color: #fff; }
    .btn-start:hover { background: #15803d; }
    .btn-reset { background: var(--danger); color: #fff; }
    .btn-reset:hover { background: #b91c1c; }
    .btn-pdf   { background: var(--primary); color: #fff; }
    .btn-pdf:hover { background: var(--primary-hover); }
    .btn-sec   { background: #e2e8f0; color: var(--text); }
    .btn-del   { background: #fee2e2; color: var(--danger); padding: 4px 8px; font-size: 0.78rem; }

    /* Modale Start pas-à-pas */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 900;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #e2e8f0;
    }

    .step-pane {
      display: none;
    }

    .step-pane.active {
      display: block;
    }

    .step-q {
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .modal-btns {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 14px;
    }

    #print-report { display: none; }

    @media print {
      body { background: #fff; padding: 0; }
      .top-bar, #lines-wrap, .actions-bar, .modal-backdrop { display: none !important; }
      #print-report { display: block !important; }
      .p-box { border: 1px solid #bbb; border-radius: 6px; padding: 8px; margin-bottom: 10px; page-break-inside: avoid; }
      .p-tbl { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 4px; }
      .p-tbl th, .p-tbl td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-title">Total ✅ PF</div>
    <div class="top-total" id="top-total">0</div>
  </div>

  <!-- VIDE AU DÉPART ET APRÈS RESET -->
  <div id="lines-wrap"></div>

  <!-- BOUTONS START À CÔTÉ DE RESET (+ PDF) -->
  <div class="actions-bar">
    <button type="button" class="act-btn btn-start" onclick="startWizard()">▶️ Start</button>
    <button type="button" class="act-btn btn-reset" onclick="resetAll()">🔄 Reset</button>
    <button type="button" class="act-btn btn-pdf" onclick="printSummary()">🖨️ PDF</button>
  </div>

  <!-- ASSISTANT START PAS À PAS -->
  <div class="modal-backdrop" id="start-modal">
    <div class="modal-card">
      <div class="modal-title" id="st-title">▶️ Nouvelle ligne</div>

      <!-- 0. QUESTION DU FRUIT (PAR DÉFAUT FRUIT 1) -->
      <div class="step-pane" id="st-0">
        <div class="step-q">Quel est le fruit ?</div>
        <div class="f-box">
          <label>Fruit</label>
          <input type="text" inputmode="text" id="st-fruit" placeholder="Fruit 1">
        </div>
        <div class="modal-btns">
          <button type="button" class="act-btn btn-sec" onclick="closeStart()">Annuler</button>
          <button type="button" class="act-btn btn-start" onclick="goSt1()">Suivant ➔</button>
        </div>
      </div>

      <!-- 1. NB VERRE PAR APP -->
      <div class="step-pane" id="st-1">
        <div class="step-q">1. Combien de verre par appareil ?</div>
        <div class="f-box">
          <label>Verre / app</label>
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="st-ver-app" placeholder="0">
        </div>
        <div class="modal-btns">
          <button type="button" class="act-btn btn-sec" onclick="closeStart()">Annuler</button>
          <button type="button" class="act-btn btn-start" onclick="goSt2()">Suivant ➔</button>
        </div>
      </div>

      <!-- 2. NB APP (PAR DÉFAUT 1) -->
      <div class="step-pane" id="st-2">
        <div class="step-q">2. Combien d'app ?</div>
        <div class="f-box">
          <label>Nb app</label>
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="st-nb-app" placeholder="1">
        </div>
        <div class="modal-btns">
          <button type="button" class="act-btn btn-sec" onclick="closeStart()">Annuler</button>
          <button type="button" class="act-btn btn-start" onclick="goSt3()">Suivant ➔</button>
        </div>
      </div>

      <!-- 3. CAPSULE (PAR DÉFAUT 400 PAR BOÎTE ET 1 BOÎTE) -->
      <div class="step-pane" id="st-3">
        <div class="step-q">3. Capsule : même capsule ou nouveau (400 / boîte, 1 boîte) ?</div>
        <div id="st-cap-prev" style="font-size:0.78rem; color:var(--text-muted); margin-bottom:8px;"></div>
        <div id="st-cap-form" style="display:none;">
          <div class="one-row">
            <div class="f-box ref-box">
              <label>Réf CRC</label>
              <div class="ref-wrap">
                <input type="text" inputmode="numeric" id="st-cap-ref" placeholder="CRC">
                <button type="button" class="abc-btn" onclick="toggleAbc('st-cap-ref', this)">ABC</button>
              </div>
            </div>
            <div class="f-box">
              <label>Cap / boîte</label>
              <input type="number" inputmode="numeric" pattern="[0-9]*" id="st-cap-box" value="400">
            </div>
            <div class="f-box">
              <label>Nb boîtes</label>
              <input type="number" inputmode="numeric" pattern="[0-9]*" id="st-cap-pal" value="1">
            </div>
          </div>
        </div>
        <div class="modal-btns" id="st-cap-choice">
          <button type="button" class="act-btn btn-start" onclick="chooseCap(true)">Même capsule</button>
          <button type="button" class="act-btn btn-pdf" onclick="chooseCap(false)">Nouveau</button>
        </div>
        <div class="modal-btns" id="st-cap-next" style="display:none;">
          <button type="button" class="act-btn btn-start" onclick="saveCapAndGoSt4()">Suivant ➔</button>
        </div>
      </div>

      <!-- 4. TRAY (PAR DÉFAUT 12, 1 PALETTE ET 3000 PAR PALETTE) -->
      <div class="step-pane" id="st-4">
        <div class="step-q">4. Tray : même tray ou nouveau (3000 / pal, 1 pal, format 12) ?</div>
        <div id="st-tray-prev" style="font-size:0.78rem; color:var(--text-muted); margin-bottom:8px;"></div>
        <div id="st-tray-form" style="display:none;">
          <div class="one-row">
            <div class="f-box ref-box">
              <label>Réf cct</label>
              <div class="ref-wrap">
                <input type="text" inputmode="numeric" id="st-tray-ref" placeholder="cct">
                <button type="button" class="abc-btn" onclick="toggleAbc('st-tray-ref', this)">ABC</button>
              </div>
            </div>
            <div class="f-box">
              <label>Tray / pal</label>
              <input type="number" inputmode="numeric" pattern="[0-9]*" id="st-tray-pal" value="3000">
            </div>
            <div class="f-box">
              <label>Nb pal</label>
              <input type="number" inputmode="numeric" pattern="[0-9]*" id="st-tray-stk" value="1">
            </div>
            <div class="f-box fmt-box">
              <label>Fmt</label>
              <div class="fmt-pills">
                <label class="fmt-pill"><input type="radio" name="st_tray_fmt" value="6"><span>6</span></label>
                <label class="fmt-pill"><input type="radio" name="st_tray_fmt" value="8"><span>8</span></label>
                <label class="fmt-pill"><input type="radio" name="st_tray_fmt" value="12" checked><span>12</span></label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-btns" id="st-tray-choice">
          <button type="button" class="act-btn btn-start" onclick="chooseTray(true)">Même tray</button>
          <button type="button" class="act-btn btn-pdf" onclick="chooseTray(false)">Nouveau</button>
        </div>
        <div class="modal-btns" id="st-tray-finish" style="display:none;">
          <button type="button" class="act-btn btn-start" onclick="saveTrayAndFinish()">Valider ✓</button>
        </div>
      </div>
    </div>
  </div>

  <div id="print-report"></div>

  <script>
    const KEY = 'compteurs_start_vide_v1';

    let state = {
      lines: []
    };

    let draft = null;

    function getDefaultFruitName(index) {
      return `Fruit ${index + 1}`;
    }

    function defLine(index = 0) {
      return {
        fruit: getDefaultFruitName(index),
        verPerApp: '',
        nbApp: 1,
        verRef: '',
        verPerPal: '',
        verStkPal: '',
        etRef: '',
        etPerPack: 5000,
        etStkPqt: '',
        cap: { ref: '', perBox: 400, boxesPerPal: 1, stkPal: '' },
        tray: { ref: '', perPal: 3000, packSize: 12, stkPal: 1 }
      };
    }

    function defState() {
      return { lines: [] };
    }

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const p = JSON.parse(raw);
          if (Array.isArray(p.lines)) {
            state = p;
            state.lines.forEach((l, i) => {
              if (!l.fruit || !String(l.fruit).trim()) {
                l.fruit = getDefaultFruitName(i);
              }
            });
            return;
          }
        }
      } catch (e) {}
      state = defState();
    }

    function save() {
      localStorage.setItem(KEY, JSON.stringify(state));
    }

    function fmt(n) {
      return Math.ceil(Number(n) || 0).toLocaleString('fr-FR');
    }

    function linePF(l) {
      return (Number(l.verPerApp) || 0) * (Number(l.nbApp) || 0);
    }

    function totPF() {
      return state.lines.reduce((s, l) => s + linePF(l), 0);
    }

    function displayFruit(l, idx) {
      const f = (l.fruit || '').trim();
      return f ? f : getDefaultFruitName(idx);
    }

    function toggleAbc(id, btn) {
      const inp = document.getElementById(id);
      if (!inp) return;
      const isText = btn.classList.toggle('active-abc');
      inp.inputMode = isText ? 'text' : 'numeric';
      inp.focus();
    }

    function numInp(lbl, val, fn) {
      const d = document.createElement('div');
      d.className = 'f-box';
      const l = document.createElement('label');
      l.textContent = lbl;
      const i = document.createElement('input');
      i.type = 'number';
      i.inputMode = 'numeric';
      i.pattern = '[0-9]*';
      i.min = '0';
      i.step = 'any';
      i.placeholder = '0';
      i.value = val;
      i.oninput = (e) => { fn(e.target.value); save(); refresh(); };
      d.appendChild(l);
      d.appendChild(i);
      return d;
    }

    function textInp(lbl, val, ph, fn, extraClass = '') {
      const d = document.createElement('div');
      d.className = `f-box ${extraClass}`.trim();
      const l = document.createElement('label');
      l.textContent = lbl;
      const i = document.createElement('input');
      i.type = 'text';
      i.inputMode = 'text';
      i.placeholder = ph;
      i.value = val;
      i.oninput = (e) => { fn(e.target.value); save(); refresh(); };
      d.appendChild(l);
      d.appendChild(i);
      return d;
    }

    function refInp(lbl, val, fn) {
      const d = document.createElement('div');
      d.className = 'f-box ref-box';
      const l = document.createElement('label');
      l.textContent = lbl;
      const w = document.createElement('div');
      w.className = 'ref-wrap';
      const i = document.createElement('input');
      i.type = 'text';
      i.inputMode = 'numeric';
      i.placeholder = lbl.replace('Réf ', '');
      i.value = val;
      i.oninput = (e) => { fn(e.target.value); save(); refresh(); };
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'abc-btn';
      b.textContent = 'ABC';
      b.onclick = () => {
        const isText = b.classList.toggle('active-abc');
        i.inputMode = isText ? 'text' : 'numeric';
        i.focus();
      };
      w.appendChild(i);
      w.appendChild(b);
      d.appendChild(l);
      d.appendChild(w);
      return d;
    }

    function renderLines() {
      const wrap = document.getElementById('lines-wrap');
      wrap.innerHTML = '';

      if (!state.lines.length) {
        wrap.innerHTML = `<div class="empty-hint">Aucune ligne. Appuyez sur <strong>▶️ Start</strong> pour commencer.</div>`;
        return;
      }

      state.lines.forEach((l, idx) => {
        const card = document.createElement('div');
        card.className = 'line-card';

        const head = document.createElement('div');
        head.className = 'line-head';

        const left = document.createElement('div');
        left.style.display = 'flex';
        left.style.alignItems = 'center';
        left.style.gap = '6px';
        left.style.flexWrap = 'wrap';

        const bdg = document.createElement('span');
        bdg.className = 'line-badge';
        bdg.textContent = `Ligne ${idx + 1}`;

        const fTag = document.createElement('span');
        fTag.className = 'fruit-tag';
        fTag.id = `ftag_${idx}`;
        fTag.textContent = `🍓 ${displayFruit(l, idx)}`;

        const sub = document.createElement('span');
        sub.className = 'sub-badge';
        sub.id = `sub_${idx}`;
        sub.textContent = `= ${fmt(linePF(l))}`;

        left.appendChild(bdg);
        left.appendChild(fTag);
        left.appendChild(sub);
        head.appendChild(left);

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'act-btn btn-del';
        del.textContent = '×';
        del.onclick = () => { state.lines.splice(idx, 1); save(); renderLines(); refresh(); };
        head.appendChild(del);
        card.appendChild(head);

        const row = document.createElement('div');
        row.className = 'one-row';

        row.appendChild(textInp('Fruit', l.fruit, getDefaultFruitName(idx), (v) => { state.lines[idx].fruit = v; }, 'fruit-box'));
        row.appendChild(numInp('Ver/app', l.verPerApp, (v) => { state.lines[idx].verPerApp = v; }));
        row.appendChild(numInp('App', l.nbApp, (v) => { state.lines[idx].nbApp = v; }));

        row.appendChild(refInp('Réf V', l.verRef, (v) => { state.lines[idx].verRef = v; }));
        row.appendChild(numInp('Ver/pal', l.verPerPal, (v) => { state.lines[idx].verPerPal = v; }));
        row.appendChild(numInp('Stk V pal', l.verStkPal, (v) => { state.lines[idx].verStkPal = v; }));

        row.appendChild(refInp('Réf eti', l.etRef, (v) => { state.lines[idx].etRef = v; }));
        row.appendChild(numInp('Ét/pqt', l.etPerPack, (v) => { state.lines[idx].etPerPack = v; }));
        row.appendChild(numInp('Stk ét pqt', l.etStkPqt, (v) => { state.lines[idx].etStkPqt = v; }));

        row.appendChild(refInp('Réf CRC', l.cap.ref, (v) => { state.lines[idx].cap.ref = v; }));
        row.appendChild(numInp('Cap/bte', l.cap.perBox, (v) => { state.lines[idx].cap.perBox = v; }));
        row.appendChild(numInp('Nb bte', l.cap.boxesPerPal, (v) => { state.lines[idx].cap.boxesPerPal = v; }));
        row.appendChild(numInp('Stk C pal', l.cap.stkPal, (v) => { state.lines[idx].cap.stkPal = v; }));

        row.appendChild(refInp('Réf cct', l.tray.ref, (v) => { state.lines[idx].tray.ref = v; }));
        row.appendChild(numInp('Tray/pal', l.tray.perPal, (v) => { state.lines[idx].tray.perPal = v; }));
        row.appendChild(numInp('Nb pal', l.tray.stkPal, (v) => { state.lines[idx].tray.stkPal = v; }));

        const fd = document.createElement('div');
        fd.className = 'f-box fmt-box';
        const fl = document.createElement('label');
        fl.textContent = 'Fmt';
        fd.appendChild(fl);
        const fp = document.createElement('div');
        fp.className = 'fmt-pills';
        [6, 8, 12].forEach(o => {
          const lb = document.createElement('label');
          lb.className = 'fmt-pill';
          const rd = document.createElement('input');
          rd.type = 'radio';
          rd.name = `fmt_r_${idx}`;
          rd.value = o;
          rd.checked = Number(l.tray.packSize) === o;
          rd.onchange = () => { state.lines[idx].tray.packSize = o; save(); refresh(); };
          const sp = document.createElement('span');
          sp.textContent = o;
          lb.appendChild(rd);
          lb.appendChild(sp);
          fp.appendChild(lb);
        });
        fd.appendChild(fp);
        row.appendChild(fd);

        card.appendChild(row);

        const needs = document.createElement('div');
        needs.className = 'needs-row';
        needs.id = `needs_${idx}`;
        card.appendChild(needs);

        wrap.appendChild(card);
      });
    }

    function refresh() {
      document.getElementById('top-total').textContent = fmt(totPF());

      state.lines.forEach((l, idx) => {
        const ft = document.getElementById(`ftag_${idx}`);
        if (ft) ft.textContent = `🍓 ${displayFruit(l, idx)}`;

        const pf = linePF(l);
        const sub = document.getElementById(`sub_${idx}`);
        if (sub) sub.textContent = `= ${fmt(pf)}`;

        // 1. Besoin Verre
        const vPal = Number(l.verPerPal) || 0;
        const vNeedPal = vPal > 0 ? Math.ceil(pf / vPal) : 0;
        const vStkPal = Number(l.verStkPal) || 0;
        const vStkU = vStkPal * vPal;
        const vTag = (l.verRef || '').trim() ? ` [${l.verRef.trim()}]` : '';
        let vClass = 'need-chip';
        let vTxt = `🫙 Verre${vTag}: ${fmt(pf)}` + (vPal > 0 ? ` (${fmt(vNeedPal)} pal)` : '');
        if (vStkPal > 0) {
          if (vStkU < pf) {
            vClass = 'need-chip err';
            vTxt += ` — Manque ${fmt(pf - vStkU)} ver.`;
          } else {
            vClass = 'need-chip ok';
            vTxt += ` — OK (+${fmt(vStkU - pf)})`;
          }
        }

        // 2. Besoin Étiquettes (5000 par défaut)
        const etPqt = Number(l.etPerPack) || 0;
        const etNeedPqt = etPqt > 0 ? Math.ceil(pf / etPqt) : 0;
        const etStkPqt = Number(l.etStkPqt) || 0;
        const etStkU = etStkPqt * etPqt;
        const etTag = (l.etRef || '').trim() ? ` [${l.etRef.trim()}]` : '';
        let etClass = 'need-chip';
        let etTxt = `🏷️ Ét.${etTag}: ${fmt(pf)}` + (etPqt > 0 ? ` (${fmt(etNeedPqt)} pqt)` : '');
        if (etStkPqt > 0) {
          if (etStkU < pf) {
            etClass = 'need-chip err';
            etTxt += ` — Manque ${fmt(pf - etStkU)} ét.`;
          } else {
            etClass = 'need-chip ok';
            etTxt += ` — OK (+${fmt(etStkU - pf)})`;
          }
        }

        // 3. Besoin Capsule (400 par boîte, 1 boîte par défaut)
        const cBox = Number(l.cap.perBox) || 0;
        const cNbBte = Number(l.cap.boxesPerPal) || 0;
        const cDispo = cBox * cNbBte;
        const cNeedBte = cBox > 0 ? Math.ceil(pf / cBox) : 0;
        const cStkPal = Number(l.cap.stkPal) || 0;
        const cTag = (l.cap.ref || '').trim() ? ` [${l.cap.ref.trim()}]` : '';
        let cClass = 'need-chip';
        let cTxt = `🔘 Cap.${cTag}: besoin ${fmt(pf)} cap.` + (cBox > 0 ? ` (${fmt(cNeedBte)} bte à ${fmt(cBox)})` : '');
        if (cDispo > 0 && cDispo < pf) {
          cClass = 'need-chip err';
          cTxt += ` — Manque ${fmt(pf - cDispo)} cap. (sur ${fmt(cDispo)})`;
        } else if (cStkPal > 0) {
          const cStkTot = cStkPal * (cDispo || 1);
          if (cStkTot < pf) {
            cClass = 'need-chip err';
            cTxt += ` — Manque ${fmt(pf - cStkTot)} cap.`;
          } else {
            cClass = 'need-chip ok';
            cTxt += ` — OK`;
          }
        }

        // 4. Besoin Tray (3000 par palette, 1 palette, format 12 par défaut)
        const fmtN = Number(l.tray.packSize) || 12;
        const trPerPal = Number(l.tray.perPal) || 0;
        const trNbPal = Number(l.tray.stkPal) || 0;
        const trNeed = pf > 0 ? Math.ceil(pf / fmtN) : 0;
        const trDispo = trPerPal * trNbPal;
        const trTag = (l.tray.ref || '').trim() ? ` [${l.tray.ref.trim()}]` : '';
        let trClass = 'need-chip';
        let trTxt = `📦 Tray${trTag} (x${fmtN}): besoin ${fmt(trNeed)} tr.` + (trPerPal > 0 ? ` (${fmt(trPerPal)}/pal)` : '');
        if (trDispo > 0 && trDispo < trNeed) {
          trClass = 'need-chip err';
          trTxt += ` — Manque ${fmt(trNeed - trDispo)} tr. (sur ${fmt(trDispo)})`;
        } else if (trDispo >= trNeed && trDispo > 0) {
          trClass = 'need-chip ok';
          trTxt += ` — OK (+${fmt(trDispo - trNeed)})`;
        }

        const nBox = document.getElementById(`needs_${idx}`);
        if (nBox) {
          nBox.innerHTML = `
            <span class="${vClass}">${vTxt}</span>
            <span class="${etClass}">${etTxt}</span>
            <span class="${cClass}">${cTxt}</span>
            <span class="${trClass}">${trTxt}</span>
          `;
        }
      });
    }

    // --- ASSISTANT START ---
    function showSt(num) {
      [0, 1, 2, 3, 4].forEach(n => {
        document.getElementById(`st-${n}`).classList.toggle('active', n === num);
      });
    }

    function startWizard() {
      const nextIdx = state.lines.length;
      const prev = state.lines[nextIdx - 1] || defLine(0);
      const defaultFruit = getDefaultFruitName(nextIdx);

      draft = {
        fruit: defaultFruit,
        verPerApp: prev.verPerApp || '',
        nbApp: 1,
        verRef: prev.verRef || '',
        verPerPal: prev.verPerPal || '',
        verStkPal: '',
        etRef: prev.etRef || '',
        etPerPack: prev.etPerPack || 5000,
        etStkPqt: '',
        cap: {
          ref: prev.cap ? prev.cap.ref : '',
          perBox: prev.cap ? prev.cap.perBox : 400,
          boxesPerPal: prev.cap ? prev.cap.boxesPerPal : 1,
          stkPal: ''
        },
        tray: {
          ref: prev.tray ? prev.tray.ref : '',
          perPal: prev.tray ? prev.tray.perPal : 3000,
          packSize: prev.tray ? prev.tray.packSize : 12,
          stkPal: prev.tray ? prev.tray.stkPal : 1
        }
      };

      document.getElementById('st-title').textContent = `▶️ Ligne ${nextIdx + 1}`;
      document.getElementById('st-fruit').value = defaultFruit;
      document.getElementById('st-fruit').placeholder = defaultFruit;
      document.getElementById('st-ver-app').value = prev.verPerApp || '';
      document.getElementById('st-nb-app').value = 1;

      document.getElementById('st-cap-prev').textContent =
        `Actuel : Réf [${draft.cap.ref || '-'}] • Cap/bte: ${draft.cap.perBox || 400} • Nb bte: ${draft.cap.boxesPerPal || 1}`;
      document.getElementById('st-cap-box').value = 400;
      document.getElementById('st-cap-pal').value = 1;
      document.getElementById('st-cap-form').style.display = 'none';
      document.getElementById('st-cap-choice').style.display = 'flex';
      document.getElementById('st-cap-next').style.display = 'none';

      document.getElementById('st-tray-prev').textContent =
        `Actuel : Réf [${draft.tray.ref || '-'}] • Tray/pal: ${draft.tray.perPal || 3000} • Nb pal: ${draft.tray.stkPal || 1} • Fmt: ${draft.tray.packSize || 12}`;
      document.getElementById('st-tray-pal').value = 3000;
      document.getElementById('st-tray-stk').value = 1;
      document.querySelectorAll('input[name="st_tray_fmt"]').forEach(r => {
        r.checked = Number(r.value) === 12;
      });
      document.getElementById('st-tray-form').style.display = 'none';
      document.getElementById('st-tray-choice').style.display = 'flex';
      document.getElementById('st-tray-finish').style.display = 'none';

      showSt(0);
      document.getElementById('start-modal').classList.add('open');
      setTimeout(() => document.getElementById('st-fruit').focus(), 50);
    }

    function closeStart() {
      document.getElementById('start-modal').classList.remove('open');
      draft = null;
    }

    function goSt1() {
      const nextIdx = state.lines.length;
      const typed = document.getElementById('st-fruit').value.trim();
      draft.fruit = typed ? typed : getDefaultFruitName(nextIdx);
      showSt(1);
      setTimeout(() => document.getElementById('st-ver-app').focus(), 50);
    }

    function goSt2() {
      draft.verPerApp = document.getElementById('st-ver-app').value;
      showSt(2);
      setTimeout(() => document.getElementById('st-nb-app').focus(), 50);
    }

    function goSt3() {
      const v = document.getElementById('st-nb-app').value;
      draft.nbApp = v === '' ? 1 : v;
      showSt(3);
    }

    function chooseCap(same) {
      if (same) {
        showSt(4);
      } else {
        document.getElementById('st-cap-ref').value = '';
        document.getElementById('st-cap-box').value = 400;
        document.getElementById('st-cap-pal').value = 1;
        document.getElementById('st-cap-form').style.display = 'block';
        document.getElementById('st-cap-choice').style.display = 'none';
        document.getElementById('st-cap-next').style.display = 'flex';
      }
    }

    function saveCapAndGoSt4() {
      draft.cap = {
        ref: document.getElementById('st-cap-ref').value,
        perBox: document.getElementById('st-cap-box').value || 400,
        boxesPerPal: document.getElementById('st-cap-pal').value || 1,
        stkPal: ''
      };
      showSt(4);
    }

    function chooseTray(same) {
      if (same) {
        finishStart();
      } else {
        document.getElementById('st-tray-ref').value = '';
        document.getElementById('st-tray-pal').value = 3000;
        document.getElementById('st-tray-stk').value = 1;
        document.querySelectorAll('input[name="st_tray_fmt"]').forEach(r => {
          r.checked = Number(r.value) === 12;
        });
        document.getElementById('st-tray-form').style.display = 'block';
        document.getElementById('st-tray-choice').style.display = 'none';
        document.getElementById('st-tray-finish').style.display = 'flex';
      }
    }

    function saveTrayAndFinish() {
      const ch = document.querySelector('input[name="st_tray_fmt"]:checked');
      draft.tray = {
        ref: document.getElementById('st-tray-ref').value,
        perPal: document.getElementById('st-tray-pal').value || 3000,
        packSize: ch ? Number(ch.value) : 12,
        stkPal: document.getElementById('st-tray-stk').value || 1
      };
      finishStart();
    }

    function finishStart() {
      state.lines.push(draft);
      save();
      closeStart();
      renderLines();
      refresh();
    }

    function resetAll() {
      if (confirm('Reset à zéro ?')) {
        state = defState();
        save();
        renderLines();
        refresh();
      }
    }

    function printSummary() {
      const rep = document.getElementById('print-report');
      const now = new Date().toLocaleString('fr-FR');
      let rows = '';
      state.lines.forEach((l, i) => {
        rows += `<tr><td>L${i + 1}</td><td>${displayFruit(l, i)}</td><td>${l.verPerApp || 0}</td><td>${l.nbApp || 0}</td><td><strong>${fmt(linePF(l))}</strong></td><td>${l.cap.ref || '-'} (${l.cap.perBox || 0}/bte)</td><td>${l.tray.ref || '-'} (${l.tray.perPal || 0}/pal, x${l.tray.packSize || 12})</td></tr>`;
      });
      rep.innerHTML = `
        <div style="display:flex; justify-content:space-between; border-bottom:2px solid #000; padding-bottom:6px; margin-bottom:10px;">
          <strong>Total PF: ${fmt(totPF())}</strong>
          <span>${now}</span>
        </div>
        <div class="p-box">
          <table class="p-tbl">
            <thead><tr><th>Ligne</th><th>Fruit</th><th>Ver/app</th><th>App</th><th>Total</th><th>Capsule</th><th>Tray</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
      window.print();
    }

    load();
    renderLines();
    refresh();
  </script>
</body>
</html>
