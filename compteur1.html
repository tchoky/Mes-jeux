<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteurs 5-3-2-4-1 sur une même ligne</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --info-bg: #eff6ff;
      --info-border: #bfdbfe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 10px;
    }

    .top-bar {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      border-radius: 8px;
      padding: 8px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .top-title {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .top-total {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--primary);
    }

    /* TOUS LES COMPTEURS (5, 3, 2, 4, 1) SUR UNE MÊME LIGNE HORIZONTALE */
    .horizontal-strip {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: stretch;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .col-block {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      min-width: 250px;
      flex: 1 0 250px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .col-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 6px;
      font-weight: 800;
      font-size: 0.95rem;
    }

    .group-box {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 6px;
    }

    .group-top {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 5px;
    }

    .group-name {
      padding: 4px 6px;
      border: 1px solid #94a3b8;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 700;
      width: 95px;
      background: #fff;
    }

    .group-sub {
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 6px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* Ligne de champs compacte */
    .compact-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-end;
      gap: 4px;
      margin-bottom: 4px;
    }

    .c-field {
      display: flex;
      flex-direction: column;
      min-width: 56px;
      flex: 1 1 56px;
    }

    .c-field.ref-f {
      min-width: 58px;
      flex: 0 0 64px;
    }

    .c-field label {
      font-size: 0.66rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 2px;
      white-space: nowrap;
    }

    .c-field input[type="number"],
    .c-field input[type="text"] {
      padding: 4px 6px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 0.85rem;
      width: 100%;
    }

    .rad-mini {
      display: flex;
      gap: 3px;
    }

    .rad-mini label {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      padding: 3px 5px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .rad-mini input:checked + span {
      color: var(--primary);
    }

    .mini-res {
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 6px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      white-space: nowrap;
    }

    .need-pill {
      padding: 6px 8px;
      border-radius: 6px;
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .need-pill.err {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .need-pill.ok {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    button {
      padding: 4px 8px;
      border-radius: 5px;
      border: none;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .btn-primary { background: var(--primary); color: #fff; padding: 8px 14px; font-size: 0.88rem; }
    .btn-add { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; padding: 8px 14px; font-size: 0.88rem; }
    .btn-del { background: #fee2e2; color: var(--danger); padding: 4px 6px; }

    .actions-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 12px;
    }

    #print-report { display: none; }

    @media print {
      body { background: #fff; padding: 0; }
      .top-bar, .horizontal-strip, .actions-bar { display: none !important; }
      #print-report { display: block !important; }
      .p-box { border: 1px solid #bbb; border-radius: 6px; padding: 8px; margin-bottom: 10px; page-break-inside: avoid; }
      .p-tbl { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 4px; }
      .p-tbl th, .p-tbl td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; }
      .p-err { color: #dc2626 !important; font-weight: bold; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .p-ok { color: #16a34a !important; font-weight: bold; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-title">Total PF (5)</div>
    <div class="top-total" id="top-total">0</div>
  </div>

  <!-- 5, 3, 2, 4, 1 SUR UNE MÊME LIGNE -->
  <div class="horizontal-strip" id="strip"></div>

  <div class="actions-bar">
    <button class="btn-primary" onclick="printSummary()">🖨️ PDF</button>
    <button class="btn-danger" onclick="resetAll()">🔄 Reset</button>
  </div>

  <div id="print-report"></div>

  <script>
    const KEY = 'compteurs_53241_ligne_v1';

    let state = {
      groups: [],
      components: {
        etiquettes: { ref: '', perPack: '', stockPacks: '' },
        capsules:   { ref: '', perBox: '', boxesPerPallet: '', stockPallets: '' },
        trays:      { ref: '', perPallet: '', packSize: 6, stockPallets: '' },
        bocaux:     { ref: '', perPallet: '', stockPallets: '' }
      }
    };

    function defGroup(idx) {
      return {
        id: 'g_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
        name: `Fruit ${idx + 1}`,
        rows: [{ nbApp: '', nbPerApp: '' }]
      };
    }

    function defState() {
      return {
        groups: [defGroup(0)],
        components: {
          etiquettes: { ref: '', perPack: '', stockPacks: '' },
          capsules:   { ref: '', perBox: '', boxesPerPallet: '', stockPallets: '' },
          trays:      { ref: '', perPallet: '', packSize: 6, stockPallets: '' },
          bocaux:     { ref: '', perPallet: '', stockPallets: '' }
        }
      };
    }

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const p = JSON.parse(raw);
          state = Object.assign(defState(), p);
          state.components = Object.assign(defState().components, p.components || {});
          if (!Array.isArray(state.groups) || !state.groups.length) state.groups = [defGroup(0)];
          return;
        }
      } catch (e) {}
      state = defState();
    }

    function save() {
      localStorage.setItem(KEY, JSON.stringify(state));
    }

    function fmt(n) {
      return Math.ceil(Number(n) || 0).toLocaleString('fr-FR');
    }

    function rowPF(r) {
      return (Number(r.nbApp) || 0) * (Number(r.nbPerApp) || 0);
    }

    function grpPF(g) {
      return (g.rows || []).reduce((s, r) => s + rowPF(r), 0);
    }

    function totPF() {
      return state.groups.reduce((s, g) => s + grpPF(g), 0);
    }

    function gName(g, i) {
      const t = (g.name || '').trim();
      return t ? t : `Fruit ${i + 1}`;
    }

    function calcNeed(key, pf) {
      const c = state.components[key];
      const tag = (c.ref || '').trim() ? ` [${(c.ref || '').trim()}]` : '';

      if (key === 'etiquettes') {
        const perP = Number(c.perPack) || 0;
        const stkP = Number(c.stockPacks) || 0;
        const stkU = stkP * perP;
        const needP = perP > 0 ? Math.ceil(pf / perP) : 0;
        const missU = Math.max(0, pf - stkU);
        const missP = perP > 0 ? Math.max(0, needP - stkP) : 0;
        return {
          txt: `Besoin${tag}: ${fmt(pf)} ét.` + (perP > 0 ? ` (${fmt(needP)} pqt)` : ''),
          hasStk: stkP > 0,
          missU,
          missTxt: `Manque: ${fmt(missU)} ét.` + (perP > 0 ? ` (${fmt(missP)} pqt)` : ''),
          okTxt: `OK (+${fmt(stkU - pf)} ét.)`
        };
      }

      if (key === 'capsules') {
        const perB = Number(c.perBox) || 0;
        const btePal = Number(c.boxesPerPallet) || 0;
        const perPal = perB * btePal;
        const stkPal = Number(c.stockPallets) || 0;
        const stkU = stkPal * perPal;
        const needB = perB > 0 ? Math.ceil(pf / perB) : 0;
        const needPal = perPal > 0 ? Math.ceil(pf / perPal) : 0;
        const missU = Math.max(0, pf - stkU);
        const missPal = perPal > 0 ? Math.max(0, needPal - stkPal) : 0;
        return {
          txt: `Besoin${tag}: ${fmt(pf)} cap.` + (perB > 0 ? ` / ${fmt(needB)} bte` : '') + (perPal > 0 ? ` / ${fmt(needPal)} pal` : ''),
          hasStk: stkPal > 0,
          missU,
          missTxt: `Manque: ${fmt(missU)} cap.` + (perPal > 0 ? ` (${fmt(missPal)} pal)` : ''),
          okTxt: `OK (+${fmt(stkU - pf)} cap.)`
        };
      }

      if (key === 'trays') {
        const perPal = Number(c.perPallet) || 0;
        const fmtN = Number(c.packSize) || 6;
        const stkPal = Number(c.stockPallets) || 0;
        const needTr = pf > 0 ? Math.ceil(pf / fmtN) : 0;
        const needPal = perPal > 0 ? Math.ceil(needTr / perPal) : 0;
        const stkTr = stkPal * perPal;
        const missTr = Math.max(0, needTr - stkTr);
        const missPal = perPal > 0 ? Math.max(0, needPal - stkPal) : 0;
        return {
          txt: `Besoin${tag} (x${fmtN}): ${fmt(needTr)} tr.` + (perPal > 0 ? ` / ${fmt(needPal)} pal` : ''),
          hasStk: stkPal > 0,
          missU: missTr,
          missTxt: `Manque: ${fmt(missTr)} tr.` + (perPal > 0 ? ` (${fmt(missPal)} pal)` : ''),
          okTxt: `OK (+${fmt(stkTr - needTr)} tr.)`
        };
      }

      const perPal = Number(c.perPallet) || 0;
      const stkPal = Number(c.stockPallets) || 0;
      const needPal = perPal > 0 ? Math.ceil(pf / perPal) : 0;
      const stkU = stkPal * perPal;
      const missU = Math.max(0, pf - stkU);
      const missPal = perPal > 0 ? Math.max(0, needPal - stkPal) : 0;
      return {
        txt: `Besoin${tag}: ${fmt(pf)} boc.` + (perPal > 0 ? ` / ${fmt(needPal)} pal` : ''),
        hasStk: stkPal > 0,
        missU,
        missTxt: `Manque: ${fmt(missU)} boc.` + (perPal > 0 ? ` (${fmt(missPal)} pal)` : ''),
        okTxt: `OK (+${fmt(stkU - pf)} boc.)`
      };
    }

    function refresh() {
      const pf = totPF();
      document.getElementById('top-total').textContent = fmt(pf);

      state.groups.forEach((g, gi) => {
        const ge = document.getElementById(`gt_${gi}`);
        if (ge) ge.textContent = `= ${fmt(grpPF(g))}`;
        g.rows.forEach((r, ri) => {
          const re = document.getElementById(`rs_${gi}_${ri}`);
          if (re) re.textContent = `= ${fmt(rowPF(r))}`;
        });
      });

      ['etiquettes', 'capsules', 'trays', 'bocaux'].forEach(k => {
        const el = document.getElementById(`nd_${k}`);
        if (!el) return;
        const info = calcNeed(k, pf);
        el.className = 'need-pill';
        if (info.hasStk) {
          if (info.missU > 0) {
            el.classList.add('err');
            el.textContent = `${info.txt} • ${info.missTxt}`;
          } else {
            el.classList.add('ok');
            el.textContent = `${info.txt} • ${info.okTxt}`;
          }
        } else {
          el.textContent = info.txt;
        }
      });
    }

    function numInp(lbl, val, fn) {
      const d = document.createElement('div');
      d.className = 'c-field';
      const l = document.createElement('label');
      l.textContent = lbl;
      const i = document.createElement('input');
      i.type = 'number';
      i.min = '0';
      i.step = 'any';
      i.placeholder = '0';
      i.value = val;
      i.oninput = (e) => { fn(e.target.value); save(); refresh(); };
      d.appendChild(l);
      d.appendChild(i);
      return d;
    }

    function refInp(lbl, val, fn) {
      const d = document.createElement('div');
      d.className = 'c-field ref-f';
      const l = document.createElement('label');
      l.textContent = lbl;
      const i = document.createElement('input');
      i.type = 'text';
      i.placeholder = lbl.replace('Réf ', '');
      i.value = val;
      i.oninput = (e) => { fn(e.target.value); save(); refresh(); };
      d.appendChild(l);
      d.appendChild(i);
      return d;
    }

    function render() {
      const strip = document.getElementById('strip');
      strip.innerHTML = '';

      // 5. PF (groupes)
      const c5 = document.createElement('div');
      c5.className = 'col-block';
      c5.style.minWidth = '310px';
      c5.style.flex = '1.3 0 310px';

      const h5 = document.createElement('div');
      h5.className = 'col-head';
      h5.innerHTML = `<span>✅ 5. PF</span>`;
      const addGBtn = document.createElement('button');
      addGBtn.className = 'btn-add';
      addGBtn.textContent = '+ Grp';
      addGBtn.onclick = () => { state.groups.push(defGroup(state.groups.length)); save(); render(); };
      h5.appendChild(addGBtn);
      c5.appendChild(h5);

      const gList = document.createElement('div');
      state.groups.forEach((g, gi) => {
        const gb = document.createElement('div');
        gb.className = 'group-box';

        const gt = document.createElement('div');
        gt.className = 'group-top';

        const ni = document.createElement('input');
        ni.type = 'text';
        ni.className = 'group-name';
        ni.placeholder = `Fruit ${gi + 1}`;
        ni.value = g.name;
        ni.oninput = (e) => { state.groups[gi].name = e.target.value; save(); refresh(); };

        const subG = document.createElement('span');
        subG.className = 'group-sub';
        subG.id = `gt_${gi}`;
        subG.textContent = `= ${fmt(grpPF(g))}`;

        const addR = document.createElement('button');
        addR.className = 'btn-add';
        addR.textContent = '+ Ligne';
        addR.onclick = () => { state.groups[gi].rows.push({ nbApp: '', nbPerApp: '' }); save(); render(); };

        gt.appendChild(ni);
        gt.appendChild(subG);
        gt.appendChild(addR);

        if (state.groups.length > 1) {
          const delG = document.createElement('button');
          delG.className = 'btn-del';
          delG.textContent = '×';
          delG.onclick = () => { state.groups.splice(gi, 1); save(); render(); };
          gt.appendChild(delG);
        }
        gb.appendChild(gt);

        g.rows.forEach((r, ri) => {
          const row = document.createElement('div');
          row.className = 'compact-row';
          row.appendChild(numInp('App', r.nbApp, (v) => { state.groups[gi].rows[ri].nbApp = v; }));
          row.appendChild(numInp('Nb/app', r.nbPerApp, (v) => { state.groups[gi].rows[ri].nbPerApp = v; }));

          const pill = document.createElement('span');
          pill.className = 'mini-res';
          pill.id = `rs_${gi}_${ri}`;
          pill.textContent = `= ${fmt(rowPF(r))}`;
          row.appendChild(pill);

          if (g.rows.length > 1) {
            const delR = document.createElement('button');
            delR.className = 'btn-del';
            delR.textContent = '×';
            delR.onclick = () => { state.groups[gi].rows.splice(ri, 1); save(); render(); };
            row.appendChild(delR);
          }
          gb.appendChild(row);
        });

        gList.appendChild(gb);
      });
      c5.appendChild(gList);
      strip.appendChild(c5);

      // ORDRE : 3, 2, 4, 1 SUR LA MÊME LIGNE
      strip.appendChild(makeCol('etiquettes', '3. 🏷️ Ét.',   'Réf eti'));
      strip.appendChild(makeCol('capsules',   '2. 🔘 Cap.',  'Réf CRC'));
      strip.appendChild(makeCol('trays',      '4. 📦 Trays', 'Réf cct'));
      strip.appendChild(makeCol('bocaux',     '1. 🫙 Boc.',  'Réf V'));

      refresh();
    }

    function makeCol(key, title, refLbl) {
      const c = state.components[key];
      const col = document.createElement('div');
      col.className = 'col-block';

      const head = document.createElement('div');
      head.className = 'col-head';
      head.textContent = title;
      col.appendChild(head);

      const row = document.createElement('div');
      row.className = 'compact-row';
      row.appendChild(refInp(refLbl, c.ref, (v) => { state.components[key].ref = v; }));

      if (key === 'etiquettes') {
        row.appendChild(numInp('Ét/pqt', c.perPack, (v) => { state.components.etiquettes.perPack = v; }));
        row.appendChild(numInp('Stk', c.stockPacks, (v) => { state.components.etiquettes.stockPacks = v; }));
      } else if (key === 'capsules') {
        row.appendChild(numInp('Cap/bte', c.perBox, (v) => { state.components.capsules.perBox = v; }));
        row.appendChild(numInp('Bte/pal', c.boxesPerPallet, (v) => { state.components.capsules.boxesPerPallet = v; }));
        row.appendChild(numInp('Stk pal', c.stockPallets, (v) => { state.components.capsules.stockPallets = v; }));
      } else if (key === 'trays') {
        row.appendChild(numInp('Tr/pal', c.perPallet, (v) => { state.components.trays.perPallet = v; }));

        const fd = document.createElement('div');
        fd.className = 'c-field';
        const fl = document.createElement('label');
        fl.textContent = 'Fmt';
        fd.appendChild(fl);

        const rm = document.createElement('div');
        rm.className = 'rad-mini';
        [6, 8, 12].forEach(o => {
          const lb = document.createElement('label');
          const rd = document.createElement('input');
          rd.type = 'radio';
          rd.name = 'fmt_rad';
          rd.value = o;
          rd.checked = Number(c.packSize) === o;
          rd.onchange = () => { state.components.trays.packSize = o; save(); refresh(); };
          const sp = document.createElement('span');
          sp.textContent = o;
          lb.appendChild(rd);
          lb.appendChild(sp);
          rm.appendChild(lb);
        });
        fd.appendChild(rm);
        row.appendChild(fd);

        row.appendChild(numInp('Stk pal', c.stockPallets, (v) => { state.components.trays.stockPallets = v; }));
      } else {
        row.appendChild(numInp('Boc/pal', c.perPallet, (v) => { state.components.bocaux.perPallet = v; }));
        row.appendChild(numInp('Stk pal', c.stockPallets, (v) => { state.components.bocaux.stockPallets = v; }));
      }

      col.appendChild(row);

      const nd = document.createElement('div');
      nd.className = 'need-pill';
      nd.id = `nd_${key}`;
      col.appendChild(nd);

      return col;
    }

    function resetAll() {
      if (confirm('Reset à zéro ?')) {
        state = defState();
        save();
        render();
      }
    }

    function printSummary() {
      const rep = document.getElementById('print-report');
      const now = new Date().toLocaleString('fr-FR');
      const pf = totPF();

      let rowsHtml = '';
      state.groups.forEach((g, gi) => {
        const gn = gName(g, gi);
        g.rows.forEach((r, ri) => {
          rowsHtml += `<tr><td>${gn}</td><td>L${ri + 1}</td><td>${r.nbApp || 0}</td><td>${r.nbPerApp || 0}</td><td><strong>${fmt(rowPF(r))}</strong></td></tr>`;
        });
        rowsHtml += `<tr><td colspan="4"><strong>Total ${gn}</strong></td><td><strong>${fmt(grpPF(g))}</strong></td></tr>`;
      });

      const list = [
        { k: 'etiquettes', t: '3. Ét. (eti)' },
        { k: 'capsules',   t: '2. Cap. (CRC)' },
        { k: 'trays',      t: '4. Trays (cct)' },
        { k: 'bocaux',     t: '1. Boc. (V)' }
      ];

      let cHtml = '';
      list.forEach(item => {
        const c = state.components[item.k];
        const info = calcNeed(item.k, pf);
        const extra = info.hasStk
          ? `<div class="${info.missU > 0 ? 'p-err' : 'p-ok'}">${info.missU > 0 ? info.missTxt : info.okTxt}</div>`
          : '';
        cHtml += `<div class="p-box"><strong>${item.t}</strong> — Réf: <em>${c.ref || '-'}</em><br>${info.txt}${extra}</div>`;
      });

      rep.innerHTML = `
        <div style="display:flex; justify-content:space-between; border-bottom:2px solid #000; padding-bottom:6px; margin-bottom:10px;">
          <strong>Total PF: ${fmt(pf)}</strong>
