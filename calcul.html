<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Jardin des Calculs Magiques</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#efe3ff; --bg2:#ffe3f1; --plum:#4b2e83; --pink:#ff7eb6; --pink-d:#d9548d;
  --mint:#6fddb9; --mint-d:#3fb68f; --sun:#ffd24d; --sun-d:#e0a800; --sky:#8fc7ff; --sky-d:#5a9be0;
  --card:#ffffff;
  --font:'Fredoka','Nunito','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:var(--font); color:var(--plum);
  background:radial-gradient(circle at 15% 10%,#fff6c9 0,transparent 35%),linear-gradient(160deg,var(--bg1),var(--bg2) 60%,#dff6ff);
  min-height:100%; overflow-x:hidden; user-select:none;
}
/* décor : petites étoiles qui flottent */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco span{position:absolute;font-size:28px;opacity:.55;animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-18px) rotate(12deg)}}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:14px;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:clamp(22px,5vw,34px);margin:0;font-weight:700;line-height:1.1}
.pill{
  font-family:inherit;font-size:18px;font-weight:600;color:var(--plum);background:#fff;border:3px solid var(--plum);
  border-radius:999px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 0 var(--plum);white-space:nowrap
}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--plum)}
.pill.on{background:var(--mint)} .pill.off{background:#e6e0f0}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.hidden{display:none!important}

/* écran d'accueil */
#home{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
#home p{font-size:22px;margin:4px 0 0}
.unicorn{font-size:84px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
.mode{
  font-family:inherit;border:0;border-radius:32px;padding:22px 12px;font-size:24px;font-weight:700;color:var(--plum);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;min-height:130px;transition:transform .12s
}
.mode .ico{font-size:46px}
.mode:active{transform:translateY(5px)}
.mode.add{background:var(--sun);box-shadow:0 8px 0 var(--sun-d)}
.mode.mul{background:var(--pink);box-shadow:0 8px 0 var(--pink-d)}
.mode.seq{background:var(--sky);box-shadow:0 8px 0 var(--sky-d)}
.mode.mix{background:linear-gradient(135deg,#c79bff,#ff9ed0,#ffe27a);box-shadow:0 8px 0 #9a6ad8}
.mode.mix{grid-column:1/-1;flex-direction:row;justify-content:center;gap:14px;min-height:100px}

/* écran de jeu */
#game{display:flex;flex-direction:column;gap:14px}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:rgba(255,255,255,.75);border-radius:24px;padding:10px 14px}
.hud .stat{font-size:22px;font-weight:700}
.level{flex:1 1 220px}
.level small{display:block;font-size:16px;font-weight:600;margin-bottom:4px}
.bar{height:20px;background:#e9defa;border-radius:999px;overflow:hidden;border:3px solid var(--plum)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sun));border-radius:999px;transition:width .5s}
.board{background:var(--card);border-radius:36px;padding:20px 14px;text-align:center;box-shadow:0 8px 0 #cdb8ee;position:relative}
.mascot{font-size:56px;display:inline-block}
.mascot.happy{animation:jump .6s}
.mascot.oops{animation:wobble .5s}
@keyframes jump{30%{transform:translateY(-22px) scale(1.15)}}
@keyframes wobble{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.question{font-size:clamp(38px,11vw,68px);font-weight:700;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin:6px 0}
.question .box{
  min-width:1.9em;height:1.35em;padding:0 .25em;border-radius:20px;border:4px dashed var(--pink);background:#fff4fa;color:var(--pink-d);
  display:inline-flex;align-items:center;justify-content:center
}
.box.reveal{border-style:solid;border-color:var(--mint-d);background:#e6fff6;color:var(--mint-d)}
.sub{font-size:20px;min-height:1.6em;margin:2px 0 6px;font-weight:600}
.help{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 2px}
.help div{background:#fff0f8;border:3px solid var(--pink);border-radius:18px;padding:4px 8px;font-size:18px;line-height:1.15;max-width:130px}
.padwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,340px)}
.key{
  font-family:inherit;font-size:34px;font-weight:700;color:var(--plum);background:#fff;border:0;border-radius:26px;min-height:72px;cursor:pointer;
  box-shadow:0 6px 0 #cdb8ee
}
.key:active{transform:translateY(4px);box-shadow:0 2px 0 #cdb8ee}
.key.del{background:#ffe9c7;box-shadow:0 6px 0 #e8c58a}
.key.ok{background:var(--mint);box-shadow:0 6px 0 var(--mint-d)}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* célébration */
#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(75,46,131,.45)}
#overlay .card{background:#fff;border-radius:40px;padding:28px 34px;text-align:center;box-shadow:0 10px 0 #cdb8ee;animation:pop .5s}
#overlay .big{font-size:64px}
#overlay h2{margin:4px 0;font-size:34px}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.08)}}
#confetti{position:fixed;inset:0;z-index:6;pointer-events:none}
@media (max-width:420px){.modes{gap:10px}.mode{font-size:20px;min-height:110px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="deco" aria-hidden="true">
  <span style="left:6%;top:12%">⭐</span><span style="left:86%;top:8%;animation-delay:1s">✨</span>
  <span style="left:12%;top:78%;animation-delay:2s">🌸</span><span style="left:90%;top:70%;animation-delay:.5s">🦋</span>
  <span style="left:70%;top:90%;animation-delay:3s">🌈</span><span style="left:45%;top:4%;animation-delay:1.5s">⭐</span>
</div>

<div id="app">
  <header>
    <h1>🌷 Le Jardin des Calculs Magiques</h1>
    <div style="display:flex;gap:8px">
      <button class="pill hidden" id="homeBtn" title="Retour à l'accueil">🏠 Accueil</button>
      <button class="pill on" id="soundBtn" aria-pressed="true">🔊 Son ON</button>
    </div>
  </header>

  <!-- ACCUEIL -->
  <main id="home">
    <div class="unicorn">🦄</div>
    <p>Coucou ! À quoi veux-tu jouer ?</p>
    <div class="modes">
      <button class="mode add" data-mode="add"><span class="ico">➕</span>Additions</button>
      <button class="mode mul" data-mode="mul"><span class="ico">✖️</span>Multiplications</button>
      <button class="mode seq" data-mode="seq"><span class="ico">🔢</span>Suites logiques</button>
      <button class="mode mix" data-mode="mix"><span class="ico">🪄</span>Mélange magique</button>
    </div>
  </main>

  <!-- JEU -->
  <section id="game" class="hidden">
    <div class="hud">
      <div class="stat">⭐ <span id="stars">0</span></div>
      <div class="level"><small id="levelName">Niveau 1</small><div class="bar"><i id="barFill"></i></div></div>
      <div class="stat">🔥 <span id="streak">0</span></div>
    </div>
    <div class="board">
      <div class="mascot" id="mascot">🦄</div>
      <div class="question" id="question"></div>
      <div class="sub" id="msg"></div>
      <div class="help hidden" id="help"></div>
    </div>
    <div class="padwrap">
      <div class="pad">
        <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
        <button class="key del" data-k="del" aria-label="Effacer">⌫</button><button class="key" data-k="0">0</button><button class="key ok" data-k="ok" aria-label="Valider">✓</button>
      </div>
      <div class="tools"><button class="pill hidden" id="helpBtn">🌟 Un petit coup de pouce</button></div>
    </div>
  </section>
</div>

<div id="overlay" class="hidden"><div class="card"><div class="big" id="ovEmoji">🎉</div><h2 id="ovTitle"></h2><div id="ovText" style="font-size:22px"></div></div></div>
<canvas id="confetti"></canvas>

<script>
/* ============================================================
   RÉGLAGES — modifie ici les nombres et les tables facilement
   Les niveaux vont de 0 à 4 (affichés « Niveau 1 » à « Niveau 5 »).
   ============================================================ */
const CONFIG = {
  starsPerLevel: 5,                       // étoiles à gagner pour passer au niveau suivant
  addMax:  [10, 20, 30, 40, 50],          // résultat maximum des additions, par niveau
  addNoCarryUntilLevel: 2,                // avant ce niveau : pas de retenue
  tables:  [[2,10],[2,10,5],[2,3,5,10],[2,3,4,5,10],[2,3,4,5,6,10]], // tables disponibles par niveau
  multMax: [5, 10, 10, 10, 10],           // le « multiplicateur » va de 1 à cette valeur
  seqSteps:[[2,5,10],[2,3,5,10],[1,2,3,4,5,10],[2,3,4,5,10],[2,3,4,5,6,10]], // pas des suites par niveau
  seqLength:[4,4,5,5,5],                  // nombre de termes affichés (le nombre manquant compris)
  levelNames:["Petite graine 🌱","Bourgeon 🌿","Jolie fleur 🌸","Papillon 🦋","Licorne magique 🦄"],
  maxTries: 2                             // essais avant de montrer la bonne réponse
};
const PRAISE = ["Bravo ! 🎉","Super ! 🌟","Magnifique ! ✨","Tu es géniale ! 💖","Hop, bien vu ! 🦄","Quelle championne ! 🏆"];
const RETRY  = ["Presque ! Essaie encore 💜","Tu y es presque, regarde bien 🌈","Pas tout à fait, retente ta chance 🍀"];

/* ---------- Petits utilitaires ---------- */
const $ = id => document.getElementById(id);
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[rnd(0,arr.length-1)];

/* ---------- Sons (Web Audio API, aucun fichier) ---------- */
let audioCtx = null, soundOn = true;
function ctx(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, start, dur, type='sine', vol=.18){
  const c = ctx(); if(!c || !soundOn) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + start;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
const sfx = {
  good(){ [523,659,784].forEach((f,i)=>tone(f,i*.09,.3,'triangle')); },          // accord ascendant joyeux
  oops(){ tone(392,0,.28,'sine',.12); tone(349,.18,.4,'sine',.1); },            // doux et neutre
  win(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.12,.35,'triangle',.2)); }, // jingle de palier
  tap(){ tone(660,0,.06,'sine',.06); }
};
$('soundBtn').onclick = () => {
  soundOn = !soundOn;
  const b = $('soundBtn');
  b.textContent = soundOn ? '🔊 Son ON' : '🔇 Son OFF';
  b.classList.toggle('on',soundOn); b.classList.toggle('off',!soundOn);
  b.setAttribute('aria-pressed',soundOn);
  if(soundOn) sfx.tap();
};

/* ---------- État du jeu ---------- */
let mode = null, stars = 0, streak = 0, tries = 0, input = '', locked = false, current = null, timer = null;
const level = () => Math.min(Math.floor(stars / CONFIG.starsPerLevel), CONFIG.levelNames.length-1);

/* ---------- Générateurs de questions ---------- */
function genAdd(L){
  const max = CONFIG.addMax[L];
  for(let i=0;i<60;i++){
    const a = rnd(1, Math.min(max-1, L<3 ? 12+L*4 : 30));
    const b = rnd(1, max-a < 1 ? 1 : Math.min(max-a, L<2 ? 9 : 20));
    if(a+b>max) continue;
    const carry = (a%10)+(b%10) >= 10;
    if(carry && L < CONFIG.addNoCarryUntilLevel && a+b>10) continue; // on évite les retenues au début
    return {kind:'add', parts:`${a} + ${b} =  __`, answer:a+b};
  }
  return {kind:'add', parts:`3 + 4 = __`, answer:7};
}
function genMul(L){
  const t = pick(CONFIG.tables[L]), m = rnd(1, CONFIG.multMax[L]);
  const swap = Math.random()<.5, a = swap?m:t, b = swap?t:m;
  return {kind:'mul', parts:`${a} × ${b} = __`, answer:a*b, a, b};
}
function genSeq(L){
  const step = pick(CONFIG.seqSteps[L]), n = CONFIG.seqLength[L];
  const down = L>=3 && Math.random()<.3;                       // quelques suites qui descendent (niveau 4+)
  const start = down ? step*(n-1)+rnd(0,10) : rnd(0, 10);
  const terms = Array.from({length:n},(_,i)=> down ? start-step*i : start+step*i);
  const hole = L<2 ? n-1 : rnd(2,n-1);                         // niveau 1-2 : on cherche le dernier
  const answer = terms[hole];
  const parts = terms.map((v,i)=> i===hole ? '__' : v).join(' , ');
  return {kind:'seq', parts, answer};
}
function newQuestion(){
  const L = level();
  const m = mode==='mix' ? pick(['add','mul','seq']) : mode;
  current = m==='add' ? genAdd(L) : m==='mul' ? genMul(L) : genSeq(L);
  tries = 0; input = ''; locked = false;
  $('msg').textContent = '';
  $('help').classList.add('hidden');
  $('helpBtn').classList.toggle('hidden', current.kind!=='mul');
  renderQuestion();
  $('mascot').className = 'mascot';
}
function renderQuestion(reveal=false){
  const box = `<span class="box ${reveal?'reveal':''}" id="box">${reveal?current.answer:(input||'?')}</span>`;
  $('question').innerHTML = current.parts.replace(/\s{2,}/g,' ').replace('__',box);
}

/* ---------- Aide visuelle pour les multiplications ---------- */
function showHelp(){
  if(!current || current.kind!=='mul') return;
  const {a,b} = current;
  const groups = Array.from({length:a},()=>`<div>${'⭐'.repeat(b)}</div>`).join('');
  $('help').innerHTML = groups; $('help').classList.remove('hidden');
  $('msg').textContent = `${a} groupes de ${b} étoiles : compte-les ! ✨`;
}
$('helpBtn').onclick = () => { sfx.tap(); showHelp(); };

/* ---------- Validation ---------- */
function submit(){
  if(locked || input==='') return;
  const val = parseInt(input,10);
  if(val === current.answer) onCorrect(); else onWrong();
}
function onCorrect(){
  locked = true; stars++; streak++;
  sfx.good();
  $('mascot').className = 'mascot happy';
  $('msg').textContent = streak>=3 ? `${streak} bonnes réponses d'affilée ! 🔥` : pick(PRAISE);
  updateHud();
  if(stars % CONFIG.starsPerLevel === 0){
    timer = setTimeout(celebrate, 700);
  } else {
    timer = setTimeout(newQuestion, 1300);
  }
}
function onWrong(){
  tries++; streak = 0; updateHud();
  sfx.oops();
  $('mascot').className = 'mascot'; void $('mascot').offsetWidth; $('mascot').className = 'mascot oops';
  if(tries >= CONFIG.maxTries){
    locked = true; renderQuestion(true);
    $('msg').textContent = `C'était ${current.answer} ! On continue ensemble 🌈`;
    timer = setTimeout(newQuestion, 2600);
  } else {
    input = ''; renderQuestion();
    $('msg').textContent = pick(RETRY);
    if(current.kind==='mul') showHelp();
  }
}
function updateHud(){
  $('stars').textContent = stars; $('streak').textContent = streak;
  const L = level(), inLevel = stars % CONFIG.starsPerLevel;
  $('levelName').textContent = `Niveau ${L+1} · ${CONFIG.levelNames[L]}`;
  $('barFill').style.width = (inLevel / CONFIG.starsPerLevel * 100) + '%';
}

/* ---------- Mini-célébration à chaque palier ---------- */
function celebrate(){
  sfx.win(); confetti();
  const L = level();
  $('ovEmoji').textContent = ['🎉','🌟','🦋','🦄','👑'][Math.min(L,4)];
  $('ovTitle').textContent = `Bravo ! ${stars} étoiles !`;
  $('ovText').textContent = `Tu passes au niveau ${L+1} : ${CONFIG.levelNames[L]}`;
  $('overlay').classList.remove('hidden');
  timer = setTimeout(()=>{ $('overlay').classList.add('hidden'); newQuestion(); }, 3200);
}
const cv = $('confetti'), cg = cv.getContext('2d');
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#ff7eb6','#ffd24d','#6fddb9','#8fc7ff','#c79bff'];
  const ps = Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,
    s:rnd(6,12),c:pick(cols),vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  let t0 = performance.now();
  (function frame(now){
    cg.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cg.save();cg.translate(p.x,p.y);cg.rotate(p.r);cg.fillStyle=p.c;cg.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cg.restore();});
    if(now-t0<3000) requestAnimationFrame(frame); else cg.clearRect(0,0,cv.width,cv.height);
  })(t0);
}

/* ---------- Saisie : pavé visuel + clavier ---------- */
function press(k){
  if(locked) return;
  if(k==='ok'){ submit(); return; }
  if(k==='del') input = input.slice(0,-1);
  else if(input.length<3) input += k;
  sfx.tap(); renderQuestion();
}
document.querySelectorAll('.key').forEach(b => b.onclick = () => press(b.dataset.k));
document.addEventListener('keydown', e => {
  if($('game').classList.contains('hidden')) return;
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key==='Backspace') press('del');
  else if(e.key==='Enter'){ e.preventDefault(); press('ok'); }
});

/* ---------- Navigation ---------- */
function start(m){
  ctx(); mode = m; stars = 0; streak = 0;
  $('home').classList.add('hidden'); $('game').classList.remove('hidden'); $('homeBtn').classList.remove('hidden');
  updateHud(); newQuestion(); sfx.tap();
}
function goHome(){
  clearTimeout(timer); $('overlay').classList.add('hidden');
  $('game').classList.add('hidden'); $('home').classList.remove('hidden'); $('homeBtn').classList.add('hidden');
}
document.querySelectorAll('.mode').forEach(b => b.onclick = () => start(b.dataset.mode));
$('homeBtn').onclick = goHome;
</script>
</body>
</html>
