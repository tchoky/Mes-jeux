<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mes jeux</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: #f4f7fb;
      color: #1e293b;
      padding: 40px 20px;
      margin: 0;
    }
    header {
      max-width: 400px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { color: #2b547e; margin: 0; font-size: 1.7em; }
    .btn-params {
      background: #e2e8f0;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1.1em;
      cursor: pointer;
      color: #1e293b;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn-params:hover { background: #cbd5e1; }
    p.sous-titre { color: #64748b; margin-bottom: 25px; }
    .choix {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 360px;
      margin: 0 auto;
    }
    a.bouton {
      display: block;
      padding: 16px 20px;
      background: #2b547e;
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 1.15em;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(43, 84, 126, 0.15);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    a.bouton:hover { background: #1e3b59; transform: translateY(-2px); }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-overlay.actif { display: flex; }
    .modal {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      text-align: left;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-header h2 { margin: 0; font-size: 1.25em; color: #2b547e; }
    .btn-fermer { background: none; border: none; font-size: 1.3em; cursor: pointer; color: #64748b; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.9em; font-weight: 600; margin-bottom: 4px; color: #334155; }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1em;
      box-sizing: border-box;
    }
    .btn-ajouter {
      width: 100%;
      padding: 12px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-ajouter:hover { background: #15803d; }
    #erreur { color: #dc2626; font-size: 0.9em; font-weight: 600; min-height: 1.2em; margin-top: 6px; }
    .liste-gestion {
      margin-top: 20px;
      border-top: 1px solid #e2e8f0;
      padding-top: 12px;
      max-height: 180px;
      overflow-y: auto;
    }
    .item-jeu {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.95em;
    }
    .item-jeu small { color: #64748b; word-break: break-all; }
    .btn-suppr {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎮 Mes jeux</h1>
    <button class="btn-params" onclick="ouvrirParams()">⚙️ Paramètres</button>
  </header>

  <p class="sous-titre">Choisis le jeu auquel tu veux jouer :</p>

  <div class="choix" id="liste-jeux"></div>

  <div class="modal-overlay" id="modal-params">
    <div class="modal">
      <div class="modal-header">
        <h2>⚙️ Ajouter un jeu</h2>
        <button class="btn-fermer" onclick="fermerParams()">✖</button>
      </div>

      <div class="form-group">
        <label for="icone-jeu">Icône (emoji)</label>
        <input type="text" id="icone-jeu" placeholder="Ex: 🧩" value="🎯">
      </div>
      <div class="form-group">
        <label for="nom-jeu">Nom du jeu</label>
        <input type="text" id="nom-jeu" placeholder="Ex: Mots croisés">
      </div>
      <div class="form-group">
        <label for="fichier-jeu">Nom du fichier HTML (ou lien)</label>
        <input type="text" id="fichier-jeu" placeholder="Ex: motscroises.html ou https://…">
      </div>

      <button class="btn-ajouter" onclick="ajouterJeu()">➕ Ajouter à la liste</button>
      <div id="erreur" role="status"></div>

      <div class="liste-gestion" id="liste-gestion"></div>
    </div>
  </div>

  <script>
    // Jeux par défaut
    const jeuxParDefaut = [
      { icone: "🔤", nom: "Jeu de mots", fichier: "https://claude.ai/artifact/Xkf6BZQPshCAEub7kMZUPM" },
      { icone: "🪄", nom: "Pendu magique", fichier: "https://claude.ai/artifact/EHM4t8bH1q9Fh9wCVEj1xP" }
    ];

    // Charger depuis le stockage local ou utiliser ceux par défaut
    let jeux = jeuxParDefaut;
    try {
      jeux = JSON.parse(localStorage.getItem("mesJeuxListe")) || jeuxParDefaut;
    } catch (e) {}

    function sauvegarderEtAfficher() {
      try { localStorage.setItem("mesJeuxListe", JSON.stringify(jeux)); } catch (e) {}
      afficherJeux();
      afficherGestion();
    }

    function afficherJeux() {
      const conteneur = document.getElementById("liste-jeux");
      conteneur.innerHTML = "";
      jeux.forEach(jeu => {
        const lien = document.createElement("a");
        lien.className = "bouton";
        lien.href = jeu.fichier;
        lien.target = "_blank";
        lien.rel = "noopener";
        lien.textContent = `${jeu.icone} ${jeu.nom}`;
        conteneur.appendChild(lien);
      });
    }

    function afficherGestion() {
      const conteneur = document.getElementById("liste-gestion");
      conteneur.innerHTML = "<strong>Jeux enregistrés :</strong>";
      jeux.forEach((jeu, index) => {
        const div = document.createElement("div");
        div.className = "item-jeu";
        const span = document.createElement("span");
        span.textContent = `${jeu.icone} ${jeu.nom} `;
        const small = document.createElement("small");
        small.textContent = `(${jeu.fichier})`;
        span.appendChild(small);
        const btn = document.createElement("button");
        btn.className = "btn-suppr";
        btn.title = "Supprimer";
        btn.textContent = "✖";
        btn.onclick = () => supprimerJeu(index);
        div.append(span, btn);
        conteneur.appendChild(div);
      });
    }

    function ajouterJeu() {
      const icone = document.getElementById("icone-jeu").value.trim() || "🎮";
      const nom = document.getElementById("nom-jeu").value.trim();
      const fichier = document.getElementById("fichier-jeu").value.trim();

      if (!nom || !fichier) {
        document.getElementById("erreur").textContent = "Merci d’indiquer le nom du jeu et son fichier HTML.";
        return;
      }
      document.getElementById("erreur").textContent = "";
      jeux.push({ icone, nom, fichier });
      document.getElementById("nom-jeu").value = "";
      document.getElementById("fichier-jeu").value = "";
      sauvegarderEtAfficher();
    }

    function supprimerJeu(index) {
      jeux.splice(index, 1);
      sauvegarderEtAfficher();
    }

    function ouvrirParams() {
      document.getElementById("modal-params").classList.add("actif");
      afficherGestion();
    }

    function fermerParams() {
      document.getElementById("modal-params").classList.remove("actif");
    }

    afficherJeux();
  </script>

</body>
</html>
